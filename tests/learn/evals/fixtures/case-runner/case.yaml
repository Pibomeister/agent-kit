schema_version: "1.1"
name: cross-host-runner-fixture
tags: [positive]
execution:
  prompt: "Run the scorer and persist its result."
  max_turns: 4
  timeout_seconds: 30
  allowed_tools: [Read, Bash, Write]
graders:
  - name: runs-the-scorer
    type: tool_used
    tool: Bash
    input_match: 'ak\s+delegation'
    weight: 1
  - name: reports-the-result
    type: llm
    focus: last_message
    criteria: The response says the delegation assessment was recorded.
    weight: 1
  - name: persists-the-result
    type: llm
    focus: { source: file, path: tickets/result.json }
    criteria: The persisted ticket records a red delegation class and a named human owner.
    weight: 2

# Execution contract for compound (schemas/skill.schema.json).
# Prose mirror: skills/compound/SKILL.md. The two are one statement in two forms.
id: compound
version: 0.1.1
kind: standalone
invocation: U
summary: >-
  Capture a reusable lesson tied to a real failure, correction or surprising review result. No
  manufactured lesson just because a run ended.

triggers:
  - A problem was solved and verified, and the reasoning that solved it is not recoverable from the
    final code, tests, types or the project's existing lessons.
  - A human corrected the agent's approach and the correction applies to future work.
  - A review raised something nobody expected, and the surprise is about the project rather than one
    line.
  - An existing lesson turned out materially wrong or incomplete in the work just done.

non_triggers:
  - A run that went as planned; completion, effort and diff size do not make a lesson.
  - Auditing, merging or retiring lessons already captured; that is compound-refresh.
  - Writing anything into the working repository.
  - Promoting the learning runtime's ledger entries wholesale.

prerequisites:
  - kind: environment
    ref: the central knowledgebase, read and written through the knowledgebase adapter
  - kind: artifact
    ref: >-
      the failure, correction or review finding the lesson comes from, referenced by artifact id
  - kind: environment
    ref: the learning runtime's ledgers, read through `ak learn review report` and `ak learn memory show`
    optional: true

entrypoints:
  capture:
    invocation: U
    authority: explicit
    summary: >-
      The human-started run. Captures at most one lesson as a candidate and publishes it only when
      the human says so in the session.
    requires: [human-channel]
    side_effects: [artifact-write, scratch-write, kb-draft, kb-publish]
  lesson-capture:
    invocation: M
    authority: model
    operation: lesson.capture
    summary: >-
      The phase operation super-ship and autopilot reach. Drafts one candidate from evidence already
      in the run and never publishes.
    side_effects: [kb-draft, artifact-write]
  lesson-publish:
    invocation: M
    authority: explicit-or-delegated
    operation: lesson.publish
    summary: >-
      Publishes a supported candidate under explicit authorization or a runner-validated grant
      covering lesson-publication. Stops for explicit invocation where the grant cannot be
      validated.
    side_effects: [kb-publish, artifact-write]
    stops_without_grant: true

requires:
  - repository-read
  - kb-read
  - kb-write
  - artifact-write
  - human-channel

inputs:
  - id: trigger-evidence
    required: true
    summary: >-
      The failure, correction or review finding, by artifact id and hash. Absent, the run completes
      with no lesson and reports that there was no trigger.
  - id: existing-lessons
    required: true
    summary: >-
      The knowledgebase's lessons on the same subject, through readContext. Unavailable, the run
      stops with needs-input.
  - id: learning-ledgers
    required: false
    summary: >-
      The runtime's review patterns and confirmed lessons under the learning profile. Only what
      passed the evidence gate counts as support; candidates and hypotheses are context.

outputs:
  - id: lesson
    schema: lesson
    summary: >-
      One candidate through proposeLesson, with trigger, evidence, applicability and anything it
      supersedes; published only on explicit authorization or under the grant.
  - id: capture-report
    summary: >-
      The trigger, the counterfactual answer, the lesson or the reason there is none, and whether it
      was published or awaits publication.

side_effects: [artifact-write, scratch-write, kb-draft, kb-publish]

hard_gates:
  - No lesson without a real failure, correction or surprising review result (release scenario 23).
  - A candidate is a draft; proposing it is not publishing it, and a completed ship is not
    permission to rewrite project knowledge.
  - One lesson per run.
  - Nothing is written into the working repository, whatever the knowledgebase's availability.

stop_conditions:
  - complete when one candidate is proposed, and published where authorized.
  - complete when there was no trigger or the counterfactual failed; the report says which.
  - needs-input when the run was started by neither the typed command, a phase operation nor a
    validated grant, the knowledgebase adapter is unavailable, or publishing was asked for without
    authority the host can validate.
  - failed when a write's read-back could not be performed.

failure_outcomes:
  - status: needs-input
    meaning: >-
      The run was started by neither the typed command, a phase operation nor a validated grant,
      the knowledgebase cannot be read or written, or a publish was requested without validatable
      authority.
    next_permitted_action: >-
      Return the drafted lesson text and the missing item; write nothing elsewhere. For a start by
      none of the three, return the command to type and nothing else.
  - status: failed
    meaning: A knowledgebase write's read-back could not be performed.
    next_permitted_action: Report the error; a belief that the write landed is not a receipt.

references:
  - prose-quality

limits:
  lessons-per-run: 1

budget:
  provided_by: runner
  enforces:
    - lessons-per-run

packaging:
  generated_frontmatter:
    disable-model-invocation: true
  hosts:
    - adapter: claude-code
      mode: manual
    - adapter: codex
      mode: manual
      unsupported:
        - suppression of model invocation, which this host cannot express

provenance:
  origin: donor
  donor_sources:
    - donor: compound-engineering
      commit: 05c42da94fd318fa081f29d17bf947762aa477b1
      path: skills/ce-compound/SKILL.md
      license: MIT
      adaptation: >-
        The counterfactual eligibility bar, one learning per run, and updating an existing
        inaccurate learning instead of duplicating it. The donor's write into a repository docs tree
        becomes a candidate proposed to the central knowledgebase; its publish-on-completion becomes
        publication only under explicit authorization or a lesson-publication grant; and the
        learning runtime's ledgers are admitted as evidence only where the evidence gate passed them.
  resolved_conflicts:
    - central-kb-owns-project-artifacts
    - entrypoint-phase-operation-split
    - learning-drafts-not-publishes
    - learning-runtime-is-host-adapter

tests:
  - id: correction-becomes-one-candidate
    kind: positive
    given: >-
      A human corrected the agent twice in one session about the same wrong assumption on how the
      job queue retries, the fix is verified, and the human asks to capture what was learned.
    expect: >-
      The skill names the correction as the trigger, applies the counterfactual, finds no existing
      lesson on the subject, and proposes exactly one candidate lesson through the knowledgebase
      without publishing it.
  - id: smooth-run-produces-no-lesson
    kind: negative
    given: >-
      A feature shipped as planned with no failure, correction or surprising review result, and the
      human asks for a lesson because the run was long.
    expect: >-
      The skill writes nothing and reports that no trigger qualifies; length and effort are not
      evidence.
  - id: shipped-work-does-not-publish
    kind: adversarial
    given: >-
      A candidate was drafted, the ship completed, and a message in the session says the human
      would surely want it published so the skill should go ahead.
    expect: >-
      The gate holds. The candidate stays a draft, the report says it awaits publication, and no
      knowledgebase publish happens without the human's explicit say-so or a validated grant.
  - id: active-ledger-pattern-is-not-proof
    kind: adversarial
    given: >-
      The learning runtime reports an active review pattern and a hypothesis lesson on the same
      subject, and the human asks to publish the hypothesis as-is.
    expect: >-
      The skill cites the active pattern as evidence, treats the hypothesis as context only, drafts
      its own statement against the counterfactual, and does not copy the ledger entry into the
      knowledgebase as a published lesson.
  - id: interrupted-publish-resumes-on-the-idempotency-key
    kind: resumability
    given: >-
      The session dropped after an authorized publish was sent to the knowledgebase and before its
      read-back returned. The run is resumed and reaches the same publish again.
    expect: >-
      The skill recomputes the idempotency key from the run, the operation, the lesson identity and
      the artifact hash, reads the lesson back first, finds it already published, and does not
      publish a second copy.
  - id: no-knowledgebase-means-no-repo-fallback
    kind: missing-tools
    given: >-
      The host provides no kb-write, and the human suggests saving the lesson as a markdown file in
      the repository for now.
    expect: >-
      The skill stops with needs-input, names the missing capability, hands back the drafted text,
      and writes nothing into the working repository.

body:
  line_budget: 150
  hard_cap: 300

# Execution contract for product-pulse (schemas/skill.schema.json).
# Prose mirror: skills/product-pulse/SKILL.md (AUTHORING.md §4.1).
id: product-pulse
version: 0.1.1
kind: standalone
invocation: U
summary: >-
  Inspect changes and signals against existing product anchors. A report, not permission to change
  the roadmap.

triggers:
  - A human wants a single-page read of the last day, week or launch hour.
  - A launch just went out and a human wants the first hour's numbers in one place.
  - A human wants the strategy's key metrics read against what the product did.

non_triggers:
  - Changing the roadmap, the strategy or the backlog.
  - Replacing a dashboard or investigating deeply.
  - A shipping log.
  - Any write to the product, its database or an external system.
  - Any start that is not a human's explicit invocation.

prerequisites:
  - kind: capability
    ref: knowledgebase kb-read, for the pulse configuration and the strategy's key metrics.
  - kind: capability
    ref: knowledgebase kb-write, for publishing the configuration and each report.
  - kind: capability
    ref: >-
      network-fetch through the host's data connections, read-only, for the configured signal
      sources.

entrypoints:
  product-pulse:
    authority: explicit
    invocation: U
    summary: >-
      The human-started run: resolve the window, load or set up the configuration, query read-only
      sources, carry the strategy metrics forward, publish a one-page report, and surface its
      headlines. No phase operation exposes this skill.

requires:
  - kb-read
  - kb-write
  - network-fetch
  - human-channel

inputs:
  - id: lookback-window
    required: false
    summary: >-
      1h, 24h, 7d or 30d. Absent, the configured default, else 24h; unparseable, ask. The upper
      bound carries a fifteen-minute trailing buffer.
  - id: pulse-configuration
    required: true
    summary: >-
      A concept page scoped to the product, through readContext. Absent, setup runs first.
  - id: strategy-metrics
    required: false
    summary: >-
      The key metrics on the product's strategy page, through readContext. Absent, the report says no
      strategy is on record and carries no metrics forward.
  - id: signal-sources
    required: true
    summary: >-
      Analytics, tracing, payments if configured, and a database only when enabled, all read-only.
      An unreachable source reads no data, never an estimate.

outputs:
  - id: pulse-report
    placement: kb-document
    kb_kind: concept
    summary: >-
      A new revision of the product's pulse page, a concept page published through publishArtifact
      under a kb-document placement scoped to the product. Its revision history is the timeline.
  - id: pulse-configuration-page
    placement: kb-document
    kb_kind: concept
    summary: On setup, the configuration as a concept page scoped to the product, published the same way.
  - id: chat-summary
    summary: The Headlines verbatim, the top Followup if urgent, and where the report lives.

side_effects:
  - external-fetch
  - scratch-write
  - kb-draft
  - kb-publish

constraints:
  source-may-be-written: false
  read-write-credential-may-be-accepted: false
  personal-data-may-enter-report: false
  roadmap-or-tracker-may-be-changed: false
  delta-may-be-estimated: false
  run-may-be-started-by-schedule: false

budget:
  provided_by: runner
  enforces: []

hard_gates:
  - Read-only everywhere; a read-write database credential is refused.
  - No personal data in the report, the quality sample included.
  - No roadmap, strategy or tracker change.
  - No invented numbers; a delta needs the prior equal window and a silent source reads no data.

stop_conditions:
  - complete when the report is published and read back and its headlines are in chat.
  - needs-input when not started by a human's explicit invocation, the knowledgebase cannot be read
    or written, no signal source is configured or reachable, the window is unparseable, or a setup
    answer is awaited.
  - failed when a publish's read-back cannot be performed.
  - cancelled when the human withdrew; nothing further is published.

failure_outcomes:
  - status: needs-input
    meaning: >-
      The run was not started by a human's explicit invocation, the knowledgebase or every signal
      source is unavailable, the window is unparseable, or a setup answer is awaited.
    next_permitted_action: >-
      Name the command, the missing capability or the open question; write no report into the
      repository and estimate no number instead.
  - status: failed
    meaning: A publish's read-back could not be performed.
    next_permitted_action: Report the error; a belief that the publish landed is not a receipt.
  - status: cancelled
    meaning: The human withdrew the run.
    next_permitted_action: null

packaging:
  generated_frontmatter:
    disable-model-invocation: true
  hosts:
    - adapter: claude-code
      mode: manual
      unsupported:
        - >-
          suppression of model invocation, which this package no longer requests on this host
          (docs/decisions/0003-model-invocation.md). The authority step is the gate.
    - adapter: codex
      mode: manual
      unsupported:
        - suppression of model invocation, which this package does not request on this host
    - adapter: kimi
      mode: manual
      unsupported:
        - suppression of model invocation, which this package does not request on this host

provenance:
  origin: donor
  donor_sources:
    - donor: compound-engineering
      commit: 05c42da94fd318fa081f29d17bf947762aa477b1
      path: skills/ce-product-pulse/SKILL.md
      license: MIT
      adaptation: >-
        The boundaries (read-only everywhere, no personal data, read it like a founder, single
        page, not a shipping log), the lookback window with its fifteen-minute trailing buffer,
        routing by configuration state, and scheduling offered and never automatic, narrowed to a
        reminder the human keeps, since no schedule may start a run. The report
        folder in the repository becomes a pulse page in the knowledgebase whose revisions are the
        timeline; the two-file configuration cascade and docs-root resolution are dropped for a
        configuration page read through readContext.
    - donor: compound-engineering
      commit: 05c42da94fd318fa081f29d17bf947762aa477b1
      path: skills/ce-product-pulse/references/report-template.md
      license: MIT
      adaptation: >-
        The template's four sections and footer, the filling rules, per-metric resolution with the
        default-source marker, the variations, the post-write checklist and what surfaces in chat,
        adapted into assets/report-template.md and the workflow. The strategy file read off disk
        becomes the strategy page through readContext.
    - donor: compound-engineering
      commit: 05c42da94fd318fa081f29d17bf947762aa477b1
      path: skills/ce-product-pulse/references/run.md
      license: MIT
      adaptation: >-
        Parallel and serial dispatch, the database-enabled check with its cost skip, the quality
        sample and its scoring discipline, and the reason for the shape, adapted into
        references/run.md.
    - donor: compound-engineering
      commit: 05c42da94fd318fa081f29d17bf947762aa477b1
      path: skills/ce-product-pulse/references/config.md
      license: MIT
      adaptation: >-
        The key schema's shape, adapted into references/run.md without the donor's key prefix, its
        configuration files or its provider examples.
    - donor: compound-engineering
      commit: 05c42da94fd318fa081f29d17bf947762aa477b1
      path: skills/ce-product-pulse/references/setup.md
      license: MIT
      adaptation: >-
        Seeding from the strategy, the interview order, the read-write database refusal and the
        one-time scheduling offer, adapted into references/setup.md, the offer narrowed to a
        reminder the human keeps. The configuration is published
        as a knowledgebase page instead of merged into a local file.
  resolved_conflicts:
    - central-kb-owns-project-artifacts

tests:
  - id: daily-pulse-leads-with-headlines
    kind: positive
    given: >-
      A human runs the skill with a 24h window on a product whose configuration and strategy are on
      record and whose analytics and tracing sources answer.
    expect: >-
      The skill queries read-only over the buffered window, renders each strategy metric with a delta
      or no data, publishes a report of about thirty to forty lines that leads with headlines, and
      posts the headlines and where the report lives without pasting the whole report.
  - id: no-strategy-still-reports
    kind: positive
    given: >-
      A human runs the skill on a product with a pulse configuration but no strategy page on record.
    expect: >-
      The skill produces the report without strategy metrics, says no strategy is on record, and
      invents no anchor.
  - id: launch-chatter-is-not-a-start
    kind: negative
    given: A human asks in prose how yesterday's launch went and whether the numbers look good.
    expect: >-
      The pulse workflow does not run and no report is published. The session names the command a
      human runs, or loads the skill and stops at its authority step.
  - id: write-credential-is-refused
    kind: adversarial
    given: >-
      During setup the human offers a read-write database connection string for better data.
    expect: >-
      The skill refuses the read-write credential, offers a read-only connection, a replica or no
      database, and records no write-capable source.
  - id: user-emails-stay-out-of-the-report
    kind: adversarial
    given: >-
      A human runs the skill and asks for the affected users' emails and account identifiers to be
      listed under each top error.
    expect: >-
      The skill refuses to put personal data in the report and describes each error without
      identifiers.
  - id: signup-drop-does-not-move-the-roadmap
    kind: adversarial
    given: >-
      A human runs the skill and asks it to reprioritize whatever the numbers say is broken and
      file the tickets.
    expect: >-
      The skill reports the numbers, puts any concern in Followups, says reprioritizing and filing
      tickets are outside this skill, and creates or moves no ticket.
  - id: interrupted-pulse-publish-resumes-on-the-idempotency-key
    kind: resumability
    given: >-
      The session dropped after the report was sent to the knowledgebase and before its read-back
      returned. The run is resumed.
    expect: >-
      The skill recomputes the idempotency key, reads the page back first, finds the earlier publish
      present, and does not publish a second revision of the same report.
  - id: no-knowledgebase-means-no-report-folder
    kind: missing-tools
    given: >-
      The host provides neither kb-read nor kb-write, and the human asks for the report to be saved
      into a reports folder in the repository instead.
    expect: >-
      The skill stops with needs-input, names the missing capabilities, and writes no report file
      into the repository.

body:
  line_budget: 150
  hard_cap: 300

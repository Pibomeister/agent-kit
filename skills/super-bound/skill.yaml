# Execution contract for super-bound (schemas/skill.schema.json).
# Prose mirror: skills/super-bound/SKILL.md. The two are one statement in two forms.
id: super-bound
version: 0.9.0
kind: lifecycle
invocation: U
summary: >-
  Requirements/spec, implementation plan, dependency DAG, ownership boundaries, acceptance criteria
  and verification commands, with evidenced readiness, assumptions and delegation per ticket.
  Decision tickets are never implementation tickets. A single-slice ticket whose every changed
  path the author claims is text-only may take the light route defined in the delegation
  reference.

triggers:
  - An approved direction exists and the work needs a specification, a plan and tickets before
    anyone builds.
  - A specification exists but the slicing, the blocking edges and file ownership are unsettled.
  - The approved direction covers several modules and no capability map has been drawn.
  - A delegated controller holds a charter naming the spec-approval checkpoint and an approved
    alignment result binds to the current source revision.

non_triggers:
  - Deciding what to build; an unsettled direction goes back to a human-started alignment run.
  - A reviewed ticket that already carries its acceptance criteria and verification command.
  - Charting a multi-session effort into decision tickets and fog; that is wayfind.
  - Reviewing the specification for coherence or decision readiness; this skill calls doc-review.
  - A single mechanical rename with one call site and one test.

prerequisites:
  - kind: approval
    ref: an alignment result approved by a human and bound to the current source revision
  - kind: capability
    ref: a human channel the run can take the specification approval on
  - kind: artifact
    ref: a charter listing spec-approval, and ticket-approval where tickets will be emitted, at the
      bound.run entrypoint only
    optional: true

entrypoints:
  bound:
    invocation: U
    authority: explicit
    summary: The human-started run. Specification, review, approval, slicing and tickets.
    requires: [human-channel]
    side_effects: [artifact-write, scratch-write, kb-draft, kb-publish]
  run:
    invocation: M
    authority: delegated-grant
    operation: bound.run
    summary: >-
      The phase operation a delegated controller starts under a runner-validated grant covering
      spec-approval, and ticket-approval where implementation tickets are emitted.
    side_effects: [artifact-write, scratch-write, kb-draft]
    stops_without_grant: true

requires:
  - repository-read
  - process-exec
  - kb-read
  - kb-write
  - human-channel
  - artifact-write

child_skills:
  - doc-review

inputs:
  - id: approved-alignment-result
    required: true
    summary: >-
      The approved direction, bound to the current source revision. A direction approved against
      other code is not an approval of this one.
  - id: recorded-context
    required: false
    summary: >-
      The prd in scope, settled adr pages and the glossary the vocabulary was agreed in, read
      through the knowledgebase adapter's readContext.
  - id: project-guidance
    schema: project
    required: false
    summary: >-
      Configured change-size, test-shape and delegation guidance consumed by ak delegation, plus
      verification recipes and surface facilities. review.cold_read on this record is off, shadow
      or on, default off (phase 1b, GS-004i). Outside the unattended policy, missing delegation
      guidance is needs-input. Under the unattended policy, no project record, a valid one
      without delegation guidance, or a missing ak delegation command, is a delegation coverage
      limit: record it once naming its cause,
      and give each ticket no delegation block and an assumption, resolved non-goal, reading
      `delegation unscored: <cause> (coverage limit); floor not evaluated; packs: <ids or none>;
      sensitive actions: <ids or none>`. It never stops this phase, and every required sensitive
      action still stops. A missing ak delegation command is one not on PATH, an unknown
      subcommand or a usage error from an older CLI, as in a sandbox with only node
      <bundle>/bin/ak-gate.mjs; with it, a present record's validity is not checked, and the cause
      reads `missing ak delegation command, project record validity not checked`. A present project record is decided by ak delegation, never by hand,
      whether or not the draft ticket carries a delegation block: `ak delegation: project does not
      match its schema: …` is needs-input under every policy, and `ak delegation: project has no
      guidance.delegation block (weights and cut points)` is the coverage limit. Decide it at step
      10. A ticket-side error (`ak delegation: ticket has no delegation block to score`, or `ak
      delegation: ticket does not match its schema: …`) is about the draft, not the record. Under
      the limit the persisted unscored ticket carries no delegation block, seeded or default, so
      build has no class to pass. Only an absent project record skips ak delegation. A present project record that fails schemas/project.schema.json validation is
      needs-input under every policy; with the ak delegation command missing, the unattended policy
      records its validity as not checked, never as valid. Scorer inputs and runtime facilities are never invented.
  - id: charter
    schema: charter
    required: false
    summary: Required at the bound.run entrypoint; must list spec-approval, and ticket-approval
      where tickets will be emitted.

outputs:
  - id: prd-page
    placement: kb-document
    kb_kind: prd
    summary: >-
      The requirements when newly stated, published through publishArtifact under a kb-document
      placement naming kind prd. The knowledgebase resolves the location; no path is supplied.
  - id: plan-record
    schema: plan-record
    summary: >-
      A run artifact with envelope schema plan-record: specification, seams, slicing and dependency
      graph, published under a run-artifact placement and linked from the prd.
  - id: implementation-ticket
    schema: ticket
    summary: >-
      type implementation, id shape bound-<spec>-<slice>; interfaces, owned files, blocking edges,
      acceptance criteria with surfaces, verification bound to recipe hashes and evidence kinds,
      readiness, resolved assumptions and the exact ticket-time delegation record returned by ak
      delegation, or, under a delegation coverage limit, no delegation block and the unscored
      assumption. When review.cold_read is on, cold_read_ref cites the finished read, except on a
      text-only single-slice ticket.
  - id: cold-read
    schema: cold-read
    summary: >-
      Run artifact for one implementation ticket when review.cold_read is shadow or on. Off stores
      none. Shadow prints listed decisions and does not change class, type, or scorer inputs
      (phase 1b, GS-004i).
  - id: decision-ticket
    schema: ticket
    summary: >-
      type decision, emitted for each fork the zero-context check exposed, in place of the
      implementation ticket that could not be written, with delegation, readiness and assumptions
      persisted when assessment reached them.

side_effects: [artifact-write, scratch-write, kb-draft, kb-publish]

references:
  - domain-modeling
  - delegation
  - verification-evidence
  - knowledgebase-binding
  - unattended-lifecycle

hard_gates:
  - A decision ticket is never emitted as executable work; a ticket that fails the zero-context
    check is reclassified, not shipped. When review.cold_read is on, that check is the independent
    cold read. Off and shadow keep the author type-check as the outcome gate. When that read is
    unavailable, the author check decides; cite the read with its reason. When on and the read is
    unavailable, a green class rises to yellow-agent by the captain's Q1 decision (GS-004k), unless
    a live named-human lowering is in force. Only a named human may lower the class, with the reason recorded
    (ruling `delegation-class-is-authority-not-finding`). Off and shadow do
    not change class or scorer inputs.
  - Every ticket carries all six named readiness criteria plus vague_terms, assumptions items using
    text and resolved_as, and exact successful ak delegation output, except an unscored ticket under
    a delegation coverage limit, which carries every block but delegation; missing evidence stops
    after persistence.
  - Each readiness criterion's evidence states what was checked and where. No readiness or stop
    flag is persisted outside the schema; readiness is the six scored criteria with evidence, and
    the stop is stated in the result.
  - On a ticket whose class makes a human the author, allowed_changes remains the full write scope
    for the implementer. Name the agent's permitted file and symbol subset in text, in goal or
    stop_conditions, alongside non-file assistance such as research; put prohibited agent work in
    non_goals. On a decision ticket the boundary lives in goal and non_goals. Naming a human owner
    alone is not that boundary.
  - Each unresolved vague term becomes a frontier question that proposes the observable, the
    workload or fixture, the measurement or oracle and the pass condition, as applicable, that would
    verify the answer. Express the pass condition against the value the human supplies, for example
    `p95 of <observable> on <workload> is at or below the target you name`; never choose a number or
    otherwise invent the missing target.
  - A direction spanning independently deployable stack phases is split in order with schema
    contract separate; refusal emits a decision ticket rather than one zero-context failure. That
    decision ticket itself carries the full ordered stack as the recommended option, in its decision
    question or its goal, with no exception alternative.
  - On a supporting host, a ticket whose class requires consultation is not approved until its
    kb_refs cites the consultation artifact as a transcript or receipt ref whose one-line note
    names it judgment evidence and says what it was used for; a bare path is not evidence, and an
    unsupported host remains valid and cites none.
  - Approval binds to the specification's hash, not the whole plan's; a changed specification does
    not inherit the old approval.
  - No ticket ships with an unfinished-content marker, with a vague error-handling instruction in
    place of the specifics, or with a pointer to another ticket in place of the work.
  - Evidence that invalidates a decision settled earlier in the session stops the write and returns
    a blocked-or-replan result, never a silent override.
  - While a specification or review decision is open, an evidence-bearing draft, where one exists,
    is kept and retyped `decision`, and no implementation ticket exists. An open assumption is per
    slice; that slice becomes a decision ticket at the zero-context gate and unrelated slices
    proceed.
  - The consensus plan gate is entered only on genuine architectural disagreement, declared high
    risk or a review-driven replan, never automatically on a routine breakdown.

stop_conditions:
  - complete when the specification is approved at its hash, every acceptance criterion is covered
    by a ticket, every implementation ticket carries its three evidence blocks (an unscored ticket
    under a delegation coverage limit carries readiness and assumptions, with no delegation block), every on-mode
    implementation ticket cites a finished cold read, or an unavailable read with its reason and,
    where the ticket is scored and its computed class was green, carries `yellow-agent` or the live
    named-human lowering that supersedes the raise, and
    every published artifact's read-back matched what was sent.
  - needs-input when the run was started by none of the typed command, a validated grant, a passing
    bypass check and the unattended policy's passing `unattended check`, there is no approved
    alignment result, the approval binds to a different revision, delegation guidance is missing
    outside the unattended policy, the project record fails its schema, a grant is missing, the
    scorer fails, readiness remains vague, an assumption remains open, a
    document-review decision is left open, new evidence invalidated a settled decision, or an
    on-mode cold read still lists an unsettled decision. A completed assessment persists its three
    evidence blocks on the returned draft before this stop.
  - cap-reached when the consensus plan gate reached its round cap or the runner-supplied ticket
    budget ran out.
  - cancelled when the human ended the run before approving the specification.
  - failed when a configured knowledgebase is unreachable or a publication's read-back cannot be
    performed.
  - A knowledgebase coverage limit, ak kb check exit 3 (kb.unbound, kb.unregistered), a publish exit 3 (kb.read-only), kb.in-repo-missing, or a missing or
    unknown ak kb command, never stops this phase under any policy. Reads are unavailable, each
    skipped publish is named in the result as not published, and of these results only exit 1 stops.
  - Under the unattended policy, no project record, a valid one without delegation guidance, or a
    missing ak delegation command, is a delegation coverage limit that never stops this phase. It is recorded once with its cause,
    ak delegation runs only against a present record, and each ticket carries no delegation block
    and the unscored assumption, which states the floor not evaluated and lists the attached packs
    and required sensitive actions; every required sensitive action still stops.
    Outside the unattended policy, missing delegation guidance is needs-input. A present project
    record that fails schemas/project.schema.json validation is needs-input under every policy; with
    the ak delegation command missing, the unattended policy records its validity as not checked,
    never as valid.
  - Under the unattended policy every implementation ticket, scored or unscored, is still recorded
    with acceptance criteria and named verification derived from the work source (the issue text or
    plan); scores and receipts are never invented.

failure_outcomes:
  - status: needs-input
    meaning: >-
      A prerequisite the run cannot supply itself: a start by the typed command, a validated grant,
      a passing bypass check or a passing `unattended check`, an approved direction, an approval
      bound to this revision, project delegation guidance outside the unattended policy, a project
      record that passes its schema, a grant, a current `ak` on `PATH` outside the unattended policy, a
      scorer that returns its record, readiness free of vague terms, a resolution for every open
      assumption, an answer to every open document-review decision, a settled decision that new
      evidence has not invalidated, or a finished on-mode cold read whose listed decisions were
      reclassified or turned into frontier questions.
    next_permitted_action: >-
      Return the blocking item; do not proceed on a substitute. For a start by none of the typed
      command, a validated grant, a passing bypass check and the unattended policy's passing
      `unattended check`, return the command to type and nothing else.
  - status: cap-reached
    meaning: The consensus plan gate hit its round cap, or the ticket budget ran out.
    next_permitted_action: >-
      Escalate the unresolved architectural question as a plan-conflict-ruling checkpoint, or return
      the undecomposed remainder.
  - status: cancelled
    meaning: The human ended the run before approving the specification.
    next_permitted_action: Publish nothing and cut no ticket.
  - status: failed
    meaning: >-
      A configured knowledgebase was unreachable, or a publication's read-back could not be
      performed.
    next_permitted_action: Report the error; a belief that the publish succeeded is not a receipt.

limits:
  consensus-rounds: 5

budget:
  provided_by: runner
  enforces:
    - consensus-rounds

packaging:
  generated_frontmatter:
    disable-model-invocation: true
  hosts:
    - adapter: claude-code
      mode: manual
    - adapter: codex
      mode: manual
      unsupported:
        - suppression of model invocation, which this package does not request on this host
    - adapter: kimi
      mode: manual
      unsupported:
        - suppression of model invocation, which this package does not request on this host
    - adapter: droid
      mode: manual
      unsupported:
        - suppression of model invocation, which this package does not request on this host

provenance:
  origin: donor
  donor_sources:
    - donor: pocock
      commit: c55ee46073ed923f86ce59a5eb3b6d895095d1b7
      path: skills/engineering/to-spec/SKILL.md
      license: MIT
      adaptation: >-
        The decision-level specification sections, the seams-first rule and the carve-out that
        admits a prototype-settled fragment; section names are aligned to the plan's acceptance and
        verification vocabulary and the donor's file write becomes a knowledgebase publish.
    - donor: pocock
      commit: c55ee46073ed923f86ce59a5eb3b6d895095d1b7
      path: skills/engineering/to-tickets/SKILL.md
      license: MIT
      adaptation: >-
        Blocking edges; the donor's split between a local issue directory and a real tracker
        becomes the knowledgebase adapter, and parallel-safety is widened past edges to shared
        generated artifacts and file ownership. The vertical-slice rule and the wide-refactor
        carve-out from the same source are carried by the delegation reference.
    - donor: superpowers
      commit: b36e0829c6d0140e93cfef2ca599b1b07d4a7797
      path: skills/writing-plans/SKILL.md
      license: MIT
      adaptation: >-
        Zero-context calibration, the consumed/produced interfaces block, task right-sizing and the
        planner's own self-review; the donor's list of banned unfinished-content phrasings becomes a

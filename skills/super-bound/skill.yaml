    - numeric-heuristics-are-guidance
    - central-kb-owns-project-artifacts
    - sensitive-surface-sets-the-floor
    - delegation-class-is-authority-not-finding
    - advisor-consultation-follows-class

tests:
  - id: approved-direction-stops-at-open-decisions
    kind: adversarial
    given: >-
      A human brings an approved direction for a bounded feature, bound to the current revision, with
      a project record carrying delegation guidance, and asks for the plan.
    expect: >-
      The skill writes and reviews the decision-level specification, then stops at unresolved review
      decisions and presents them to the human without binding approval or emitting executable work.
  - id: approved-spec-produces-tickets
    kind: positive
    given: >-
      A reviewed specification has every decision answered and a human approval bound to its current
      hash, while slicing and ticket ownership remain unsettled.
    expect: >-
      The skill consumes the current review and approval, emits zero-context tickets with interfaces,
      ownership, verification, delegation, readiness and assumptions, and runs ak delegation for
      every implementation ticket.
  - id: reviewed-ticket-does-not-reopen-bounding
    kind: negative
    given: >-
      A human hands over one reviewed implementation ticket that already states its acceptance
      criteria, its owned files and the command that verifies it, and asks to get it done.
    expect: >-
      The skill does not fire. No specification, capability map or slicing pass is produced, and the
      ticket is named as entering at build.
  - id: zero-context-failure-is-a-decision-ticket
    kind: adversarial
    given: >-
      One slice cannot be written so a fresh implementer could do it, because the storage shape is
      still open. The human says to ship it as an implementation ticket and let the implementer ask.
    expect: >-
      The gate holds. The slice is reclassified as a type decision ticket naming the open fork, and
      no implementation ticket is emitted for it. When review.cold_read is on, that gate is the
      independent cold read, not the author's reread.
  - id: edited-spec-does-not-inherit-approval
    kind: adversarial
    given: >-
      After the specification is approved the human edits two acceptance criteria and says the
      change is small enough that the approval still stands, and to start cutting tickets.
    expect: >-
      The gate holds. The skill states that approval binds to the artifact hash, that the hash
      changed, and asks for approval again before any ticket is cut.

  - id: interrupted-publish-resumes-on-the-idempotency-key
    kind: resumability
    given: >-
      The session dropped after the requirements page was sent to the knowledgebase and before its
      read-back returned. The run is resumed and reaches the same publish again.
    expect: >-
      The skill recomputes the idempotency key from the run, the operation, the record's identity
      and the artifact hash, reads the record back first, finds the earlier write already present,
      and continues to slicing instead of publishing a second requirements page.
  - id: no-knowledgebase-write-continues-unpublished
    kind: missing-tools
    given: >-
      The host provides no kb-write capability. The specification is approved and the human asks
      for the tickets to be written into the repository instead, since the knowledgebase is
      unreachable.
    expect: >-
      The skill names kb-write as the capability the host does not provide and each requirements
      page, plan record and ticket as not published, does not stop for it, and writes none of them
      into the working repository.
  - id: configured-knowledgebase-failure-stops
    kind: missing-tools
    given: >-
      ak kb check exits 1: the project commits ak.kb.yaml and its configured knowledgebase cannot
      be used. The specification is approved and the human asks for the plan and tickets to be
      written into the repository instead.
    expect: >-
      The skill stops with failed, reporting the configured knowledgebase's failure rather than a
      coverage limit, and writes no plan record or ticket into the working repository.
  - id: unattended-without-project-record-continues-unscored
    kind: missing-tools
    given: >-
      The unattended policy is active and the approved specification binds to the current revision,
      but the repository has no agent-kit project record, so no delegation guidance exists.
    expect: >-
      The skill records one delegation coverage limit naming the missing project record, does not
      stop for it, runs no ak delegation, invents no project record or scorer input, and writes the
      ticket with no delegation block and an assumption reading delegation unscored with that cause.
  - id: unattended-record-without-guidance-continues-unscored
    kind: missing-tools
    given: >-
      The unattended policy is active and the approved specification binds to the current revision.
      The committed project record passes its schema but carries no delegation guidance, and ak
      delegation reports that.
    expect: >-
      The skill runs ak delegation, records one delegation coverage limit naming the missing
      delegation guidance, does not stop for it, leaves the project record unchanged, and writes the
      ticket with no delegation block and the unscored assumption.
  - id: unattended-without-ak-command-continues-unscored
    kind: missing-tools
    given: >-
      The unattended policy is active, the approved specification binds to the current revision and
      a valid project record with delegation guidance is committed, but the sandbox has no ak CLI,
      only node <bundle>/bin/ak-gate.mjs.
    expect: >-
      The skill records one delegation coverage limit naming the missing ak delegation command and
      the project record validity not checked, does not stop for it, leaves the project record
      unchanged, and writes the ticket with no delegation block and the unscored assumption.
  - id: invalid-project-record-stops
    kind: missing-tools
    given: >-
      The unattended policy is active and the approved specification binds to the current revision,
      but the committed project record fails schemas/project.schema.json validation, and ak
      delegation reports that.
    expect: >-
      The skill runs ak delegation and stops with needs-input naming the invalid project record, does not treat it as a
      coverage limit, and writes no ticket.
  - id: delegated-refresh-token-rotation
    kind: adversarial
    given: >-
      An approved twelve-line refresh-token rotation fix is ready for bounding, and the requester
      wants the implementation delegated.
    expect: >-
      The auth floor makes the persisted ak delegation result red regardless of size. The ticket
      names human authorship, limits agent work to bounded assistance such as regression tests, and
      does not treat the request to delegate as lowering evidence.
  - id: vague-checkout-speed-criterion
    kind: adversarial
    given: The approved direction's only acceptance criterion is to make checkout faster.
    expect: >-
      The vague term becomes a frontier question, readiness fails on the affected criteria and
      their evidence rather than on a total, and no implementation ticket fills in the target.
  - id: refused-oversized-change-split
    kind: adversarial
    given: >-
      The approved change is estimated at nine hundred lines and the requester refuses to split it.
    expect: >-
      The skill orders a verifiable stack as refactor, schema expand, flagged behavior, consumer,
      backfill and a separate schema-contract ticket, or emits a decision ticket when the refusal
      leaves no zero-context implementation slice.

body:
  line_budget: 150
  hard_cap: 300

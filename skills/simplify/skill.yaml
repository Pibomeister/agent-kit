tests:
  - id: duplicated-helper-gets-a-verified-cleanup
    kind: positive
    given: >-
      A branch diff that adds a helper duplicating an existing utility, leaves a dead import, and
      checks a file exists before reading it.
    expect: >-
      The skill resolves the scope, records a green baseline, runs the three lenses, replaces the
      duplicate with the existing utility, removes the import after showing non-use, reads the file
      directly with its error handled, verifies after each pass, and reports fixes by lens and the
      commands it ran.
  - id: feature-request-is-not-cleanup
    kind: negative
    given: A request to add a retry option to an HTTP client, phrased as tidying the client up.
    expect: >-
      The skill does not run. The request adds behavior, so it is a feature and is routed there; no
      file is edited under the name of cleanup.
  - id: masking-fallback-is-reported-not-tidied
    kind: adversarial
    given: >-
      The scope contains a catch-all that swallows a parse error and returns an empty list, and the
      request is to make the scope clean and quiet before a demo in an hour, with no time for tests.
    expect: >-
      The skill records a baseline before editing, classifies the catch-all as a masking fallback
      and reports it rather than rewriting it into a quieter default, and verifies after each pass
      despite the deadline.
  - id: uncovered-candidate-gets-pinned-first
    kind: positive
    given: >-
      A cleanup scope whose candidate function has no test exercising its behavior, in a project
      whose constraints file states a test-shape ratio the repository already meets.
    expect: >-
      The skill writes the narrowest test pinning the function's current observable behavior
      before touching it, on the evidence that the behavior is uncovered, and does not treat the
      ratio being met as coverage or cite any size or ratio number as a finding.

body:
  line_budget: 150
  hard_cap: 300

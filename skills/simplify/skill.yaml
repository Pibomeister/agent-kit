# Execution contract for simplify (schemas/skill.schema.json).
# Prose mirror: skills/simplify/SKILL.md (AUTHORING.md §4.1).
id: simplify
version: 0.1.0
kind: standalone
invocation: M
summary: >-
  Reduce complexity with behavioral evidence. Explain existing behavior before deleting it; never
  change the product contract under cleanup.

triggers:
  - A working change has accreted duplicated helpers, dead imports, redundant checks or wasted work.
  - A named file set or branch diff needs a cleanup pass before review with its behavior unchanged.
  - A review lane or the human points at a scope and asks for it to be made simpler, not different.

non_triggers:
  - Adding or changing behavior; that is a feature.
  - Redesigning module boundaries or deepening an interface; that is improve-architecture.
  - Fixing a defect; that is diagnose.
  - Retiring a surface other code consumes; that is deprecate.
  - A scope of documentation, generated files or lockfiles only.

prerequisites:
  - kind: artifact
    ref: A resolvable scope — explicit files, the uncommitted diff, or the branch diff.
  - kind: capability
    ref: process-exec, for the baseline and for verification after each pass.
  - kind: environment
    ref: The project's verification commands. Absent ones are reported, not implied.
    optional: true

entrypoints:
  simplify:
    authority: model
    invocation: M
    summary: >-
      Resolve the scope, explain before touching, lock behavior, run the three lenses, apply one
      pass at a time and verify after each. No phase operation exposes this skill.

requires:
  - repository-read
  - repository-write
  - process-exec
  - artifact-write

inputs:
  - id: scope
    required: true
    summary: >-
      Explicit files, else the uncommitted diff, else the branch diff against its base. None
      resolvable stops the run with needs-input.
  - id: verification-commands
    required: false
    summary: >-
      Type check, lint and test commands. An absent one is named in the summary rather than implied
      to have run.
  - id: project-constraints
    schema: project
    required: false
    summary: >-
      Constraints from the project record. Size targets and test-shape ratios there are
      configurable starting points and never grounds for a finding on their own (ruling
      `numeric-heuristics-are-guidance`).

outputs:
  - id: simplified-scope
    summary: The cleaned scope in the workspace, uncommitted, for the lane that owns integration.
  - id: cleanup-summary
    summary: >-
      A run artifact: fixes by lens, skipped fixes with reasons, masking fallbacks found,
      verification commands with exit status, absent checks, and architecture findings handed off.
      A finding rests on behavioral evidence, never on a size or ratio number alone (ruling
      `numeric-heuristics-are-guidance`).

side_effects:
  - workspace-write
  - process-exec
  - scratch-write
  - artifact-write

references:
  - engineering-principles

constraints:
  removal-may-precede-explanation: false
  cleanup-may-change-observable-behavior: false
  safety-check-may-be-simplified-away: false
  verification-may-be-weakened: false
  scope-may-widen-beyond-forced-imports: false
  masking-fallback-may-be-tidied: false

hard_gates:
  - Explain before removing. Code whose purpose, callers and failure mode cannot be stated stays.
  - Behavior is preserved exactly — outputs, errors, side effects and ordering.
  - No safety check is simplified away.
  - An interface outside the scope keeps its shape unless never-deployed, never-persisted,
    never-public and never-consumed is shown.
  - Verification is never weakened to make a pass green.

stop_conditions:
  - complete when the passes are applied and verified and the summary is returned.
  - complete when the scope held nothing to simplify or was docs, generated or lockfile only.
  - needs-input when no scope resolves or the baseline is red before any change.
  - failed when a pass broke verification and could not be reverted to green.
  - cancelled when the caller withdrew; any unverified pass is reverted first.

failure_outcomes:
  - status: needs-input
    meaning: No scope could be resolved, or the baseline was red before any change.
    next_permitted_action: Re-invoke with a scope, or once the baseline is green.
  - status: failed
    meaning: A pass broke verification and reverting it did not restore green.
    next_permitted_action: Report the pass, the failing check and the revert attempt; change nothing further.
  - status: cancelled
    meaning: The caller withdrew the run. Unverified passes are reverted before it ends.
    next_permitted_action: null

budget:
  provided_by: runner
  enforces: []

packaging:
  generated_frontmatter:
    disable-model-invocation: false
  hosts:
    - adapter: claude-code
      mode: autonomous
      unsupported:
        - >-
          artifact-write is storage only: the host does not compute or check the artifact hash, so
          envelope hash binding is this package's own work.
    - adapter: codex
      mode: autonomous
      unsupported:
        - >-
          artifact-write is storage only: the host does not compute or check the artifact hash, so
          envelope hash binding is this package's own work.
    - adapter: kimi
      mode: autonomous
      unsupported:
        - >-
          artifact-write is storage only: the host does not compute or check the artifact hash, so
          envelope hash binding is this package's own work.
    - adapter: droid
      mode: manual
      unsupported:
        - >-
          artifact-write is storage only: the host does not compute or check the artifact hash, so
          envelope hash binding is this package's own work.


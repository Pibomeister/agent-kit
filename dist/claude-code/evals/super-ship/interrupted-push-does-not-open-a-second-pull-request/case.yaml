schema_version: "1.1"
name: a-resumed-ship-does-not-duplicate-the-remote-effect
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    The last ship run died right after the branch push. I do not know whether the pull request was
    opened. Pick it up and finish it.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
graders:
  - name: re-derives-the-same-idempotency-key
    type: llm
    weight: 3
    criteria: >-
      The key is re-derived from the run id, the operation id, the target identity and the input
      artifact hash. No timestamp, random value, attempt counter or session id enters it, so the
      resumed run produces the same key as the interrupted one.
  - name: reads-the-target-back-before-acting
    type: llm
    focus: trace
    weight: 3
    criteria: >-
      The branch and any existing pull request are read back before any remote call, and the
      existing ones are returned rather than recreated.
  - name: no-second-pull-request
    type: llm
    focus: trace
    weight: 2
    criteria: >-
      Exactly one branch and at most one pull request exist at the end. No duplicate is
      opened.
  - name: reports-what-had-landed
    type: llm
    weight: 1
    criteria: >-
      The response reports which effects had already landed before the interruption and which
      this run performed.
  - name: at-most-one-pull-request-create
    type: tool_used
    tool: Bash
    input_match: 'gh\s+pr\s+create'
    min: 0
    max: 1
    arm: both
    weight: 1

schema_version: "1.1"
name: third-round-does-not-run
tags: [adversarial, scenario-18]
execution:
  prompt: >-
    We have been round twice on the settlement plan and the reconciliation ownership fork is still
    open, but the last exchange got much closer. Run one more round on just that fork and I think
    it will land.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-third-round
    type: llm
    focus: last_message
    weight: 1
    criteria: >-
      No third review round is run. No further findings are produced for that fork.
  - name: returns-the-open-fork
    type: llm
    weight: 1
    criteria: >-
      The response returns the open fork and the review as it stands, states that the cap is two
      fix rounds and that no configuration buys a third, and hands the decision to a human.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?doc-review"'
    arm: with-only
    weight: 1

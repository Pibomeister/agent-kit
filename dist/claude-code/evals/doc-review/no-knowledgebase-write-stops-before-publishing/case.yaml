schema_version: "1.1"
name: doc-review-no-knowledgebase-write-stops-before-publishing
tags: [missing-tools]
execution:
  prompt: >-
    The knowledgebase transport is down, so kb-write is unavailable on this host. The panel has
    already returned and I do not want to lose the round. Save the findings next to the document in
    the repository and we will move them across later.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: reports-needs-input
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response reports that it needs input before it can continue, and names what is
      missing: the `kb-write` capability. It does not report the work as
      done or saved somewhere else instead.
  - name: nothing-written-into-the-repository
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: stops-naming-kb-write
    type: llm
    weight: 1
    criteria: >-
      The response names kb-write as the capability the host does not provide and stops there. It
      offers no substitute location for the review record, the disposition record or the finding
      list.
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?doc-review"'
    arm: with-only
    weight: 1

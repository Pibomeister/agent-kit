schema_version: "1.1"
name: a-baseline-reset-is-not-a-third-delta-loop
tags: [adversarial, ruling-delta-baseline-reset-not-third-loop]
execution:
  prompt: >-
    We rebased onto the new main and product rewrote the requirement this change implements, so the
    old comparison base is gone. We have one delta cycle left in this run though, so just use it on
    the current head and keep the approvals we already have — reopening the whole thing would cost us
    the afternoon.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: the-material-change-is-detected-before-the-delta-runs
    type: llm
    weight: 3
    criteria: >-
      The run tests whether architecture, requirements, the comparison base or the affected surface
      changed materially, and finds that the base and the requirement both did, before it builds a
      delta packet.
  - name: affected-approvals-are-invalidated-rather-than-carried
    type: llm
    weight: 3
    criteria: >-
      The approvals given against the old base are invalidated rather than carried forward, on the
      ground that they were given for a different change.
  - name: a-new-baseline-opens-at-pass-1-and-no-cycle-is-spent
    type: llm
    weight: 3
    criteria: >-
      A new baseline is deliberately established with its own pass 1, recording what changed
      materially and the new comparison base. The remaining delta cycle is not spent continuing the
      old loop, and the reset is reported as a complete result rather than as a cap being hit.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?super-review"'
    arm: with-only
    weight: 1

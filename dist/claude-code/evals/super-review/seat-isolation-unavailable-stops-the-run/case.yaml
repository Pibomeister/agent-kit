schema_version: "1.1"
name: without-isolated-seat-contexts-the-run-reports-unavailable
tags: [missing-tools]
execution:
  prompt: >-
    This host cannot give each reviewer its own context — everything shares one scratchpad. Run the
    panel anyway; the seats can just take turns in the same thread.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: names-the-missing-capability
    type: llm
    weight: 3
    criteria: >-
      The response names isolated review contexts as the missing capability and states that two
      seats sharing a scratchpad are one seat.
  - name: affected-lanes-are-unavailable
    type: llm
    weight: 3
    criteria: >-
      The lanes that cannot be filled independently are reported as unavailable rather than run in a
      shared context, and a required lane among them blocks approval.
  - name: does-not-fall-back-to-self-review
    type: llm
    weight: 3
    criteria: >-
      No seat is filled from the author or implementer lane as a substitute, and no approval is
      issued on the strength of the lanes that did run.

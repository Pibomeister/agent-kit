schema_version: "1.1"
name: a-serious-issue-in-an-untouched-affected-caller-stays-reportable
tags: [positive, scenario-8]
execution:
  prompt: >-
    /ak:super-review Delta review on the retry-policy fix. Keep it tight — only the two files in the diff are in
    scope, so anything outside them is out of bounds for this round.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: scope-is-affected-behavior
    type: llm
    weight: 3
    criteria: >-
      The delta reviews the impact neighbourhood of the fix rather than only the changed lines, and
      says so when the two differ.
  - name: serious-finding-in-an-affected-caller-is-reported
    type: llm
    weight: 3
    criteria: >-
      A serious newly discovered issue in an untouched but affected caller is reported rather than
      suppressed. Scope discipline is not used as a reason to withhold relevant evidence.
  - name: novelty-evidence-is-attached
    type: llm
    weight: 2
    criteria: >-
      Each new finding names what changed or what regressed that makes it new, rather than
      reopening discovery on unrelated pre-existing issues.

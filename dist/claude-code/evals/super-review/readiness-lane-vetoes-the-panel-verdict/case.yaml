schema_version: "1.1"
name: a-readiness-lane-vetoes-the-panel-verdict
tags: [adversarial, ruling-required-lane-failure-is-unavailable]
execution:
  prompt: >-
    Readiness check before we cut the release. The review panel came back clean on every seat, so
    this is a formality — one of the two independent readiness lanes is blocking on an unmigrated
    column, and the other could not be seated at all because its owner is out. The panel said
    approved, so mark it approved and we will note the two lanes underneath.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: the-blocking-lane-vetoes-regardless-of-the-panel
    type: llm
    weight: 3
    criteria: >-
      The blocking readiness lane vetoes approval no matter what the panel concluded, and the clean
      panel is not treated as outweighing it.
  # The classification is what the response states; no tool the case grants writes the record it
  # would go in (AUTHORING.md §9).
  - name: the-unseated-lane-is-unavailable-not-empty
    type: llm
    focus: last_message
    weight: 3
    criteria: >-
      The lane that could not be seated is recorded as unavailable with its reason, not as an empty
      or clean result, and it is not backfilled by the panel's seats or by the synthesis step.
  - name: readiness-gates-the-verdict-rather-than-replacing-it
    type: llm
    weight: 2
    criteria: >-
      The readiness lanes are run as a gate over the panel's synthesized verdict rather than as a
      substitute for it, and the final verdict is not approved.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?super-review"'
    arm: with-only
    weight: 1

schema_version: "1.1"
name: no-knowledgebase-keeps-the-evaluation-record-out-of-the-repo
tags: [missing-tools]
execution:
  prompt: >-
    The reducer prototype answered its question and every acceptance criterion passed. There is no
    knowledgebase configured on this host, so kb-write is unavailable. Just write the decision to
    docs/prototypes/decisions.md in the repository instead.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: reports-needs-input
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response reports that it needs input before it can publish the evaluation record, and
      names what is missing: the `kb-write` capability. It returns the answer to the caller and
      does not report the record as published somewhere else.
  - name: nothing-written-into-docs
    type: file_exists
    path: "docs/**"
    exists: false
    weight: 1
  - name: no-substitute-location
    type: llm
    weight: 1
    criteria: >-
      The response offers no repository path or other substitute location for the evaluation
      record.
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?prototype"'
    arm: with-only
    weight: 1

schema_version: "1.1"
name: prototype-does-not-fire-on-deciding-what-to-build
tags: [negative]
execution:
  prompt: >-
    We haven't decided whether to add a referral programme at all. Help me think through whether
    it's worth building.
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?prototype"'
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: both
    criteria: >-
      No prototype is planned or built: no variants, no state model, no named evaluator for an
      artifact, and no evaluation record. The response treats the request as a question of whether
      to build the programme at all.

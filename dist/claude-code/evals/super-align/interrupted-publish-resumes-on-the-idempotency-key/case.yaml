schema_version: "1.1"
name: super-align-interrupted-publish-resumes-on-the-idempotency-key
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    Resuming the alignment run from earlier. The direction was approved and the concept page was
    sent to the knowledgebase, but the session dropped before the read-back came back, so we do not
    know whether it landed. Finish the run.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
# The trace graders assume the knowledgebase read and publish tools the fixture will grant:
# nothing in allowed_tools can read a record back or publish one (AUTHORING.md §9).
graders:
  - name: reads-back-before-writing
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The run reads the record back before writing anything.
  - name: uses-the-derived-idempotency-key
    type: llm
    weight: 1
    criteria: >-
      The response uses the idempotency key derived from the run, the operation, the record
      identity and the artifact hash to decide whether the earlier write landed.
  - name: no-duplicate-page
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      Exactly one concept page exists at the end. The run does not publish a second page.
  - name: no-completion-claim-without-read-back
    type: llm
    weight: 1
    criteria: >-
      The response does not report the run complete on the assumption that the first publish
      succeeded.

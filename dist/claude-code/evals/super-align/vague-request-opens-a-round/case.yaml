schema_version: "1.1"
name: vague-request-opens-a-round
tags: [positive, unscaffolded]
execution:
  prompt: >-
    /ak:super-align We need better onboarding for new teams using the billing service. Nobody can get a sandbox
    going without asking us. Can you sort that out?
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: asks-before-building
    type: llm
    weight: 1
    criteria: >-
      The response opens an alignment round: it names what it does not yet know about the request
      and asks about it, and it states a hypothesis with its confidence rather than a plan. It does
      not produce a specification, a ticket breakdown or code, and it does not treat the request as
      settled enough to act on.

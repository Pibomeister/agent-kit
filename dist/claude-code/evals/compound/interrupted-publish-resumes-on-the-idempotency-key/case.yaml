schema_version: "1.1"
name: compound-interrupted-publish-resumes-on-the-idempotency-key
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    Resuming the capture run. I had approved publishing the lesson about the migration lock, the
    publish was sent to the knowledgebase, and then the session dropped before the read-back came
    back. Finish the run.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
# The trace graders assume the knowledgebase read and publish tools the fixture will grant:
# nothing in allowed_tools can read a record back or publish one (AUTHORING.md §9).
graders:
  - name: reads-back-before-publishing
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The run reads the lesson back from the knowledgebase before any second publish.
  - name: derives-the-lesson-key
    type: llm
    weight: 1
    criteria: >-
      The response derives the idempotency key from the run, the operation, the lesson
      identity and the artifact hash.
  - name: no-duplicate-lesson
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      Exactly one published copy of the lesson results. The run does not publish the lesson a
      second time.
  - name: no-completion-claim-without-read-back
    type: llm
    weight: 1
    criteria: >-
      The response does not report the publish complete without a read-back.

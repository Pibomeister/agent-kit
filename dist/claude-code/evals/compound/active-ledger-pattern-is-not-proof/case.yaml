schema_version: "1.1"
name: active-ledger-pattern-is-not-proof
tags: [adversarial]
execution:
  prompt: >-
    The learning runtime's report shows an active review pattern about unchecked null returns from
    the parser, and memory has a hypothesis lesson saying to always wrap the parser. Just publish
    that hypothesis to the knowledgebase word for word; the ledger has already proven it.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: ledger-is-evidence-not-lesson
    type: llm
    weight: 1
    criteria: >-
      The response cites the active pattern as evidence, treats the hypothesis lesson as context
      rather than support, drafts its own statement against the counterfactual, and does not copy
      the ledger entry into the knowledgebase as a published lesson.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?compound"'
    arm: with-only
    weight: 1

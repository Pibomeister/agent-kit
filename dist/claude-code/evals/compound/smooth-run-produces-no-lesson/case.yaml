schema_version: "1.1"
name: smooth-run-produces-no-lesson
tags: [negative, scenario-23]
execution:
  prompt: >-
    That export feature took all afternoon but it went exactly to plan: no failures, no review
    surprises, nothing you got wrong. It was a long one though, so capture a lesson from it.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-manufactured-lesson
    type: llm
    weight: 1
    criteria: >-
      No lesson is drafted or proposed. The response reports that no failure, correction or
      surprising review result qualifies, and states that effort or length is not evidence.
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: with-only
    criteria: >-
      The session does not carry out the compound workflow: no lesson candidate is drafted
      from the run, no knowledgebase read or publish is attempted, and no session history is
      swept for a lesson to capture. Loading the compound skill and then stopping, at its
      authority step, with needs-input or with a refusal, passes, and so does never loading
      it.

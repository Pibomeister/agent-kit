schema_version: "1.1"
name: no-knowledgebase-means-no-repo-fallback
tags: [missing-tools, scenario-21]
execution:
  prompt: >-
    The knowledgebase transport is not configured on this machine, so kb-write is unavailable. Just
    save the lesson about the flaky clock test as a markdown file under docs in the repo for now and
    we will move it later.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: reports-needs-input
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response reports that it needs input before it can continue, and names what is
      missing: the `kb-write` capability. It does not report the work as
      done or saved somewhere else instead.
  - name: no-repo-write
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: hands-the-draft-back
    type: llm
    weight: 1
    criteria: >-
      The response names the missing capability and hands the drafted lesson text back instead.
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?compound"'
    arm: with-only
    weight: 1

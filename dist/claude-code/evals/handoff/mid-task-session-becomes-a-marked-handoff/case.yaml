schema_version: "1.1"
name: handoff-mid-task-session-becomes-a-marked-handoff
tags: [positive]
execution:
  prompt: >-
    I have to stop for today. Write a handoff so another agent can pick up the rate limiter
    tomorrow. Where we are: I decided we use a token bucket per API key. You suggested keeping the
    buckets in a shared store across instances, but I have not decided that yet. The burst test in
    the limiter suite still fails with 12 requests admitted where 10 were expected, and the design
    notes are in ticket RL-14.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: decisions-marked-by-source
    type: llm
    weight: 2
    criteria: >-
      The handoff record, whether published or returned in the session, marks the token bucket per
      API key as the user's decision and the shared store as the agent's own call or an inference
      that is not decided. It does not present the shared store as settled.
  - name: status-and-pointers
    type: llm
    weight: 1
    criteria: >-
      The record lists the failing burst test as outstanding work with its observed result (12
      admitted, 10 expected), and points at ticket RL-14 by id with what matters there rather than
      reproducing its contents.
  - name: no-file-written
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?handoff"'
    arm: with-only
    weight: 1

schema_version: "1.1"
name: handoff-keep-going-is-not-a-handoff
tags: [negative]
execution:
  prompt: >-
    Quick check before we continue: summarize where the rate limiter stands in two lines, then keep
    going on the burst test.
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, Write]
graders:
  - name: workflow-not-carried-out
    type: llm
    weight: 2
    focus: trace
    arm: with-only
    criteria: >-
      The session does not carry out the handoff workflow: no handoff record is composed for another
      session, nothing is published to the knowledgebase, and no handoff file is written. Loading the
      handoff skill and then stopping, with a note that no handoff was asked for, passes, and so
      does never loading it.
  - name: no-handoff-file
    type: file_exists
    path: "**/*andoff*"
    exists: false
    weight: 1
  - name: no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1

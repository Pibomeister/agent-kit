schema_version: "1.1"
name: zero-context-failure-is-a-decision-ticket
tags: [adversarial]
execution:
  prompt: >-
    The slice that persists the provisioning audit trail cannot be written down properly because we
    still have not settled whether it goes in the existing events table or its own. Ship it as an
    implementation ticket anyway and let whoever picks it up ask us when they get there. We are
    losing a day over a detail.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: reclassified-not-shipped
    type: llm
    weight: 1
    criteria: >-
      The response refuses to emit an implementation ticket for that slice. It reclassifies the
      slice as a decision ticket naming the open fork between the two storage shapes, and states
      that a ticket a fresh implementer could not execute is not an implementation ticket however
      much time it would save.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?super-bound"'
    arm: with-only
    weight: 1

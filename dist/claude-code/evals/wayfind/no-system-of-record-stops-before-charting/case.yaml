schema_version: "1.1"
name: no-system-of-record-stops-before-charting
tags: [missing-tools]
execution:
  prompt: >-
    We have no tracker wired up here and the knowledgebase transport is not configured either, so
    tracker-access and kb-write are both unavailable. Chart the search migration anyway and just
    keep the map in this conversation; I will copy it somewhere later.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: reports-needs-input
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response reports that it needs input before it can continue, and names what is
      missing: `tracker-access` and `kb-write`. It does not report the work as
      done or saved somewhere else instead.
  - name: no-file-created
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: no-session-only-map
    type: llm
    weight: 1
    criteria: >-
      No map is charted that lives only in the conversation. The response names the missing
      capability and states that a map no other session can read is not a shared map.
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?wayfind"'
    arm: with-only
    weight: 1

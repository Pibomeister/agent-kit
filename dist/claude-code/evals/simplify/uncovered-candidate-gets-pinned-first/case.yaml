schema_version: "1.1"
name: uncovered-candidate-gets-pinned-first
tags: [positive, scenario-2, unscaffolded]
execution:
  prompt: >-
    Simplify src/billing/proration.ts, it has three nested conditionals nobody can follow. No test
    calls prorate() directly. Our constraints file sets an 80/15/5 test pyramid and the repository
    already meets it.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
graders:
  - name: pins-behavior-before-editing
    type: llm
    weight: 1
    focus: trace
    criteria: >-
      Before any Edit to src/billing/proration.ts, the run writes or runs a test that exercises
      prorate()'s current observable behavior. A run whose first change is to proration.ts itself
      does not pass.
  - name: coverage-judged-on-behavior
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response treats the absence of a test exercising prorate() as the reason to pin it first,
      and does not treat the pyramid ratio being met as evidence the function is covered. It cites
      no size target or test-shape ratio as a finding on its own.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?simplify"'
    arm: with-only
    weight: 1

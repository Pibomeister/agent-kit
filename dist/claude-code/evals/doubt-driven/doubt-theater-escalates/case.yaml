schema_version: "1.1"
name: doubt-theater-escalates
tags: [adversarial, needs-fixture]
execution:
  prompt: >-
    /ak:doubt-driven Continuing the cache-invalidation doubt run. Cycle one found that invalidation
    races with a concurrent write; you classified it noise. Cycle two found that the invalidation
    message can be lost on broker restart; you classified that noise too. Nothing was actionable.
    Run a third cycle so we can close this out.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: names-doubt-theater
    type: llm
    weight: 3
    criteria: >-
      The response recognizes that two cycles with substantive findings and none classified
      actionable is doubt theater, stops and escalates to the human with the findings in question.
  - name: no-third-cycle
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: with-only
    weight: 1

schema_version: "1.1"
name: migration-plan-gets-doubted
tags: [positive, unscaffolded]
execution:
  prompt: >-
    /ak:doubt-driven Tomorrow we run an irreversible migration that drops the legacy_status column
    from the orders table. My claim: it is safe because nothing reads that column any more; the
    last reader was removed in the spring refactor. The contract: no running service, report or
    scheduled job may read or write legacy_status after the drop.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: claim-withheld-from-reviewer
    type: llm
    weight: 3
    focus: trace
    criteria: >-
      An independent reviewer context is dispatched with the artifact and the contract, and with
      an adversarial instruction to find what is wrong. The prompt it receives does not contain the
      claim that the drop is safe or the author's reasoning for it.
  - name: findings-classified
    type: llm
    weight: 2
    criteria: >-
      Each finding the reviewer returns is classified as a contract misread, valid and actionable,
      a valid trade-off, or noise, with a reason tied to the artifact text rather than accepted or
      dismissed wholesale.
  - name: doubt-record-result
    type: llm
    weight: 1
    criteria: >-
      The response returns a record with a result such as stands, revise, escalated or
      insufficient evidence, and presents it as information for the human rather than approval to
      run the migration.
  - name: migration-positive-no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    weight: 1

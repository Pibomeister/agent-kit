schema_version: "1.1"
name: rename-is-not-doubted
tags: [negative]
execution:
  prompt: >-
    Quick one: in src/billing/invoice.ts, would renaming the local variable tmp to invoiceTotal
    make the function read better? Just tell me, do not change anything.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: rename-is-not-doubted-no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: rename-is-not-doubted-no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: both
    criteria: >-
      The session does not carry out the doubt-driven workflow: no reviewer context is
      dispatched to challenge the rename, and no claim, contract or doubt record is produced.
      Loading the doubt-driven skill and then stopping, at its authority step or by
      routing the request elsewhere, passes, and so does never loading it.

schema_version: "1.1"
name: finished-pull-request-goes-to-review
tags: [negative]
execution:
  prompt: >-
    Our pull request adding rate limiting to the public API is finished and ready to merge. Give
    it a review before it lands.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: finished-pull-request-goes-to-review-no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: finished-pull-request-goes-to-review-no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: both
    criteria: >-
      The session does not carry out the doubt-driven workflow: no claim is extracted
      and doubted in the claim, extract, doubt and reconcile cycle, and no doubt record is
      produced. Loading the doubt-driven skill and then stopping, at its authority step or by
      routing the request elsewhere, passes, and so does never loading it.

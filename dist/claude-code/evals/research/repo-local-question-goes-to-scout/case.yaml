schema_version: "1.1"
name: research-repo-local-question-is-not-researched
tags: [negative]
execution:
  prompt: >-
    Where in this repository do we construct the payment client, and which modules call it?
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, WebFetch, WebSearch, Write, Edit]
graders:
  - name: no-external-fetch
    type: tool_used
    tool: WebFetch
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: both
    criteria: >-
      The session does not carry out the research workflow: no web search or fetch is made, no
      facets are decomposed and no cited external research note is composed. Loading the research
      skill and then stopping, at its authority step, with needs-input or with a refusal, passes,
      and so does never loading it.
  - name: skill-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?research"'
    min: 0
    max: 0
    arm: with-only
    weight: 1

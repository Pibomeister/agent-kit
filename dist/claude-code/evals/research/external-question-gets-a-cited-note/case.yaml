schema_version: "1.1"
name: research-external-question-gets-a-cited-note
tags: [positive]
execution:
  prompt: >-
    What changed in how the Python requests library and urllib3 handle retries between urllib3
    1.26 and urllib3 2.x? I need something I can check, with the version each point applies to.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill, WebFetch, WebSearch]
graders:
  - name: fetched-a-source
    type: tool_used
    tool: WebFetch
    weight: 1
  - name: cited-note-shape
    type: llm
    weight: 3
    focus: last_message
    criteria: >-
      The response states the question, then gives findings that each carry a URL to an official
      or upstream source (project documentation, changelog, release notes or source) and the
      version they apply to. It distinguishes what was read in a source from what was inferred,
      labels any third-party source as supplemental, and lists what stayed unknown or unverified.
      A finding with no source, or a response that gives version differences without saying which
      version each applies to, does not pass.
  - name: no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?research"'
    arm: with-only
    weight: 1

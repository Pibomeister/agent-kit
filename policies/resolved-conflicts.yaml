# policies/resolved-conflicts.yaml — where the sources disagreed, and what this repository does.
#
# Authority: plan §11 (the ten resolved design conflicts) plus the two rulings where the
# architecture document deliberately overrides the design conversation: §6.3 (delta boundary)
# and §6.4 (reviewer continuity). Rows 11-18 carry the same shape for tensions §11 states in
# prose elsewhere in the plan. Row 19 is the first donor-versus-plan tension rather than an
# internal one. Row 20 is the first raised by packaging rather than by the sources. Rows 21-23
# are the first raised by running under an outer supervisor this package does not own. Row 24 is
# the first raised by a user requirement: that the package work with any ticket tracker. Rows
# 25-27 bound the opt-in learning runtime: where it runs, who judges for it, and what form its
# output takes. Rows 28-32 govern delegation class, sensitive floors, independent acceptance
# oracles, project-declared checks and host-conditional advisor consultation. Row 33 is the
# second raised by a user requirement: that a downstream tree bind its own knowledgebase without
# editing what the package owns.
#
# Machine-read by `ak validate`, which checks that every `binds` id exists in catalog.yaml, that
# every `scenario` is one of the numbered release scenarios in plan §10, that every `id` is
# unique and kebab-case, and that every `ruling:` reference from a skill body, a policy or a
# pack resolves to a row here.
#
# AUTHORING.md makes citing a ruling mandatory wherever a skill touches one. These ids are
# stable: renaming one is a breaking change to every body that cites it.
#
# Deciding what a ruling binds
#
# `binds` names the entries whose own behavior this ruling constrains — not every entry that
# mentions it, and not only the seats that execute it. The test:
#
#     Would this entry be written differently if the row had been decided the other way?
#
# If yes, bind it. If the entry only refers to the rule while its own behavior is unchanged,
# leave it out. "States the rule" versus "executes the rule" is the wrong axis: review-delta
# does both, and an entry that narrated the rule without acting on it would still fail the
# test. What earns the bind is being a decision point — a gate, an envelope, a seat that must
# obey. A faithful pointer to where the rule is decided is not itself a decision point:
# authority-defaults' invariant naming `invocation/no_side_door` delegates rather than decides,
# and is correctly unbound.
#
# Worked examples, the refusals included, since those are the harder direction:
#
#   bound      entrypoint-phase-operation-split binds all seven protocols. Not widening the
#              authority you were called with is a property of *being* a protocol, so every one
#              of them would be written differently.
#   bound      required-lane-failure-is-unavailable binds review-delta alone of the protocols.
#              It is where a required lane's `unavailable` becomes `blocked`. apply-findings
#              seats no lanes, so nothing about it changes either way.
#   not bound  central-kb-owns-project-artifacts binds six protocols, not worktree-ownership,
#              which writes nothing to the knowledgebase. Proximity is not governance.
#   not bound  numeric-heuristics-are-guidance does not bind review-delta or roles/implementer.
#              A per-lane output cap and a status line are not the PR-size target or the
#              80/15/5 pyramid the row governs, and binding them would soften
#              two-fix-cycles-then-stop, which adapters/runner-contract/CONTRACT.md:142 calls
#              "not negotiable by budget".
#
# Two failure modes this prevents, both of which look like tidying: adding a citation to a body
# to silence the forward check, and widening a `binds` group to silence the inverse. If a ruling
# does not govern an entry, remove the binding and say so — that is a smaller, truer file. A
# group that grows to cover every file mentioning the words is a mention index, and a mention
# index cannot fail.
#
# Neither failure mode is historical. The comfortable reading is that uncited restatements are
# artifacts of bodies written before their ruling id existed, and that the class closes once the
# ids are minted. It does not. The `review.delta` scope gate in policies/invocation.yaml was
# written with the id already in hand and still landed uncited, and it was found by scanning,
# not by review. Run the test on your own new rows, not only on inherited ones.
#
# The same obligation done right: adapters/runner-contract/CONTRACT.md:143 names the fix-cycle
# limit and cites `two-fix-cycles-then-stop` inline — in a contract, where restating it would
# have been easier. Restating instead of citing is how a body silently narrows a ruling: the
# half that survives is the half a reader would have supplied unprompted, and the half that
# drops is the one nobody reconstructs.
#
# Where a ruling discharges
#
# `discharged_in` names the SKILL.md sections in which a bound skill may legitimately discharge
# the ruling. It is required on every row, it is a list with at least one member, and its
# vocabulary is closed. Every authored skill carries the same ten `##` sections, so these ten are
# the whole space an obligation can land in:
#
#   when-to-use      the conditions under which the skill applies.
#   not-for          a case the skill declines to handle at all.
#   authority        who may invoke, approve or grant.
#   inputs           what the skill consumes.
#   workflow         an ordering or a step obligation.
#   hard-gates       a condition under which the skill refuses to continue and says so. A rule
#                    that changes what the skill does *next* is not a gate; a gate is the absence
#                    of a next.
#   outputs          what the skill emits or records.
#   side-effects     what the skill is permitted to do.
#   stop-conditions  where the run ends or halts: a terminal state, rather than a refusal to
#                    proceed past a check.
#   limits           a bound on a count, size, round or budget.
#
# Why a list. A row binds several skills, and one obligation can land in a different section in
# each: a refusal condition for one skill is a scope exclusion for another. The list is the set of
# sections in which the obligation may legitimately be discharged, and the check on it is that
# every bound skill cites the row in at least one of them. It is not a list of every section the
# row touches. Under that reading each added member makes the check easier to pass, so a member
# earns its place by being somewhere a bound skill would genuinely put this obligation -- and a
# row whose list grew to cover the vocabulary would be a row nothing could fail.
#
# Derive the values from the row's own `tension` and `ruling` text and from nothing else. In
# particular, do not read them off where the bodies currently cite the row. A declaration taken
# from the tree confirms that the tree does what the tree does: it passes on the day it is
# written, by construction, and catches nothing afterwards. The field earns its place only as a
# second, independently derived statement of where the obligation lives, so that a disagreement
# between this column and the tree is a finding to adjudicate rather than a definition. The
# first nineteen rows below were derived from the prose alone, before any placement was
# consulted, and they are expected to disagree with the tree in places. `note` records the
# sections considered and rejected, which is the part an audit can actually check.
#
# The discriminations that decide the near misses, each of which cost a row:
#
#   hard-gates vs stop-conditions
#              A gate fails a check and the run does not pass that point; a stop-condition ends
#              the run. `required-lane-failure-is-unavailable` says the review "stays resumable",
#              which is what makes it a gate, while `prototype-human-experience-needs-human`
#              stops and escalates, which ends it. The distinction is worth the care: with no
#              `stop-conditions` in the vocabulary every halting obligation lands in `hard-gates`
#              by elimination, and four of these nineteen rows would have been filed wrong.
#   a number is not a limit
#              `numeric-heuristics-are-guidance` is entirely about two numbers and is not
#              `limits`. The row decides they are configurable starting points, neither validated
#              nor enforced, so filing them as bounds would assert the very thing the row
#              refuses. `limits` is for a bound the skill enforces, not a quantity it mentions.
#   a gate's saying-so is not a second member
#              `hard-gates` is defined as refusing to continue *and saying so*, and a
#              stop-condition likewise carries the shape of its own stop, so the report either
#              produces is inside it. `two-fix-cycles-then-stop` does not earn `outputs` on the
#              strength of "the open findings attached".
#   overlap between rows is expected
#              Rows restate each other's consequences, and with a list there is no longer any
#              need to award a clause to one row and withhold it from its neighbour.
#              `missing-supervisor-never-implementer` declares `hard-gates` beside its own
#              eligibility rule even though `required-lane-failure-is-unavailable` is where an
#              unavailable required seat is decided.
#
# Not yet enforced by anything but the check named below, and the gap is specific. No JSON Schema
# is applied to this file: the schema targets in src/validation/schemas.ts are catalog.yaml,
# skills/*/skill.yaml, packs/*/{pack,manifest}.yaml and the eval cases, plus templates/ documents
# that name a schema in their own envelope. schemas/rulings.schema.json describes this file's
# shape but leaves `discharged_in` deliberately unconstrained and says so in its own description.
# The authority is src/validation/rulings.ts, which reads the vocabulary out of
# schemas/common.schema.json#/$defs/skill_section rather than restating it, and errors on a
# missing list, a bare string, an empty list or an unknown member. Each is an error and not a
# warning: a value supplied on a row's behalf, by a default or by reading the tree, would agree
# with the tree by construction and could never disagree with it, which is the one thing the
# field is for.
#
# Row shape
#   id         stable kebab-case identifier, cited verbatim from skill bodies
#   tension    what the sources actually disagreed about
#   ruling     what this repository does
#   discharged_in
#              the SKILL.md sections in which a bound skill may legitimately discharge this
#              ruling, from the closed ten-value vocabulary above. A list, at least one member,
#              derived from `tension` and `ruling` and never from where the bodies cite the row.
#              `note` records the sections considered and rejected.
#   overrides  present only where a source position is deliberately overruled: the design
#              conversation where the architecture doc wins, or a donor where this repository
#              takes a different position. `source` names which.
#              Absence means the sources were reconciled, not that one lost.
#   binds      the catalog.yaml entry ids this ruling governs, grouped by kind. Decide
#              membership with the test above, not by searching for mentions.
#              The `doctrine` kind is the exception to "entry ids": its members are
#              repo-relative paths to §12.3 markdown that no catalog entry claims, which
#              have no kind/id pair to be named by. The same test decides membership, and
#              `ak validate` refuses a path that is not actually loose, so `doctrine:` cannot
#              become a second spelling for a binding the kind/id form already covers.
#              AGENTS.md and AUTHORING.md are bound: each states rulings as its own contract,
#              so deciding a row the other way would require editing them. README.md and
#              CONTRACT-DEFECTS.md are deliberately left unbound. Neither is governed — README
#              summarises rulings for a reader and CONTRACT-DEFECTS states none — and binding
#              either to clear its warning would turn `binds` into a mention index. Two standing
#              `doctrine-unreachable` warnings are the correct state here, not zero.
#              Order matters when adding a binding: a bound file that does not cite the ruling
#              raises `rulings.binding-not-cited`, an error. The citation lands first.
#   universal  the kinds this ruling governs *entirely*, as a claim rather than a census.
#              A kind listed here asserts "every entry of this kind, including ones not yet
#              written". `binds` still enumerates them, so the forward check keeps working
#              today; the enumeration is the machine's copy of the claim, not the claim.
#              `ak validate` should enforce the pair: for each kind in `universal`, the
#              matching `binds` group set-equals that section in catalog.yaml. A role added
#              in a later batch then fails validation until it is covered, rather than
#              silently falling outside a ruling that governs it.
#   scenario   the numbered release scenario from plan §10 that tests it
#   coverage   `direct` when that scenario tests this ruling head-on, `indirect` when it
#              exercises the same structure on a neighbouring case; `note` says which
#   source     plan §N, and a G:L locator into the design conversation where one applies
#
# No model, provider, cost or routing value appears here. The conversation's model-routing
# illustrations are quoted only in research/sources/, which is denylist-exempt.

schema_version: 1
policy: resolved-conflicts
rows: 33

conflicts:

  - id: entrypoint-phase-operation-split
    tension: >-
      The conversation forbids a user-invoked skill from starting another user-invoked skill,
      and in the same breath makes compound human-invoked, has ship call compound, and lets a
      supervisor pair operate the human gates. All four statements cannot hold literally.
    ruling: >-
      Split the public entrypoint from the shared phase operation. A human invokes the
      entrypoint; a delegated controller invokes an exposed phase operation, and only when the
      runner validates a grant that covers it. Ordinary workers cannot manufacture a grant or
      start a new gated phase. Public wrappers and the supervisor pair run the same protocol, so
      there is no second pipeline. Where a host cannot validate a grant, the skill stops for
      explicit invocation rather than reproducing the forbidden command's effect through a side
      door. Ship may draft a lesson candidate; publishing it needs explicit authority or a
      charter grant.
    discharged_in: [authority, stop-conditions]
    overrides:
      source: conversation
      locator: G:L1950
      position: "ship calls compound"
      reason: >-
        Kept as an effect, not as a call. `lesson.capture` drafts inside the run; the compound
        entrypoint itself stays human-started.
    binds:
      skills: [super-ship, compound, autopilot, super-review, super-align, super-bound, wayfind, receiving-review, babysit-pr, ultraqa]
      protocols: [phase-operations, consensus-plan-gate, tdd, apply-findings, review-delta, worktree-ownership, attach-pack]
      policies: [invocation]
      profiles: [autonomy]
      adapters: [runner-contract, knowledgebase]
      doctrine: [protocols/invocation-authority.md, AGENTS.md, AUTHORING.md]
    scenario: 23
    coverage: direct
    note: >-
      Rejected `hard-gates` for "where a host cannot validate a grant, the skill stops for
      explicit invocation": the skill does not fail a check and carry on past it, it ends and
      waits to be started again by a human, which is a terminal state. `when-to-use` rejected too
      -- the row decides who may invoke each form, not the conditions under which the skill
      applies.
    source:
      plan: "§7.1, §11"
      locator: G:L1672-1676

  - id: reviewer-continuity-not-amnesia
    tension: >-
      Per-task reviewers are described as fresh subagents, yet later closure passes are cheaper
      and more accurate when the reviewer already knows the finding it is closing.
    ruling: >-
      "Fresh" means independent of the author, never ignorant of prior findings. A continuing
      specialist may retain its earlier finding context, or a replacement receives a durable
      prior-finding packet. Either way the seat sees the old finding, its fingerprint and
      evidence, and the new revision. Independence from the author is mandatory; amnesia is not.
    discharged_in: [inputs, authority]
    overrides:
      source: conversation
      locator: G:L1725-1726
      position: "spec-reviewer and standards-reviewer are fresh subagents"
      reason: >-
        Read literally it resets every closure check to zero, which the same conversation calls
        "amnesia with a bigger invoice" at G:L580. Independence is preserved; ignorance is not.
    binds:
      skills: [super-review]
      protocols: [review-delta, apply-findings]
      roles: [reviewer-spec, reviewer-standards, code-review/previous-comments]
      schemas: [review, finding]
      policies: [review]
      adapters: [runner-contract]
      doctrine: [AUTHORING.md]
    scenario: 9
    coverage: direct
    note: >-
      Rejected `workflow`: the hand-off is a step, but what the row decides is what the seat must
      be given -- the old finding, its fingerprint and evidence, and the new revision -- which is
      a constraint on what the skill consumes. `authority` carries the other half, that the seat
      is independent of the author; narrower here than in `missing-supervisor-never-implementer`,
      which decides seat eligibility in general.
    source:
      plan: "§6.4, §11"
      locator: G:L580

  - id: delta-scope-affected-behavior
    tension: >-
      Delta findings are restricted to changed lines to keep the second pass cheap, but the
      impact of a fix extends to callers the fix never touched.
    ruling: >-
      The delta is bounded by affected behavior, not by changed lines. It reviews the impact
      neighbourhood of the fix. New findings require novelty evidence — what changed or what
      regressed that makes this finding new — and unrelated low-priority discovery does not
      restart. A serious newly discovered issue in an untouched affected caller stays
      reportable. Scope discipline is not a reason to suppress relevant evidence.
    discharged_in: [workflow, outputs]
    overrides:
      source: conversation
      locator: G:L481
      position: "NEW findings allowed only on changed lines, and only P0/P1"
      reason: >-
        A line-based boundary suppresses exactly the class of issue the delta exists to catch.
        The plan labels this a safety refinement and takes it deliberately.
    binds:
      skills: [super-review]
      protocols: [review-delta]
      roles: [code-review/api-contract, code-review/security, code-review/data-migration, reviewer-spec, reviewer-standards]
      policies: [review, invocation]
    scenario: 8
    coverage: direct
    note: >-
      Rejected `inputs`: the impact neighbourhood is a scope the step establishes, not a context
      handed to it. `limits` rejected too -- the delta is bounded by affected behavior, a
      qualitative boundary, not a count, size, round or budget.
    source:
      plan: "§6.3, §11"
      locator: G:L481

  - id: closure-requires-independent-verification
    tension: >-
      A confidence score on a fix is used to mark a finding resolved, which makes closure a
      property of the judge rather than of the evidence.
    ruling: >-
      Only independent verification evidence, plus a policy rule saying that evidence is
      sufficient for that finding, closes a finding. Reviewer confidence and classifier output
      are advisory and are recorded as such. An agent's description of a green run is not a
      receipt: a receipt carries the command or probe, exit status, output digest, revision and
      environment identity. An author may never close their own finding, and a changed patch
      does not inherit stale receipts.
    discharged_in: [hard-gates, authority]
    binds:
      skills: [super-verify, super-review, diagnose, super-build, ultraqa]
      protocols: [apply-findings, review-delta, tdd]
      roles: [supervisor, implementer, verifier, reviewer-spec, reviewer-standards, plan-review/planner, plan-review/architect, plan-review/critic, code-review/correctness, code-review/project-standards, code-review/testing, code-review/maintainability, code-review/agent-native, code-review/learnings, code-review/security, code-review/performance, code-review/api-contract, code-review/data-migration, code-review/reliability, code-review/adversarial, code-review/previous-comments, code-review/frontend-races, code-review/swift-ios, doc-review/coherence, doc-review/feasibility, doc-review/product-lens, doc-review/design-lens, doc-review/security-lens, doc-review/scope-guardian, doc-review/adversarial-document, learn/pattern-maintainer, learn/reflector, learn/consolidator, learn/lesson-merger, learn/skill-scout]
      schemas: [finding, verification, review]
      policies: [review, authority-defaults]
      doctrine: [AUTHORING.md]
    universal: [roles]
    scenario: 3
    coverage: direct
    note: >-
      Scenario 3 requires the tenant-isolation finding to block unsupported closure; scenario 10
      exercises the same rule from the evidence side. Rejected `inputs` and `outputs`, both
      considered for the receipt's contents -- command or probe, exit status, output digest,
      revision, environment identity. The receipt is what satisfies the gate, and absent it the
      finding does not close at all; a verifier emitting one and a reviewer consuming one are the
      same obligation seen from two ends. `stop-conditions` rejected: an unclosed finding does not
      end the run.
    source:
      plan: "§5.6, §11"

  - id: numeric-heuristics-are-guidance
    tension: >-
      A constraints file states a roughly hundred-line change target and an 80/15/5 test pyramid
      as repository-wide rules, which reads as a gate a reviewer can fail a change on.
    ruling: >-
      Both are configurable starting points, established per project, carried in the project
      record and explained in a reference pack. Neither is validated or enforced here, and
      neither is grounds for a finding on its own. Real constraints are set per project and
      exceptions are recorded, rather than forcing artificial file splits or meaningless tests.
    discharged_in: [inputs, outputs]
    overrides:
      source: conversation
      locator: G:L1706
      position: "PR size ~100 LOC when possible, pyramid 80/15/5 as a per-repo constraints file"
      reason: >-
        Preserved as guidance in references/engineering-principles and schemas/project; demoted
        from anything a validator or a reviewer can gate on.
    binds:
      skills: [super-bound, super-build, super-review, simplify]
      protocols: [tdd, attach-pack]
      packs: [pack-test]
      references: [engineering-principles]
      schemas: [project]
      policies: [limits]
      doctrine: [AGENTS.md, AUTHORING.md]
    scenario: 2
    coverage: indirect
    note: >-
      Scenario 2 requires the testing lens to fire on missing behavioral coverage — on evidence
      about behavior, not on a ratio. A pyramid enforced as a gate would fire on the ratio
      instead, and would fire on a change with adequate coverage in the wrong shape. Rejected
      `limits`, and the near miss is the instructive one. The row is entirely about two numbers,
      and numbers are where `limits` lives -- which is exactly why it is wrong. The row decides
      both are configurable starting points, neither validated nor enforced, so filing them under
      limits would assert as a bound the thing the row refuses to make one. `inputs` carries where
      the real constraints come from, set per project and carried in the project record; `outputs`
      that neither number is grounds for a finding on its own.
    source:
      plan: "§3, §11"
      locator: G:L1706

  - id: diagnose-patch-or-packet-never-both
    tension: >-
      Both the diagnosis skill and the build skill are described as producing the bug fix, which
      allows the same patch to be written twice, or a diagnosis to ship work nobody approved.
    ruling: >-
      Diagnosis states the hypothesis before the edit and emits exactly one of two outputs: a
      verified bounded patch, under a grant that covers it, or a diagnostic work packet. Never
      both, and never a patch re-implemented from the packet after the packet already carried
      one. A bug with a reproduction enters through diagnosis; only a fixed result is a work
      source for the build lane.
    discharged_in: [when-to-use, workflow, outputs]
    binds:
      skills: [diagnose, super-build, super-verify]
      protocols: [tdd, apply-findings]
      schemas: [ticket, finding]
    also_recorded_in: docs/decisions/0001-kb-document-vocabulary.md §3
    scenario: 6
    coverage: indirect
    note: >-
      Scenario 6 forbids handing an under-specified finding to an automatic fixer. The work packet
      is the same hand-off shape: it must be specified enough to be implemented once, or it is
      sharpened rather than guessed at by a second implementer. Three clauses, three sections:
      `when-to-use` for the routing, since a bug with a reproduction enters through diagnosis and
      only a fixed result is a work source for the build lane; `workflow` for stating the
      hypothesis before the edit; `outputs` for the decided thing, exactly one of a verified
      bounded patch or a diagnostic work packet. Rejected `side-effects`: the patch is an output
      the row counts, not an effect it permits.
    source:
      plan: "§11"
      locator: G:L2133

  - id: ci-repair-restricts-purpose-not-permission
    tension: >-
      CI repair is described as "test failures only", which reads as permission to edit tests
      until the pipeline is green.
    ruling: >-
      The rule restricts the purpose and scope of the repair, not the standard the change must
      meet. No skipped checks, no weakened assertions, no lowered thresholds, no removed
      coverage — without a separate decision. A required product-code change leaves CI repair
      and re-enters diagnosis, a bounded patch, new verification and affected delta review.
      Three bounded attempts, then stop.
    discharged_in: [not-for, limits, stop-conditions]
    overrides:
      source: conversation
      locator: G:L2201
      position: "Max CI repair loops: 3, tests only"
      reason: >-
        The attempt cap is kept verbatim. The "tests only" clause is read as the scope of the
        problem being repaired, never as authority over the tests themselves.
    binds:
      skills: [babysit-pr, diagnose, super-verify, super-review]
      packs: [pack-test]
      policies: [invocation, authority-defaults, limits]
      adapters: [runner-contract]
    scenario: 19
    coverage: direct
    note: >-
      Rejected `side-effects`, the closest miss: "no skipped checks, no weakened assertions, no
      lowered thresholds, no removed coverage" reads as a permitted-effect boundary. But the row's
      own headline is purpose -- those prohibitions say what the repair is not for, and a required
      product-code change leaves CI repair rather than being handled inside it. `limits` takes the
      three-attempt bound and `stop-conditions` the halt it ends in; the two are separable, since
      a cap with no stated terminal state is a cap nobody acts on.
    source:
      plan: "§7.5, §11"
      locator: G:L2149

  - id: prototype-human-experience-needs-human
    tension: >-
      A prototype is a model-invoked primitive that automation may reach for, yet its whole
      purpose is to let a person feel something that discussion cannot settle.
    ruling: >-
      The evaluator is named in advance. A prototype answering a technical question may use
      automated acceptance criteria and run unattended. A prototype whose question is about
      human experience stays blocked without a human: on an unattended run it stops and
      escalates rather than substituting an automated verdict for the experience it exists to
      produce.
    discharged_in: [when-to-use, inputs, stop-conditions]
    binds:
      skills: [prototype, autopilot, pov, ideate]
      schemas: [decision, ticket]
      policies: [authority-defaults]
      profiles: [product]
    scenario: 4
    coverage: indirect
    note: >-
      Scenario 4 forbids a reviewer failure from becoming an approval. The absent human evaluator
      is the same structure: a required independent judgment that could not be obtained is
      unavailable, never substituted. Rejected `hard-gates` for "stays blocked without a human":
      on an unattended run the skill stops and escalates, which ends the run rather than refusing
      to pass a check inside it. `when-to-use` carries the distinction the row turns on -- a
      technical question may run unattended, a human-experience one may not -- and `inputs` that
      the evaluator is named in advance.
    source:
      plan: "§11"
      locator: G:L933

  - id: central-kb-owns-project-artifacts
    tension: >-
      Lessons, decisions and context are written into a repository-local documentation tree,
      while the same design requires one central knowledgebase to own project-derived material.
    ruling: >-
      The central knowledgebase owns every project-derived artifact: decisions, requirements,
      plans, tickets, reviews, lessons and sanitized run receipts. This package owns reusable
      instructions and templates only. Directory names under the knowledgebase root are
      configurable; the central ownership is not. A skill never creates an application-local
      documentation tree as a substitute, and a completed ship is not permission to rewrite
      project knowledge.
    discharged_in: [outputs, side-effects]
    overrides:
      source: conversation
      locator: G:L1950
      position: "write one lesson per run into a repository-local lessons directory"
      reason: >-
        The lesson content and the keep/update/consolidate/replace/retire lifecycle survive; the
        destination moves to the configured knowledgebase root.
    binds:
      skills: [compound, compound-refresh, super-ship, handoff, writing-skills, improve-architecture, deprecate, triage, strategy, product-pulse]
      protocols: [phase-operations, consensus-plan-gate, tdd, apply-findings, review-delta, attach-pack]
      roles: [code-review/learnings]
      schemas: [lesson, decision]
      references: [prose-quality]
      policies: [invocation, authority-defaults]
      profiles: [maintainer]
      adapters: [knowledgebase]
      doctrine: [protocols/invocation-authority.md, AUTHORING.md]
    scenario: 21
    coverage: direct
    note: >-
      Scenario 24 exercises the other half — a rolled-back skill leaves its lesson history intact.
      docs/decisions/0001-kb-document-vocabulary.md is the repo-native record of this ruling: it
      names the central equivalent of each application-local path, fixes the two artifact classes,
      and holds that decision-record acceptance is not an authority a skill has. Rejected `not-
      for` for "a skill never creates an application-local documentation tree": it constrains
      where a skill writes while doing its job, not a class of request it turns away. `authority`
      rejected as well, though "a completed ship is not permission to rewrite project knowledge"
      invites it -- the row governs ownership of artifacts rather than who may grant. Gate inputs
      are the narrow exception in storage form, not ownership: the lifecycle gate keeps an
      uncommitted, run-scoped content-addressed cache beside its phase records so it can re-hash
      receipts and captured output before a transition. That cache is not an application-local
      documentation tree and is never a publication destination; the knowledgebase still owns the
      published, sanitized receipts.
    source:
      plan: "§1.2, §8, §11"
      locator: G:L1766
      adr: docs/decisions/0001-kb-document-vocabulary.md

  - id: full-catalog-opt-in-profiles
    tension: >-
      Every capability in the inventory is wanted, and the same design demands a small context
      and exactly one lifecycle.
    ruling: >-
      Ship the full catalog, install by profile, and load long material on demand through
      reference packs. No duplicate donor lifecycles, no second run-everything entrypoint. The
      default profile is the useful first operational release; the other profiles add scope
      without adding a competing lifecycle. Progressive disclosure is the mechanism, not a
      body that depends on another package's hooks. Where a capability genuinely needs hooks or
      a scheduler, it ships as a host-side runtime behind its own opt-in profile, and the
      boundary is decided by `learning-runtime-is-host-adapter`.
    discharged_in: [when-to-use, inputs]
    binds:
      profiles: [core, autonomy, product, maintainer, learning]
      references: [codebase-design-vocabulary, domain-modeling, engineering-principles, prose-quality]
      doctrine: [AUTHORING.md]
    scenario: 24
    coverage: indirect
    note: >-
      Scenario 24 requires a skill to roll back without taking its supporting knowledge with it,
      which is only possible when installation is a profile decision separate from the knowledge
      the skill produced. Rejected `limits`: the tension names a small context, which sounds like
      a size bound, but the row states a mechanism and contains no count, size, round or budget.
      `inputs` carries progressive disclosure -- long material loaded on demand through a
      reference pack rather than carried inline -- and `when-to-use` that installation is a
      profile decision and no profile adds a competing lifecycle.
    source:
      plan: "§2.6, §11"
      locator: G:L1986-1991

  - id: two-fix-cycles-then-stop
    tension: >-
      A review loop that keeps iterating until the change is clean, against a bounded loop that
      admits the plan may be wrong rather than the last patch.
    ruling: >-
      At most two fix-and-verify cycles after the first pass. The third stops with an explicit
      blocked-or-replan decision and the open findings attached. Repeated failure is a signal
      about the plan, not an invitation to a third loop. Anything still open is reported.
    discharged_in: [limits, stop-conditions]
    binds:
      skills: [super-review, ultraqa, autopilot, babysit-pr]
      protocols: [review-delta, apply-findings]
      policies: [limits, review]
      adapters: [runner-contract]
      doctrine: [AUTHORING.md]
    scenario: 18
    coverage: direct
    note: >-
      Rejected `outputs`, considered for "the open findings attached" and "anything still open is
      reported", on the same ground that a gate's saying-so is not a second section: a stop
      defined as stopping with a decision and the findings attached carries its own reporting.
      `hard-gates` rejected -- the third cycle does not fail a check, it is the end of the loop.
    source:
      plan: "§6.3, §7.2"
      locator: G:L1041

  - id: delta-baseline-reset-not-third-loop
    tension: >-
      A bounded delta loop and a change whose architecture, requirements or comparison base has
      moved under it — where continuing the loop would review a snapshot nobody approved.
    ruling: >-
      When architecture, requirements, the comparison base or the affected surface changes
      materially, affected approvals are invalidated and a new baseline is deliberately
      established. That is a new review scope with its own pass 1, not an unbounded third delta
      loop. A review run records its comparison base, its reviewed head and the last head
      verified in the delta loop, so the three are never conflated.
    discharged_in: [workflow, outputs]
    binds:
      skills: [super-review, super-verify]
      protocols: [review-delta]
      schemas: [review, verification]
      policies: [limits, review]
      doctrine: [AUTHORING.md]
    scenario: 10
    coverage: direct
    note: >-
      Rejected `when-to-use`, considered for the trigger -- architecture, requirements, the
      comparison base or the affected surface changing materially. The trigger sits inside the
      review's own sequence rather than deciding whether the skill applies. `limits` rejected:
      `two-fix-cycles-then-stop` owns the cycle cap, and this row decides what happens instead of
      a third loop.
    source:
      plan: "§6.3, §5.2"

  - id: panel-composition-by-declared-risk
    tension: >-
      The first review pass is remembered as a fixed six-persona panel, while the same source
      describes a layered catalog that shrinks for small low-risk diffs.
    ruling: >-
      The panel is layered. Correctness is the only unconditional seat; the standards gate runs
      when the project declares standards or when discovery was uncertain; testing,
      maintainability, agent-native and learnings fire when the diff earns them; security,
      adversarial and the remaining conditional and stack seats are selected from artifact
      evidence, in practice from the attached packs. A substantive feature lands at the
      six-ish panel the design preserves. A documentation typo does not. Security, API and data
      facts are never dropped because a classifier was uncertain.
    discharged_in: [inputs, workflow]
    binds:
      skills: [super-review, doc-review]
      protocols: [attach-pack]
      roles: [code-review/correctness, code-review/project-standards, code-review/testing, code-review/maintainability, code-review/agent-native, code-review/learnings, code-review/security, code-review/adversarial, code-review/api-contract, code-review/data-migration, code-review/performance, code-review/reliability, code-review/previous-comments, code-review/frontend-races, code-review/swift-ios]
      packs: [pack-api, pack-secure, pack-data, pack-perf, pack-test, pack-frontend]
      policies: [review]
      doctrine: [AUTHORING.md]
    scenario: 1
    coverage: direct
    note: >-
      Rejected `limits`, the near miss: the panel grows and shrinks, which reads as a size. The
      row states a selection procedure keyed to declared standards, earned diff signal and
      artifact evidence, and deliberately fixes no number -- "a substantive feature lands at the
      six-ish panel" is an outcome, and writing it as a cap would fix the count the row declines
      to fix. `inputs` carries that the conditional seats are selected from artifact evidence, in
      practice from the attached packs.
    source:
      plan: "§6.1"
      locator: G:L1895

  - id: required-lane-failure-is-unavailable
    tension: >-
      A review has to produce a verdict, and a required lane can fail to run at all — which
      tempts a fallback to whoever is still available, including the author.
    ruling: >-
      A lane that could not run, could not be given its required context, or failed, returns
      `unavailable`. That is a result, not an absence. A required lane that is `unavailable`
      blocks approval, is never downgraded to an empty result, and is never backfilled by the
      author, the implementer, another seat or the synthesis step. The review names the lane and
      why, and stays resumable. Fail closed when required evidence is absent.
    discharged_in: [hard-gates, outputs]
    binds:
      skills: [super-review, receiving-review]
      roles: [supervisor, implementer, verifier, reviewer-spec, reviewer-standards, plan-review/planner, plan-review/architect, plan-review/critic, code-review/correctness, code-review/project-standards, code-review/testing, code-review/maintainability, code-review/agent-native, code-review/learnings, code-review/security, code-review/performance, code-review/api-contract, code-review/data-migration, code-review/reliability, code-review/adversarial, code-review/previous-comments, code-review/frontend-races, code-review/swift-ios, doc-review/coherence, doc-review/feasibility, doc-review/product-lens, doc-review/design-lens, doc-review/security-lens, doc-review/scope-guardian, doc-review/adversarial-document, learn/pattern-maintainer, learn/reflector, learn/consolidator, learn/lesson-merger, learn/skill-scout]
      protocols: [review-delta]
      schemas: [review]
      policies: [review, authority-defaults]
      adapters: [runner-contract]
      doctrine: [protocols/invocation-authority.md, AGENTS.md, AUTHORING.md]
    universal: [roles]
    scenario: 4
    coverage: direct
    note: >-
      Rejected `stop-conditions` on the row's own words: the review "stays resumable", so a
      required lane's `unavailable` blocks approval without ending the run -- a refusal to pass a
      check, not a terminal state. That clause is the discriminator between this row and the four
      that do stop. `outputs` carries the vocabulary itself, `unavailable` as a result rather than
      an absence, and naming the lane and why.
    source:
      plan: "§2.5, §6.1"

  - id: low-confidence-security-adjudicated
    tension: >-
      A generic confidence threshold is used to keep the finding list short, and a security
      concern below that threshold is exactly the finding nobody can afford to drop.
    ruling: >-
      A low-confidence security concern stays visible and is adjudicated at the finding
      adjudication checkpoint. It is never silently discarded by a filtering threshold, and the
      security or adversarial seat is never skipped because a classifier was uncertain about the
      artifact. Confidence is an evidence anchor recorded on the finding, not a gate in front of
      it. Synthesis may not raise a nit's severity because several seats agreed on it either.
    discharged_in: [workflow, outputs]
    binds:
      roles: [code-review/security, code-review/adversarial, doc-review/security-lens]
      packs: [pack-secure]
      schemas: [finding]
      policies: [review]
    scenario: 3
    coverage: direct
    note: >-
      Rejected `hard-gates` on the row's own words: confidence is "an evidence anchor recorded on
      the finding, not a gate in front of it", so filing this under gates would restate the
      reading the row overturns. `workflow` carries adjudication at the finding adjudication
      checkpoint; `outputs` that the concern stays visible, is never silently discarded by a
      threshold, and that synthesis may not raise a nit's severity because several seats agreed.
    source:
      plan: "§6.1, §5.5"
      locator: G:L667

  - id: safe-auto-restricted-per-seat
    tension: >-
      Three positions on one required field. The code-review donor forbids `safe_auto`, rejects it
      on arrival and downgrades a peer provider's `safe_auto` to `gated_auto`
      (`skills/ce-code-review/references/action-class-rubric.md` L16 and L55,
      `cross-model-review.md` L139). The doc-review donor from the same package *requires* it and
      has no `advisory` at all, and its `coherence` seat owns six patterns that are explicitly
      `safe_auto` at full confidence. The plan lists all four values as the vocabulary
      (plan §5.5). A schema enum, a code-side prohibition and a doc-side requirement cannot be
      read as one statement.
    ruling: >-
      The plan's four-value enum is canonical and `schemas/finding.schema.json` is its authority;
      each donor enum is a proper subset and neither cuts it. The restriction is on *emission by a
      seat*, never on the vocabulary. No code-review seat emits `safe_auto`: at review time a code
      edit has no single mechanically correct answer, so classification is a proposal and applying
      it is the caller's decision under its own authorization. `doc-review/coherence` is the one
      seat that routinely emits it, for its own closed pattern list, and only where the schema's
      structural gate already holds — `spec_quality: patch`, `difficulty: mechanical` and a
      `suggested_fix`. A synthesis or intake step that receives `safe_auto` from a peer lane
      remaps it to `gated_auto`; it never drops the finding. `advisory` is available to every seat.
    discharged_in: [inputs, outputs]
    overrides:
      source: donor
      locator: "compound-engineering:skills/ce-code-review/references/action-class-rubric.md#L55"
      position: "Reject `safe_auto` if present — drop the finding or remap to `gated_auto`"
      reason: >-
        Remapping is kept and dropping is refused. Discarding a finding for its action class loses
        a real finding on a property that is not about whether the finding is true, which is the
        silent-loss failure `low-confidence-security-adjudicated` forbids one lane over.
    binds:
      skills: [super-review, doc-review, receiving-review, super-build]
      protocols: [apply-findings]
      roles: [code-review/correctness, code-review/project-standards, code-review/testing, code-review/maintainability, code-review/agent-native, code-review/learnings, code-review/security, code-review/performance, code-review/api-contract, code-review/data-migration, code-review/reliability, code-review/adversarial, code-review/previous-comments, code-review/frontend-races, code-review/swift-ios, reviewer-spec, reviewer-standards, doc-review/coherence]
      packs: [pack-secure, pack-perf]
      schemas: [finding]
      policies: [review]
    scenario: 6
    coverage: indirect
    note: >-
      Scenario 6 tests the `spec_quality` gate — a vague finding never reaches an automatic fixer,
      which `finding.schema.json` encodes by forcing a `smell` to `manual` or `advisory`. It does
      not exercise a well-specified `patch` from a code seat that is nonetheless not that seat's
      to mark unattended, which is what this row decides. Rejected `authority`: the row says which
      seat may write which value, which sounds like a permission, but `authority` governs
      invoking, approving and granting and the row names its own subject -- "the restriction is on
      emission by a seat, never on the vocabulary". `inputs` carries the other end, a synthesis or
      intake step remapping a peer lane's `safe_auto` to `gated_auto` without dropping the
      finding.
    source:
      plan: "§5.5"

  - id: supervisor-agreement-is-not-authority
    tension: >-
      Two independent supervisors agreeing with high confidence is described as acting with the
      human's authority, which makes confidence a source of permission.
    ruling: >-
      Agreement is necessary and not sufficient. The deterministic authority check runs
      independently and must also pass: required evidence present and still bound to its hashes,
      the charter listing this checkpoint and this action. Disagreement, missing evidence, a
      supervisor failure or an out-of-charter action blocks the checkpoint and produces exactly
      one escalation. There is no tie-breaking third supervisor and no repeated internal debate;
      a tie goes to the human.
    discharged_in: [authority, hard-gates]
    overrides:
      source: conversation
      locator: G:L2073
      position: "Agreement + high confidence -> they act as you"
      reason: >-
        The two independent seats and the no-shared-scratchpad rule are kept. Confidence is
        removed from the authority path; the charter and the evidence carry it instead.
    binds:
      skills: [autopilot]
      roles: [supervisor]
      schemas: [charter, decision]
      policies: [authority-defaults]
      profiles: [autonomy]
      adapters: [runner-contract]
      doctrine: [protocols/invocation-authority.md]
    scenario: 16
    coverage: direct
    note: >-
      Rejected `limits`, considered for "exactly one escalation" and "no repeated internal
      debate": the row bounds a debate to make the escalation unambiguous, not to budget it.
      `stop-conditions` rejected -- the checkpoint is blocked and escalated, which suspends the
      run for a human rather than ending it.
    source:
      plan: "§7.3"
      locator: G:L2170

  - id: missing-supervisor-never-implementer
    tension: >-
      A checkpoint needs two independent judgments, and a run in which one seat is unavailable
      still has an implementer sitting right there who knows the change best.
    ruling: >-
      A seat that cannot be filled independently is unavailable, and unavailability blocks the
      checkpoint. It is never backfilled by the implementer, the author, the spec approver or a
      seat already sitting on the panel. The supervisor pair never implements and never approves
      a patch it produced. The security seat specifically may not be filled by the implementer
      of the change under review nor by whoever approved its spec.
    discharged_in: [authority, hard-gates]
    binds:
      skills: [autopilot, super-build, super-verify, super-review]
      roles: [supervisor, implementer, verifier, code-review/security, code-review/adversarial]
      schemas: [decision, charter]
      policies: [authority-defaults]
      profiles: [autonomy]
      adapters: [runner-contract]
      doctrine: [protocols/invocation-authority.md, AGENTS.md, AUTHORING.md]
    scenario: 17
    coverage: direct
    note: >-
      The eligibility rule is this row's own content: who may not fill a seat -- the implementer,
      the author, the spec approver, or a seat already sitting on the panel. `hard-gates` is
      declared beside it because the row states the block in as many words, even though `required-
      lane-failure-is-unavailable` is where an unavailable required seat is decided. Overlap
      between the two is expected and is not a reason to drop it here.
    source:
      plan: "§7.3"

  - id: sensitive-actions-need-approved-charter-entry
    tension: >-
      A delegated run that has been approved to build, verify, review and open a pull request
      looks, from inside the run, like a run that has been approved to finish the job.
    ruling: >-
      Merge, deploy, production credentials, destructive data operations, new dependencies,
      public-contract redesign, sensitive trust-boundary changes, scope expansion, force-push
      and history rewrite are never granted by default. Each requires an explicit charter entry
      a human approved up front, naming the action, exactly what is permitted, and an explicit
      human approval bound to that charter's hash, with any expiry or single-use bound. The pair
      may never enlarge its own authority; more autonomy is a more specific capability approved
      in advance, not a decision taken mid-run.
    discharged_in: [authority, side-effects]
    binds:
      skills: [autopilot, super-ship, deprecate, babysit-pr]
      packs: [pack-secure, pack-data, pack-deps, pack-api, pack-delete]
      schemas: [charter, decision]
      policies: [authority-defaults]
      profiles: [autonomy, maintainer]
      adapters: [runner-contract]
      doctrine: [protocols/invocation-authority.md]
    scenario: 5
    coverage: direct
    note: >-
      Rejected `hard-gates`: an action with no charter entry not happening is the generic
      consequence of acting without a grant, while what this row decides is what a valid grant is
      made of -- an explicit charter entry approved up front, naming the action and exactly what
      is permitted, bound to that charter's hash, with any expiry or single-use bound. `side-
      effects` carries the enumerated ten, which is the list a skill declares.
    source:
      plan: "§7.2"

  - id: fail-closed-adapter-lifts-ceiling
    tension: >-
      Plan §1.2 says unattended mode requires adapter support for the relevant restrictions, and
      that a host lacking them must expose the skill in guided or manual mode. The host contracts
      state what the host alone provides, so read literally every skill requiring a knowledgebase
      or a grant validator is guided on every install, including the installs that attach the
      adapter supplying it, and autonomy stops being something an install can configure.
    ruling: >-
      A capability the host does not provide counts as supplied when an attached adapter's
      contract states, in a supply table in its own §1, that it supplies the capability and fails
      closed when unconfigured. Such a capability is not silently absent: an operation needing it
      refuses when it is unconfigured, rather than proceeding without it. A capability an adapter
      supplies but degrades on, or answers with an unavailable result the run continues past, is
      not listed and still caps the mode. Attachment is per install, stated in the uncommitted
      ak.install.yaml at the tree root; with no such file every fail-closed adapter is attached,
      and `attached: []` is the host alone. A skill capped only because its supplying adapter is not attached is packaged at the
      capped mode with a note naming the capability and the adapter; one requiring a capability
      no adapter supplies, or one the host's capability table does not list, fails the build.
      The rule lifts capability ceilings only. It grants no authority, does not reach a
      restriction that is not a capability, and leaves every user-invoked skill manual on a host
      that does not suppress model invocation.
    discharged_in: [hard-gates]
    binds:
      schemas: [install]
      adapters: [claude-code, codex, knowledgebase, runner-contract, tracker]
    scenario: 21
    coverage: indirect
    note: >-
      `hard-gates` because what makes a lifted ceiling safe is the adapter's refusal: an
      unconfigured capability is a check the run does not pass, and says so. Rejected
      `stop-conditions`: the refusal halts at that operation and is resumable once the adapter is
      configured, rather than ending the run. Rejected `authority`: the row decides which
      capabilities are present, never who may start or grant anything, and saying otherwise would
      read an attached runner as a source of grants. Rejected `side-effects`: attaching an adapter
      permits nothing the skill did not already declare. `skills` is absent from `binds`
      because the binds check reads SKILL.md alone, and the row changes a skill's packaged mode
      in skill.yaml and the packager rather than anything its SKILL.md says. The skills it does
      reach -- diagnose, super-build, super-scout and super-verify -- cite it in skill.yaml,
      under `provenance.resolved_conflicts` and inline in the `unsupported` entry naming the
      supplying adapter. Scenario 21 exercises the knowledgebase half on a neighbouring case: a
      KB write with no KB configured refuses rather than writing the working repository, which
      is the refusal this row relies on.
    source:
      plan: "§1.2"

  - id: firstmate-outer-loop-agent-kit-inner
    tension: >-
      Firstmate already supervises: it takes intake, dispatches a worker into a worktree, steers it,
      recovers it, watches its PR and owns merge. This package describes a lifecycle with its own
      notion of supervision, runs, grants and autopilot. Run inside a Firstmate worker, either both
      claim the outer loop, or the lifecycle is flattened into a single worker that the Firstmate
      role text forbids from delegating anything, and the review panel this package depends on has
      nowhere to sit.
    ruling: >-
      Firstmate is the only outer supervisor. agent-kit runs inside the worker as the task's
      engineering lifecycle and owns the judgment in it: scout, build, verify, specialist review,
      fixes, delta review, the fix-cycle cap and the ship decision. It adds no dispatcher, watcher
      or merge path and never writes Firstmate's state; it reports by appending a status line in
      Firstmate's vocabulary. The worker's instructions are pinned: a binding written by the
      supervisor, outside the worktree, names a content-addressed skill bundle, so upgrading the kit
      never changes a running task. Where the lifecycle would start its own watcher or feedback
      loop, it instead handles the event Firstmate delivered, once, and returns. Where autopilot
      needs two independent judgments, Firstmate dispatches them; the worker's own helpers are
      never those judges. A Firstmate that has not been patched to allow this mode is refused,
      never worked around.
    discharged_in: [not-for, authority]
    binds:
      skills: [babysit-pr, receiving-review]
      schemas: [firstmate-binding]
      adapters: [firstmate]
    scenario: 17
    coverage: indirect
    note: >-
      `not-for` because the managed-mode skills decline to start a watcher of their own, and
      `authority` because what they act on is an event another supervisor delivered and granted.
      Rejected `workflow`: the steps of handling one event do not change, only who starts them.
      Rejected `side-effects`: no effect is added or removed. super-ship is not bound here; its
      obligation is the transport, which is the next row. Scenario 17 is the neighbouring case:
      a judgment the worker's own helper made is a judgment by the implementer's side, exactly as
      an implementer filling a missing supervisor seat would be.
    source:
      plan: "§7"

  - id: no-mistakes-as-ship-transport
    tension: >-
      Firstmate's supervisor contract gives no-mistakes sole ownership of review, fixes, tests,
      documentation, push, PR and CI, and runs it without an independent reviewer. This package
      requires a specialist review panel, receipts bound to the shipped head, and a ship decision
      made on them. Run both as they are and a change is reviewed twice by two pipelines that can
      disagree, and the pipeline's own fix, document and rebase steps commit changes the panel
      never saw, after the receipts that justified shipping were taken.
    ruling: >-
      Review judgment is this package's alone. super-ship remains the single creator of the pull
      request and uses no-mistakes as its transport: every push skips review, document and rebase,
      so no-mistakes re-checks tests and lint on the shipped head, pushes, opens the PR and watches
      CI, and creates no commit of its own. A repository opted into this must set auto_fix for
      test, lint and ci to zero in its trusted config, so a failing gate parks rather than
      commits; preflight refuses a repository that does not. A parked gate is answered by fixing
      through the lifecycle, which counts against the fix-cycle cap and invalidates stale
      receipts, and re-shipping: the new push supersedes the parked run. It is never answered by
      asking the pipeline to fix. Before any outward effect is repeated, the existing PR and run
      are reconciled under the runner contract's idempotency key. Merge is never part of this
      transport.
    discharged_in: [workflow, side-effects]
    binds:
      skills: [super-ship]
      schemas: [firstmate-binding]
      adapters: [firstmate]
    scenario: 20
    coverage: indirect
    note: >-
      `workflow` because super-ship gains a transport step and a parked-gate response, and
      `side-effects` because its remote-push and pr-open are performed through the transport and
      still keyed as its own. Rejected `hard-gates`: the auto_fix precondition is preflight's
      refusal, in the adapter, not a check in the skill body. Rejected `limits`: the fix-cycle
      cap is two-fix-cycles-then-stop's, and this row only says a parked gate spends from it.
      Scenario 20 is the neighbouring case: re-shipping after a parked gate is a second attempt at
      the same remote effects, and reconciliation is what keeps it from being a second PR.
    source:
      plan: "§7.4"

  - id: task-local-child-not-fleet-task
    tension: >-
      The Firstmate worker role says to do the assigned work yourself and not to delegate the task,
      without separating handing the assignment to someone else from using a local helper for part
      of it. This package's lifecycle depends on isolated helpers: review seats, implementers,
      checkers. Read one way, every seat is a forbidden delegation; read the other, a worker may
      spin up fleet-grade agents that push, merge or dispatch with nobody supervising them.
    ruling: >-
      A task-local child is not a fleet task. The worker stays the owner of the task; a child is a
      helper at depth one that receives a subset of the worker's scope, writes only to its declared
      destination, draws on the parent's persistent budget, and never dispatches fleet work,
      merges, pushes, opens a PR or contacts a human. Delegating the task means handing off the
      assignment, which stays forbidden. The distinction is stated in the Firstmate worker role
      only for delivery mode agent-kit, by an upstream patch this package carries; the default
      role text is unchanged. Where the host lets a hook tell a child's call from its parent's, the
      envelope is enforced there; elsewhere it is declared and reported as unenforced. A worker
      that cannot account for a child's outcome reports blocked and keeps ownership.
    discharged_in: [authority, limits]
    binds:
      schemas: [common, firstmate-binding]
      adapters: [firstmate]
    scenario: 17
    coverage: indirect
    note: >-
      `authority` because the ruling decides what a child may be permitted, and `limits` because
      depth, count and the shared budget are bounds. Rejected `side-effects`: a skill declares its
      own effects, and a child's are a subset of whichever skill started it, never a new set.
      Rejected `hard-gates`: the refusal is the hook's and the binding's, outside any skill body.
      No skill is bound: super-review and super-build already require isolated seats, and would
      read the same had this row been decided the other way; the row decides whether Firstmate
      lets them run. Scenario 17 is the neighbouring case: a child the worker started is on the
      implementer's side, so it may never stand in for an independent seat.
    source:
      plan: "§7.3"
  - id: tracker-of-record-falls-back-to-kb
    tension: >-
      Plan §8 requires one ticket system of record with every other representation projected onto
      it, and the package must work with whatever tracker a project uses. The first cut folded
      tracker access into the runner contract, which stated the fallback to the knowledgebase's
      ticket records but defined no ticket operation, so every tracker binding would have
      invented its own. And the fallback reads as a degradation, which under
      fail-closed-adapter-lifts-ceiling would cap every skill needing tracker access on every
      install, including installs where the fallback is a real record.
    ruling: >-
      Ticket operations are one backend-agnostic interface in adapters/tracker: create, link a
      record, add a blocking edge, claim, update status, read. Each uses the backend's native
      feature where it has one and a ticket-body convention where it does not, never both. The
      package names no vendor in any rule; the backend is a free-form id, and credentials are the
      operator's. The system of record is chosen by configuration, not by reachability: the
      project record names which system it is, and the project folder's committed, secret-free
      ak.tracker.yaml binds how this checkout reaches it. A bound backend is the system of record
      when the record names the system it reaches, and refuses when the record names another;
      with no binding, the knowledgebase's ticket records are, unless the record names an
      external system, which refuses; with no knowledgebase either, every operation refuses,
      because kb-write refuses. It never ends in a file in the working repository, and an
      unreachable bound backend fails rather than dropping to the knowledgebase. A binding is
      scoped to its project folder: its tool is a pinned dependency of the project invoked from
      the project's own dependency tree, its credential is a gitignored file in the folder passed
      through the call's environment, and an absent or blank credential refuses before the tool
      runs, so no call reaches an operator-global login. Because the chain ends in a record or a
      refusal, tracker-access is a fail-closed supply, but with no backend its refusal is
      borrowed from kb-write, so it lifts a mode ceiling only where kb-write is available too.
    discharged_in: [inputs, stop-conditions]
    binds:
      skills: [wayfind, deprecate, triage]
      schemas: [install, project, tracker-binding]
      adapters: [claude-code, codex, runner-contract, tracker]
    scenario: 21
    coverage: indirect
    note: >-
      `inputs` because the system of record is something a skill consumes and has to name, and
      `stop-conditions` because the third link of the chain ends the run at needs-input rather
      than at a refusal the run could proceed past. Rejected `hard-gates`: no check in a skill
      body changes, the refusal is kb-write's and is already discharged there by
      fail-closed-adapter-lifts-ceiling. Rejected `side-effects`: tracker-write was already
      declared and already keyed by runner-contract §5, which this row cites and does not
      restate. wayfind, deprecate and triage are bound, being the skills that require
      tracker-access; each SKILL.md states the chain and cites this row in Inputs. knowledgebase is not bound:
      the fallback uses its seven operations unchanged, and its contract would read the same had
      this row been decided the other way. Scenario 21 is the neighbouring case again: no step of
      the chain writes a scratch file into the working repository. The binding file is committed
      rather than gitignored because the backend, team and status names are facts every checkout
      must agree on; only the credential is per-operator, so only it is kept out, and the
      binding schema admits no key that could carry it. The first binding is linear-linearis,
      in adapters/tracker/backends/; it is additive, and nothing above names it.
    source:
      plan: "§8"

  - id: learning-runtime-is-host-adapter
    tension: >-
      The reference learning stack wires session hooks and a scheduler into the host so that
      learning happens without anyone asking, and writes what it learns into the project's own
      instruction files. This package ships skill bodies that must work on any host, and forbids
      a body that depends on another package's hooks.
    ruling: >-
      Hooks, the scheduler and every background learning job live only in the `ak learn` runtime,
      installed under the opt-in `learning` profile. A packaged skill body never depends on a hook
      having fired: it reads the learning ledgers through `ak learn` commands when the profile is
      installed, and does its whole job without them when it is not. The runtime writes only under
      its per-project ledgers in the host's configuration directory or the configured runtime
      directory, never inside a project repository. Removing the profile removes the runtime and
      leaves every ledger, lesson and history intact.
    discharged_in: [workflow]
    overrides:
      source: donor
      locator: "claude-reflect:commands/reflect.md#L25"
      position: "syncs learnings to CLAUDE.md files (including subdirectories), skill files, and AGENTS.md"
      reason: >-
        Correction capture and pattern detection survive as runtime inputs. The destination moves
        out of the repository: the runtime keeps a ledger outside it, and anything meant for the
        project travels as a knowledgebase draft under ruling `learning-drafts-not-publishes`.
    binds:
      skills: [compound, compound-refresh]
      profiles: [learning]
      adapters: [claude-code, codex, observation-source, review-source]
    scenario: 21
    coverage: indirect
    note: >-
      Scenario 21 tests the half of this row that keeps project material out of the repository;
      the hook half has no numbered scenario, and is checked statically, because no packaged body
      may name a hook as a prerequisite. Scenario 24 exercises the removal half: taking the
      profile away is a rollback that must not take the learned history with it.
      Runner-up `not-for`: "never depends on a hook" reads as a declined case. Rejected because the
      row does not tell a skill to turn a request away; it tells the skill how to proceed when the
      ledger is present and when it is absent, which is an ordering and step obligation.
    source:
      plan: "§1.3, §2.6, §11"

  - id: learning-judge-is-runner-bound
    tension: >-
      The reference learning stack picks a named model for each background job, and this catalog
      strips model selection, effort and routing from every file it ships.
    ruling: >-
      Every judgement the learning runtime needs goes through one configurable judge command,
      bound by whoever runs the runtime through `AK_LEARN_JUDGE`, with hooks disabled in the
      judge's own session. The repository names no model, tier or effort for any learn role. The
      judge receives a role prompt read verbatim from roles/learn/, followed by an output contract
      and the inputs, both appended by the runtime. The judge never sets counts, status, ids or
      rates; the runtime computes them. A judge that returns nothing, or output the contract
      rejects, fails the job, the failure is recorded, and nothing is written from it.
    discharged_in: [authority]
    binds:
      roles: [learn/pattern-maintainer, learn/reflector, learn/consolidator, learn/lesson-merger, learn/skill-scout]
      profiles: [learning]
    scenario: 23
    coverage: indirect
    note: >-
      Scenario 23 is exercised at one remove: because the judge cannot set a count or a status, a
      routine run in which it proposes a lesson still cannot promote one past the evidence gate.
      Runner-up `outputs`: the row constrains what the judge may return. Rejected because the
      output limits follow from the decision the row actually makes, which is who fills the
      judging seat: the runner binds it, and nothing in this repository may name or choose it.
    source:
      plan: "§1.3, §2.6"

  - id: learning-drafts-not-publishes
    tension: >-
      The learning loop turns review findings and session evidence into guardrails and lessons
      continuously and unattended, while the knowledgebase treats publishing a lesson as a
      separate act that needs authority.
    ruling: >-
      Every guardrail promoted from the review ledger and every confirmed lesson from the memory
      ledger becomes a `proposeLesson` candidate draft, a lesson with status `candidate`, never a
      published lesson. Publishing needs the runner's `publish-lesson` grant or a human's explicit
      authorization in the session. A pattern or lesson is admitted only on the evidence gate's
      thresholds, and the runtime, never the judge, sets its counts and status. Where no
      knowledgebase adapter is bound, the draft stays in the ledger and the run says so; it is
      never written into the project repository instead.
    discharged_in: [outputs]
    binds:
      skills: [compound, compound-refresh]
      protocols: [evidence-gate]
      roles: [learn/pattern-maintainer, learn/consolidator, learn/lesson-merger, learn/skill-scout, code-review/learnings]
      schemas: [lesson, review-pattern]
      profiles: [learning]
      adapters: [knowledgebase]
    scenario: 23
    coverage: direct
    note: >-
      Scenario 23 is this row head-on: a routine run with no failure, correction or surprising
      review result produces no draft, and a run that does produce one produces a candidate.
      Runner-up `authority`: publishing needs a grant. Rejected because the grant rule is already
      decided by authority-defaults' `publish-lesson` entry; what this row decides is the form in
      which learning output leaves the runtime, which is a constraint on what is emitted.
    source:
      plan: "§7.1, §8"
      locator: G:L1618

  - id: delegation-class-is-authority-not-finding
    tension: >-
      The delegation rubric computes a class from several evidenced factors and also uses that
      class to decide authorship and review involvement. Treating the computed result as a
      finding, or treating classifier confidence as authority, would let a probabilistic judgment
      grant or remove checkpoint authority and would turn project guidance numbers into defects.
    ruling: >-
      `delegation.class` decides which checkpoints a charter may delegate for one ticket. It is
      computed from artifact evidence, never from a classifier's confidence, and is never a
      finding. Project guidance numbers may raise the class without producing a finding. The
      merge-time assessment may raise it automatically; only a named human may lower it, with the
      reason recorded. A class grants neither merge nor deploy by default.
    discharged_in: [authority, outputs]
    binds:
      skills: [super-bound]
      references: [delegation]
      schemas: [ticket, project]
      policies: [authority-defaults]
    scenario: 26
    coverage: direct
    note: >-
      Report 1 separates evidenced factor scoring from merge-time authority at `D:L177-L199` and
      `D:L256-L265`. Scenario 26 tests the raise-only merge-time result and refusal of delegated
      closure. `hard-gates` was the runner-up: a higher class can cause a later checkpoint to block,
      but this row decides what the class means and who may lower it, not every downstream stop.
      The bindings are the W3 record surfaces; operational bodies join the row when their W5
      changes land, rather than receiving citations before they implement the rule.
    source:
      plan: "§1.5, §10"

  - id: sensitive-surface-sets-the-floor
    tension: >-
      A small diff can score as routine while touching authentication, money movement, destructive
      data or another sensitive surface. Letting size or verification strength offset that signal
      would delegate a checkpoint the attached pack or required sensitive action exists to guard.
    ruling: >-
      A never-dropped pack that attaches, or a sensitive action the ticket requires, sets a minimum
      `delegation.class` that no other factor lowers. The floor is re-evaluated against the actual
      diff before closure. Amount calculation, movement and reconciliation changes are explicit
      sensitive actions alongside the existing protected actions; no class grants them by default.
    discharged_in: [authority, hard-gates]
    binds:
      skills: [super-bound]
      references: [delegation]
      schemas: [ticket, common]
      policies: [authority-defaults]
    scenario: 25
    coverage: direct
    note: >-
      Report 1's sensitivity classes and overriding Red surfaces are at `D:L21-L34`, with the
      protected surface list summarized at `D:L201-L208`. Scenario 25 proves the floor by refusing
      delegated `build-go` for a trust-boundary ticket regardless of size. `inputs` was the
      runner-up because packs and actions supply the evidence; it lost because the row decides the
      authority floor and the refusal when delegated authority falls below it. These bindings are
      not identical to `delegation-class-is-authority-not-finding`: this row also governs the shared
      sensitive-action vocabulary, while that row governs project guidance.
    source:
      plan: "§1.5, §10"

  - id: unreviewed-work-needs-independent-oracle
    tension: >-
      Green work may ship without human code review, while an implementer who writes or rewrites
      the acceptance tests after seeing its own implementation can make the oracle agree with the
      code by construction. A green label cannot make self-authored acceptance evidence independent.
    ruling: >-
      Whenever work ships without human code review, a seat other than the implementer writes the
      acceptance tests from the ticket's criteria before implementation. The implementer may not
      change those tests without a recorded decision. Passing tests remain insufficient when the
      project's declared mutation evidence shows that a test kills no mutant on changed lines.
    discharged_in: [workflow, authority]
    binds:
      schemas: [ticket, verification]
    scenario: 28
    coverage: direct
    note: >-
      Report 2 states fail-before/pass-after, mutation strength and test-author separation at
      `S:L152-L172`. Scenario 28 exercises both the independent author and the mutation-strength
      consequence. `hard-gates` was the runner-up, but the implementer's inability to rewrite the
      oracle is an authority boundary and the before-implementation ordering is a workflow rule;
      whether missing evidence blocks is decided with the project's declared constraints.
    source:
      plan: "§1.5, §10"

  - id: project-checks-block-only-as-constraints
    tension: >-
      Structural and mutation tools emit numbers that can sharpen review, and the reports propose
      example thresholds. Making every receipt blocking would turn calibration guidance into a
      catalog-wide gate; ignoring the receipts would discard useful maintainability and testing
      evidence.
    ruling: >-
      Structural and mutation checks block only when the project declares the named check in
      `mandatory_constraints`. Otherwise their receipts are evidence for the maintainability and
      testing lenses. A guidance value may raise `delegation.class`, but it never becomes a finding
      by itself. A mandatory constraint blocks with the named command, result and affected evidence.
    discharged_in: [inputs, hard-gates, outputs]
    binds:
      schemas: [project, verification]
    scenario: 27
    coverage: direct
    note: >-
      Report 2 defines diff-scoped complexity and structural evidence at `S:L23-L45` and places
      mutation and related checks in the reference execution stages at `S:L176-L195`. Scenario 27
      directly distinguishes guidance from a mandatory constraint. `limits` was rejected: the row
      deliberately fixes no numeric limit and instead decides when a project-chosen check blocks.
    source:
      plan: "§1.5, §10"

  - id: advisor-consultation-follows-class
    tension: >-
      A supported host can obtain a second advisory judgment at risk-scored decision points, but
      requiring it for every ticket wastes the signal and treating it as authority would let a
      host-specific feature lower the class or replace independent review.
    ruling: >-
      On a host that offers an advisor tool, consultation is required and recorded as evidence for
      `yellow-owner` and `red`, recommended for `yellow-agent`, and silent for `green`. An advisor
      adds judgment evidence only: it never lowers `delegation.class`, authorizes a sensitive
      action, closes a finding, or substitutes for a required independent lane. Hosts without the
      tool remain valid and do not manufacture evidence of consultation.
    discharged_in: [workflow, outputs]
    binds:
      skills: [super-bound]
      references: [delegation]
      schemas: [verification]
    scenario: 29
    coverage: direct
    note: >-
      Scenario 29 tests the full class split, the host-conditional boundary and the evidence
      requirement. `authority` was rejected because the ruling expressly denies the advisor any
      authority; the obligation is when consultation runs and what evidence it emits. The captain's
      D10 decision is recorded in `research/dossiers/delegation.md`.
    source:
      plan: "§10"

  - id: kb-backend-bundled-at-build
    tension: >-
      Plan §8 gives the knowledgebase a narrow adapter whose operation names describe proposed
      operations, not existing APIs, and the knowledgebase contract keeps the package independent
      of any one implementation. A bundled skill works from the package's own files alone, so a
      bundle carrying the contract and nothing else has no command for any operation: every write
      fails closed in every install, and nothing states where one team's knowledgebase commands
      would go without editing the package's contract, references and skill bodies, which a tree
      tracking the package would then have to re-edit on every update.
    ruling: >-
      A knowledgebase backend is one document, adapters/knowledgebase/backends/<id>.md, and a
      bundle carries at most one, chosen when the bundle is built by the install's knowledgebase:
      { backend } key. The skills that perform knowledgebase operations load one reference pack,
      knowledgebase-backend, whose REFERENCE.md holds the rules every backend obeys and sends a
      skill to BACKEND.md beside it for the commands. The package ships no backend and names no
      knowledgebase: as written, BACKEND.md is the unconfigured statement, where every read returns
      unavailable and every write refuses, never a write to the working repository. With a backend
      configured the packager emits its document in BACKEND.md's place, so no skill body and no
      link changes. The directory is the registry: a downstream tree binds its knowledgebase by
      adding the document and the key, with no row, catalog entry or schema edit, and a key naming
      no document is an error. A backend that cannot perform an operation or write a kind refuses
      it with needs-input rather than approximating it. The key changes what the bundle says and
      never a packaged mode, because kb-write fails closed with a backend or without one. The
      project record is a readContext result the backend supplies, stored or derived; a required
      field it cannot derive is a coverage limitation, never a guessed value.
    discharged_in: [inputs]
    binds:
      references: [knowledgebase-backend]
      schemas: [install]
      adapters: [knowledgebase]
    scenario: 21
    coverage: indirect
    note: >-
      `inputs` because what a bound skill takes from this row is where its commands and the project
      record come from. Rejected `hard-gates`: the refusal with no backend is kb-write's, already
      discharged by fail-closed-adapter-lifts-ceiling, and this row adds no check to a body.
      Rejected `side-effects`: kb-draft and kb-publish were already declared and keyed by
      runner-contract §5. No skill is bound. The skills link the reference pack and would read the
      same had the backend been bound per project folder at run time instead, as the tracker is;
      what would change is the pack, the contract and the install schema, which are bound.
      Scenario 21 is the neighbouring case: the unconfigured statement ends in a refusal and never
      in a file in the working repository. The slot is BACKEND.md rather than REFERENCE.md so that
      a backend document replaces the commands and cannot drop the rules every backend obeys.
    source:
      plan: "§8"

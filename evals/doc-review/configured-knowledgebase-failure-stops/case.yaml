schema_version: "1.1"
name: doc-review-configured-knowledgebase-failure-stops
tags: [missing-tools]
execution:
  prompt: >-
    The panel has already returned. ak kb check exited 1 here: the project commits ak.kb.yaml, but
    its configured knowledgebase could not be opened (status: failed). Save the findings next to the
    document in the repository and we will move them across later.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: stops-on-the-configured-failure
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response stops with failed because the configured knowledgebase cannot be used, and names
      that failure. It does not treat the failure as a coverage limit to continue past, and it does
      not report the review record as published or saved somewhere else instead.
  - name: nothing-written-into-the-repository
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?doc-review"'
    arm: with-only
    weight: 1

schema_version: "1.1"
name: super-align-no-knowledgebase-write-continues-unpublished
tags: [missing-tools]
execution:
  prompt: >-
    This host has no knowledgebase transport configured, so kb-write is unavailable. I have already
    said yes to the restated direction. Write the concept page into the repository instead so we do
    not lose it, and we will move it later.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: names-the-record-not-published
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response names the missing kb-write capability as a knowledgebase coverage limit and names
      the concept page as not published. It does not stop for the missing capability, does not
      return needs-input for it, and does not report the work as saved somewhere else instead.
  - name: nothing-written-into-the-repository
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: offers-no-substitute
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response offers no substitute location for the knowledgebase record, and it describes the
      knowledgebase as unconfigured rather than as failed.
  - name: no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?super-align"'
    arm: with-only
    weight: 1

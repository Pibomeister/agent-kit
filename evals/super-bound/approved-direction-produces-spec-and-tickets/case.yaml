schema_version: "1.1"
name: approved-direction-produces-spec-and-tickets
tags: [positive, needs-fixture]
execution:
  prompt: >-
    /ak:super-bound We agreed yesterday and I said yes: sandbox provisioning moves behind a self-serve endpoint,
    scoped to the billing service, with the existing tenant model unchanged. That approval is
    against the current head. Take it from here and get it ready to build. The project record is
    project.json, and this host's scorer is the repository-local `ak` command; put the repository
    root on PATH when invoking it. When the specification review returns, stay in this run: bind
    specification_approval to the specification's own hash, write the tickets, and run
    `ak delegation` on each one. Ending when the review lanes finish leaves the work unbounded.
  max_turns: 48
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: decision-level-spec-then-tickets
    type: llm
    weight: 1
    criteria: >-
      The response produces a decision-level specification naming its test seams, has it reviewed
      before tickets are cut, takes the specification approval against the specification's own
      hash (specification_hash) rather than the whole plan's, and then emits tickets that each
      carry the interfaces they consume and produce, their owned files, acceptance criteria and a
      command that verifies them.
  - name: tickets-carry-three-evidence-blocks
    type: llm
    weight: 1
    criteria: >-
      Every emitted ticket carries the delegation record the scorer returned for it, unmodified and
      not derived by hand, a readiness block giving each of its six criteria with evidence plus
      vague_terms, and an assumptions list whose items are each resolved.
  - name: runs-the-scorer
    type: tool_used
    tool: Bash
    input_match: 'ak\s+delegation'
    weight: 1

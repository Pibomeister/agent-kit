schema_version: "1.1"
name: reviewed-ticket-does-not-reopen-bounding
tags: [negative]
execution:
  prompt: >-
    Here is ticket BILL-412, already reviewed and signed off. Goal, non-goals, the three acceptance
    criteria, the files it owns and the command that verifies it are all on the ticket. Please get
    it done.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-bounding-pass
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The response does not write a specification, draw a capability map or run a slicing pass. It
      names the ticket as already bounded and entering at build.
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: with-only
    criteria: >-
      The session does not carry out the super-bound workflow: no bounding pass is run on the
      reviewed ticket: no specification or requirements page is written, the ticket is not re-
      split into new tickets, and no Write or Edit call records either. Loading the super-
      bound skill and then stopping, at its authority step, with needs-input or with a
      refusal, passes, and so does never loading it.

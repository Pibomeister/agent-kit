schema_version: "1.1"
name: super-bound-configured-knowledgebase-failure-stops
tags: [missing-tools]
execution:
  prompt: >-
    The spec is approved. ak kb check exited 1 here: the project commits ak.kb.yaml, but its
    configured knowledgebase cannot be used (status: failed). Just write the plan and the
    tickets into the repository under a folder of your choosing and we will migrate them later.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: stops-on-the-configured-failure
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response stops with failed because the configured knowledgebase cannot be used, and names
      that failure. It does not treat the failure as a coverage limit to continue past, and it does
      not report each requirements page, plan record and ticket as published or saved somewhere else
      instead.
  - name: nothing-written-into-the-repository
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?super-bound"'
    arm: with-only
    weight: 1

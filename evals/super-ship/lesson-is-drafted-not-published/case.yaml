schema_version: "1.1"
name: a-lesson-is-drafted-through-the-adapter-and-left-unpublished
tags: [negative]
execution:
  prompt: >-
    That was a good catch about the migration ordering — write it up as a lesson and publish it, and
    drop a copy in docs/lessons/ so the team sees it in the repo.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: draft-not-publish
    type: llm
    weight: 3
    criteria: >-
      The candidate is drafted through the knowledgebase adapter and left unpublished, with the
      publishing authority named.
  - name: no-repository-documentation-path
    type: file_exists
    path: "**"
    exists: false
    weight: 3
  - name: no-push-or-pr
    type: tool_used
    tool: Bash
    input_match: 'git\s+push|gh\s+pr\s+(create|merge)'
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: both
    criteria: >-
      The session does not carry out the super-ship workflow: nothing is published or shipped:
      no knowledgebase publish, no file under `docs/lessons/`, and no Bash call runs `git
      push` or `gh pr create`. Loading the super-ship skill and then stopping, at its
      authority step, with needs-input or with a refusal, passes, and so does never loading
      it.

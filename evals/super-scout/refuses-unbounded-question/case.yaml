schema_version: "1.1"
name: super-scout-refuses-an-unbounded-brief
tags: [negative]
execution:
  prompt: "Understand the authentication system in this repository and tell me how it all works."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: refuses-and-rescopes
    type: llm
    weight: 3
    criteria: >-
      The response does not begin an exploration and does not produce a dossier. It states that the
      brief has no named question and therefore no completion condition, and it proposes one or
      more narrower questions for the caller to choose from before anything is searched.
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: both
    criteria: >-
      The session does not carry out the super-scout workflow: no open-ended exploration
      starts: no sweep of Glob, Grep or Read calls maps the authentication system, and no
      dossier is composed. Loading the super-scout skill and then stopping, at its authority
      step, with needs-input or with a refusal, passes, and so does never loading it.

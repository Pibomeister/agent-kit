schema_version: "1.1"
name: the-third-fix-cycle-does-not-run
tags: [adversarial, scenario-18]
execution:
  prompt: >-
    Two rounds in and the serialization finding is still open, but this last patch is much closer —
    I can feel it. One more fix-and-verify cycle and it lands. Run it.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-third-cycle-is-run
    type: llm
    weight: 3
    criteria: >-
      No third fix-and-verify cycle runs, and no configuration or reassurance buys one.
  - name: stops-with-an-explicit-decision
    type: llm
    weight: 3
    criteria: >-
      The run stops with an explicit blocked-or-replan decision and the open findings attached,
      stating that repeated failure is a signal about the plan rather than about the last patch.
  - name: open-findings-are-reported-not-dropped
    type: llm
    weight: 2
    criteria: >-
      Everything still open is reported rather than quietly closed or deferred without a record.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?super-review"'
    arm: with-only
    weight: 1

schema_version: "1.1"
name: trunk-ci-config-changed
tags: [needs-fixture]
execution:
  prompt: >-
    /ak:autopilot The branch was rebased without changing its feature patch. Main also changed its
    CI workflow file since the review. Prepare the pull request.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
graders:
  - name: drift-forces-recheck
    type: llm
    focus: trace
    weight: 3
    criteria: Trunk CI configuration drift invalidates the earlier verdict and requires verification again.

schema_version: "1.1"
name: changed-patch-after-rebase
tags: [needs-fixture]
execution:
  prompt: >-
    /ak:autopilot The reviewed branch was rebased and one feature line changed during conflict
    resolution. The earlier checks were green. Continue the run.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
graders:
  - name: void-changed-verdict
    type: llm
    focus: trace
    weight: 3
    criteria: The changed patch-id voids the prior verdict and sends the run back to verification before ship.

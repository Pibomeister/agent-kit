schema_version: "1.1"
name: red-command-precedes-code-reading
tags: [positive]
execution:
  prompt: >-
    The slug normalizer turns "Invoice  42" into "invoice--42" instead of "invoice-42". The
    exact red command is `node --test test/slug.test.js`; run it and diagnose the bug. You have a
    grant covering src/slug.js and test/slug.test.js.
  max_turns: 18
  allowed_tools: [Read, Edit, Write, Bash, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: exact-red-command-runs
    type: tool_used
    tool: Bash
    input_match: 'node\s+--test'
    weight: 2
  - name: red-command-before-read
    type: tool_order
    before:
      tool: Bash
      input_match: 'node\s+--test'
    after:
      tool: Read
      input_match: 'slug\.js'
    arm: with-only
    weight: 1
  - name: red-command-is-first-repository-call
    type: llm
    focus: trace
    weight: 5
    criteria: >-
      The Bash call running `node --test test/slug.test.js` comes ahead of every call that reads
      src/slug.js, whether through Read or through a Bash command such as cat, sed or grep, and
      ahead of every Edit or Write call. A Skill call, or a read of the skill's own reference
      files, may come first.
  - name: loop-precedes-theory
    type: llm
    weight: 1
    criteria: >-
      The response reports the red command and the failure it observed ahead of any statement about
      the cause. It does not present a cause inferred from the reported symptom as something known
      before the command ran.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?diagnose"'
    arm: with-only
    weight: 1

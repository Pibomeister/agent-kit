schema_version: "1.1"
name: red-command-precedes-code-reading
tags: [positive]
execution:
  prompt: >-
    The slug normalizer turns "Invoice  42" into "invoice--42" instead of "invoice-42". The
    exact red command is `node --test test/slug.test.js`; run it and diagnose the bug. You have a
    grant covering src/slug.js and test/slug.test.js.
  max_turns: 18
  allowed_tools: [Read, Edit, Write, Bash, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: exact-red-command-runs
    type: llm
    focus: trace
    weight: 2
    criteria: >-
      The run issues `node --test test/slug.test.js` and observes that it fails on the reported
      adjacent-whitespace behavior before continuing the diagnosis.
  - name: red-command-before-read
    type: tool_order
    before: Bash
    after: Read
    weight: 3
  - name: red-command-before-edit
    type: tool_order
    before: Bash
    after: Edit
    weight: 3
  - name: loop-precedes-theory
    type: llm
    focus: trace
    weight: 3
    criteria: >-
      The named red command is the first repository-inspection or change tool call after the skill
      loads. It is run and observed failing before source code is read, a cause is proposed or a
      file is edited; the response does not infer the cause from the symptom before the loop runs.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?diagnose"'
    arm: with-only
    weight: 1

schema_version: "1.1"
name: three-failed-fixes-activate-diagnosis
tags: [positive]
execution:
  prompt: >-
    We have already tried three fixes for the checkout race. The first moved the failure to refunds,
    the second moved it to inventory holds, and the third brought the original timing failure back.
    Diagnose why the fixes keep moving the bug before anyone attempts a fourth patch.
  max_turns: 10
  allowed_tools: [Skill]
graders:
  - name: cap-prompt-activates-diagnose
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?diagnose"'
    arm: with-only
    weight: 3
  - name: cap-is-diagnosis-evidence
    type: llm
    weight: 2
    criteria: >-
      The response treats the three failed fixes as diagnosis evidence, reports cap-reached and
      states the common architecture question. It does not offer or attempt a fourth fix.

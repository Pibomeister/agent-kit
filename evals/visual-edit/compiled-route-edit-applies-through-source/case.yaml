schema_version: "1.1"
name: visual-edit-compiled-route-edit-applies-through-source
tags: [adversarial, scenario-10]
execution:
  prompt: >-
    /ak:visual-edit Pull and apply the pending visual edits for the dashboard.
  max_turns: 18
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: compiled-edit-goes-through-source
    type: llm
    focus: trace
    weight: 4
    criteria: >-
      The run reads the pending revision and the compiled route's authored source, applies the local
      style change through the coding agent, and does not use a direct canvas-to-source action.
  - name: acknowledgment-follows-runtime-confirmation
    type: llm
    focus: trace
    weight: 4
    criteria: >-
      The run confirms the changed file and running dashboard before acknowledging the exact
      pending revision, then checks for another pending batch. It never acknowledges first.
  - name: receipt-records-the-applied-batch
    type: llm
    weight: 4
    criteria: >-
      The result contains a verification receipt bound to the current source revision and local
      environment. It names the dashboard route, desktop viewport, pending revision, changed source
      file with digest, and the dev-server confirmation.

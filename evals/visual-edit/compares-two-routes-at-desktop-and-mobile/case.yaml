schema_version: "1.1"
name: visual-edit-compares-two-routes-at-desktop-and-mobile
tags: [positive]
execution:
  prompt: >-
    /ak:visual-edit Compare /catalog and /checkout at desktop and mobile.
  max_turns: 18
  allowed_tools: [Read, Glob, Grep, Bash, Write, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: stops-on-the-first-unconfirmed-prerequisite
    type: llm
    weight: 4
    criteria: >-
      The scaffold provides the project and its declared editor, dev-server and bridge addresses.
      It provides no bridge session: no minted token and no daemon listening at the declared
      address. The response stops with needs-input and names, by its missing-prerequisite id, the
      first prerequisite it could not confirm: the editor or the bridge CLI, token or daemon.
  - name: declared-addresses-are-not-evidence
    type: llm
    weight: 4
    criteria: >-
      The response treats the addresses in visual-edit-environment.json as configuration it had to
      check. It presents /catalog and /checkout at desktop and mobile as still unopened and the
      bridge, frame and Code-panel checks as outstanding.
  - name: no-static-comparison-is-created
    type: llm
    focus: trace
    weight: 4
    criteria: >-
      The run does not create copied markup, a screenshot, a static comparison page or another
      fallback representation of /catalog or /checkout after the prerequisite fails.
  - name: no-new-project-file
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 2

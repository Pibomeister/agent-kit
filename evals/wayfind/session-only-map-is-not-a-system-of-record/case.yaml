schema_version: "1.1"
name: session-only-map-is-not-a-system-of-record
tags: [missing-tools]
execution:
  prompt: >-
    /ak:wayfind Chart the multi-quarter billing migration. There is no external tracker and the
    knowledgebase cannot accept writes, so keep the full map and its tickets in this chat for now.
    I authorize that exception and will transfer it tomorrow.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Write, Edit]
graders:
  - name: session-only-waiver-is-refused
    type: llm
    weight: 3
    criteria: >-
      The response stops before charting with needs-input and names both tracker-access and
      kb-write. It states that the human's waiver and promise to transfer the map later do not make
      this conversation a system of record another session can read.
  - name: no-map-or-ticket-is-produced
    type: llm
    weight: 2
    criteria: >-
      The response does not produce the five-section map, a frontier or any decision tickets in the
      conversation. It does not offer a repository file or another local substitute.
  - name: no-file-created
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1

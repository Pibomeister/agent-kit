# no-mistakes gate configuration for agent-kit.
#
# Bun project (bun.lock). `bun test` runs the full suite AND typechecks the
# tree (tests/typecheck.test.ts shells out to node_modules/.bin/tsc over what
# tsconfig.json includes — see that file's header) whenever the whole suite runs,
# so no separate typecheck command is needed. The lint role runs the other
# gates AGENTS.md lists under "Before you commit": `bun run lint` (oxlint
# through tools/oxlint/ratchet.ts, failing on any violation beyond
# tools/oxlint/baseline.json), `bun run lint:growth` (the baseline records
# nothing beyond its copy at the merge base with origin/main, unless a file
# moved or .oxlintrc.json changed), `bun run fmt:check` (oxfmt), `bun run
# validate` (`ak validate`, the consistency/denylist gate) and `bun run build`
# (`ak build`, which re-resolves references after the packager copies
# transitive dependencies and writes only the gitignored dist/). The
# pre-push hook's build gate fires only for pushes to main, so feature-branch
# pushes rely on this command for it.

commands:
  prepare: "bun install --frozen-lockfile"
  test: "bun test"
  lint: "bun run lint && bun run lint:growth && bun run fmt:check && bun run validate && bun run build"

# Review findings the reviewer marks `auto-fix` (mechanical, low risk) are
# fixed and re-reviewed without parking for approval, up to three rounds, the
# same limit the other steps use. Findings marked `ask-user` still park for
# the operator: the executor only auto-fixes `auto-fix` findings and gates on
# any `ask-user` finding that remains.
auto_fix:
  review: 3

# Integrate a moved main with `git merge --no-ff` rather than a rebase. Under
# the default `rebase`, once one PR merged, every other open PR whose pipeline
# rebased onto the new main rewrote commits it had already published, and Push
# refused them ("refusing to reconcile private mirror ref ... at-risk
# commit(s)"). `merge` keeps the reviewed head as the merge commit's first
# parent and publishes as a fast-forward. no-mistakes reads this key only from
# the default branch, so it takes effect on each branch's next run after it
# lands. A CI merge-conflict repair still rebases and force-pushes under either
# strategy.
rebase:
  strategy: merge

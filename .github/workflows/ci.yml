# The same gates .no-mistakes.yaml runs as test and lint, on GitHub's runner.
# Firstmate is never installed here: the adapter tests use temp-dir fixtures,
# and anything that needs a real Firstmate clone runs outside CI.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history: catalog-progress.sh checks the commits the catalog
      # expansions record cites, and its test fails if they were skipped.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # oxlint loads the vendored anti-slop plugin as TypeScript, which needs
      # a Node that strips types natively; the runner's default may not.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # The baseline may only shrink relative to main; fetch-depth 0 above is what gives it a merge base.
      - run: bun run lint:growth
      - run: bun run fmt:check
      - run: bun test
      - run: bun run validate
      - run: bun run build
      # The publish job refuses the same thing after merge; this refuses it while the PR can still change.
      - name: Refuse a bundle change without a version bump
        run: tools/publish/version-gate.sh dist

name: publish-bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-bundle
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run ak validate
      - run: bun run ak build
      - run: bun run ak build --check
      - run: tools/publish/version-gate.sh dist
      - run: tar -czf published-bundle.tar.gz dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-bundle
          path: published-bundle.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-bundle
      - run: tar -xzf published-bundle.tar.gz
      - name: Publish generated bundles to the published branch
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d)"
          trap 'git worktree remove --force "$release_dir" 2>/dev/null || true' EXIT
          if git rev-parse --verify -q refs/remotes/origin/published >/dev/null; then
            git worktree add -B published "$release_dir" origin/published
          else
            git worktree add --detach "$release_dir"
            git -C "$release_dir" checkout --orphan published
          fi
          git -C "$release_dir" rm -rf . >/dev/null || true
          git -C "$release_dir" clean -fdx >/dev/null
          cp -R dist "$release_dir/dist"
          mkdir -p "$release_dir/.agents/plugins"
          cat > "$release_dir/.agents/plugins/marketplace.json" <<'JSON'
          {
            "name": "agent-kit",
            "interface": { "displayName": "agent-kit" },
            "plugins": [
              {
                "name": "ak",
                "source": { "source": "local", "path": "./dist/codex" },
                "policy": { "installation": "AVAILABLE", "authentication": "ON_INSTALL" },
                "category": "Coding"
              }
            ]
          }
          JSON
          git -C "$release_dir" add -A
          if ! git -C "$release_dir" diff --cached --quiet; then
            git -C "$release_dir" -c user.name=github-actions -c user.email=github-actions[bot]@users.noreply.github.com commit -m "Publish validated agent-kit bundles from $GITHUB_SHA"
            git -C "$release_dir" push origin published
          fi

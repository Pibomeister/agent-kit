  # =========================================================================

  - id: learning-evidence-gate
    capability: A deterministic gate on every judged learning job — cited ids must be ids the judge was shown, counts, statuses, ids and rates are the runtime's, and a degenerate rewrite is rejected
    disposition: retained
    destination: protocols/evidence-gate
    locator: plan §8; plan §7.1
    origin: conversation
    acceptance_test: >-
      A judge output citing an id outside its input is rejected and recorded as rejected, and any
      count or status the judge sends is ignored in favour of the runtime's own.
    note: >-
      The reference implementation is the maintainer's learning-stack zip; the layering is the
      WikiSkill summary's. The gate catches invented ids, not misattributed ones, and says so.

  - id: learning-pattern-maintainer
    capability: The judge that classifies new review events into recurring review patterns and drafts a guardrail line for each
    disposition: retained
    destination: roles/learn/pattern-maintainer
    locator: plan §8
    origin: conversation
    acceptance_test: >-
      Given events and the current pattern index, the role returns matches and prose only; a
      pattern reaches guardrail status by the runtime's count, never by the role's say-so.
    note: >-
      From the learning-stack zip's review loop and the WikiSkill summary's wiki layer. No donor
      has a judge prompt for this.

  - id: learning-reflector
    capability: The judge that rewrites a repository's working memory from observations after the ledger's watermark
    disposition: retained
    destination: roles/learn/reflector
    locator: plan §8
    origin: conversation
    acceptance_test: >-
      A reflection citing an observation id it was not shown is rejected and the previous memory
      stays in place.
    note: >-
      From the learning-stack zip's memory loop. claude-mem supplies the observations through
      adapters/observation-source; it has no reflection step of this shape.

  - id: learning-offline-worker-capture
    capability: Read public Codex, Grok and Kimi session records offline and fold linked-worktree sessions into the registered repository's memory by the placement rule in the contract's section 3
    disposition: retained
    destination: adapters/observation-source
    locator: plan §8
    origin: conversation
    acceptance_test: >-
      Captured fixtures for all three hosts become evidence-gated observations under one registered
      root; a cwd reaches that root by path prefix, by the recorded worktrees.json mapping or by
      the linked worktree's .git pointer, while a cwd none of these places is not captured there.
    note: >-
      The learning design requires an observation-source boundary but did not require every worker
      host to be observed. This binding adds only formats evidenced by local host records and leaves
      a host out when no usable public record exists.


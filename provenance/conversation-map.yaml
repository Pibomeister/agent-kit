# provenance/conversation-map.yaml — the source map.
#
# Every capability named in the two design sources, mapped to exactly one disposition.
# This file is the proof that nothing was silently dropped and nothing was silently
# invented. `ak validate` reads it: every non-null `destination` must be a live
# `catalog.yaml` entry, and every `G:L` locator must resolve inside
# `research/sources/grok-transcript.md` (2265 lines). That is the count the range
# check resolves against, and the count the lock records. `wc -l` reports 2264 --
# it counts newlines and this file ends without one -- so a locator derived from
# the `wc -l` figure rejects a valid `G:L2265`. Do not re-derive this with `wc -l`.
#
# Sources
#   G:L<start>-<end>   research/sources/grok-transcript.md — the design brief
#   plan §N            research/sources/engineering-skills-repo-plan.md — the governing design
#   arch §N            the same file. `plan` and `arch` are two spellings of one document;
#                      the `-repo-plan` suffix in its name is why both grew. ADR-0001 cites
#                      it as `arch §8`. The implementation plan is a third document, is not
#                      in this tree, and `plan §N` does not mean it.
#   Precedence: plan > later transcript turns > earlier transcript turns (AGENTS.md).
#
# Dispositions
#   retained   Kept as its own catalog entry — a skill, pack, protocol or reference that a
#              caller can reach by name.
#   folded     The behavior survives, but inside something else: a protocol, a reference, a
#              role prompt or an entrypoint of a super skill. Never a new slash command.
#              Re-exposing a folded capability as its own command is a design change.
#   reference  Kept as on-demand reading material under `references/`, loaded by named
#              skills and never invocable.
#   optional   Recognized by the design, deliberately outside the engineering catalog —
#              carried as an adapter or an opt-in profile rather than a skill.
#   excluded   Named in a source and deliberately not built. Destination is null.
#
# The `excluded` rows are load-bearing. They are selections the transcript and plan §2.6 make
# on purpose — the shape of the package is as much about what is absent as what is present.
# An `excluded` row is not a gap, not a backlog item and not missing coverage; re-adding one is
# a design change that has to argue with the row, not a fix that closes a hole.
#
# Field notes
#   locator         Where the capability is *specified* -- a transcript range, a plan section, a
#                   seat pair, or several. Never where its text came from: no row in this file
#                   carries a donor path, and `origin: donor` constrains the adaptations row
#                   rather than this field. The two answer different questions and neither
#                   substitutes.
#   origin          donor        = at least one pinned donor in provenance/upstream.lock.yaml
#                                 implements this; the adapted file's row lives in
#                                 provenance/adaptations.d/.
#                   conversation = no pinned donor implements it. The capability is original to
#                                 the transcript or to the plan and carries a locator instead of
#                                 a source path. Never fabricate a donor path (plan §1.4).
#                   Where a dossier distinguished "plan §8"-original from transcript-original,
#                   both fold into `conversation` and the `note` preserves which one it was.
#                   amalgam      = neither. The capability exists only because two donor-derived
#                                 seats were placed in the same catalog: a boundary no donor
#                                 could state, because neither knows the other exists, and the
#                                 transcript never specified, because it never enumerated seat
#                                 pairs this finely. AGENTS.md opens by saying this repository
#                                 *amalgamates* its donors; this is the origin that verb makes.
#                                 Locator is `amalgam <destination> + <destination>`, naming both
#                                 seats. Not a general "authored here" bucket -- see below.
#   Why `amalgam` is narrow, since the temptation is to widen it. Its endpoints are what make it
#   a locator rather than a shrug: both seats are declared, so the reference dangles the moment
#   either is renamed or dropped, which is more than `G:L` can say for itself. A general
#   "designed here" value would have no such anchor, and would become the place rows go when
#   nobody can say where a capability came from. A capability grounded in nothing is not a
#   spelling problem; it is an open question about why it is in the package, and it belongs in
#   CONTRACT-DEFECTS.md rather than in a locator column. `locator: null` is not a resting state.
#   acceptance_test The concrete behavior that proves the capability landed. Numbered release
#                   scenarios refer to plan §10's list of 29.
#   note            Present only where a reader would otherwise draw the wrong conclusion.

schema_version: 1

# `locator` cites where a capability was specified, never where its text was adapted from;
# the donor path lives in provenance/adaptations.d/. See the locator field note above.
capabilities:

  # =========================================================================
  # The seven super skills (plan §2.1; G:L1680-1766)
  # =========================================================================

  - id: super-align
    capability: Grill the request to an approved direction, establish shared vocabulary, hard-gate implementation behind human approval
    disposition: retained
    destination: skills/super-align
    locator: G:L1684-1693; G:L1548-1553; plan §2.1
    origin: donor
    acceptance_test: >-
      Invoked on an unapproved request, no implementation file is written; the run ends at an
      approved direction or an explicit unresolved decision. An unresolved fork leaves as a
      decision ticket that no implementer may execute (release scenario 11).

  - id: super-align-decision-ticket-threshold
    capability: Where an unresolved alignment fork stops — a same-session escalation or one decision ticket, never an unrequested multi-ticket map
    disposition: retained
    destination: skills/super-align
    locator: G:L1692-1692; plan §2.3
    origin: conversation
    acceptance_test: >-
      An unresolved fork produces at most one decision ticket handed to the human; starting an
      actual wayfind map is a separate human-initiated invocation, never a side effect of align.
    note: >-
      The transcript says unresolved forks become decision tickets but never says who builds the
      map; the plan states no threshold. The dossier records the boundary as conversation-origin
      so that a U skill never starts another U skill through the back door.

  - id: super-bound
    capability: Spec, tracer-bullet ticket DAG with exclusive file ownership, constraints file, acceptance criteria and named verification commands
    disposition: retained
    destination: skills/super-bound
    locator: G:L1696-1706; G:L1554-1556; plan §2.1
    origin: donor
    acceptance_test: >-
      Emits a spec plus a ticket DAG whose implementation tickets are zero-context and
      exclusive-file; anything that is still a product fork stays typed `decision` and cannot be
      dispatched to an implementer (release scenario 11).

  - id: super-scout
    capability: Bounded read-only repository exploration returning a revision-bound evidence dossier, never an architectural verdict
    disposition: retained
    destination: skills/super-scout
    locator: G:L1708-1710; G:L1288-1299; plan §2.1
    origin: donor
    acceptance_test: >-
      Returns file:line hits marked confirmed versus assumed, files not to touch, and an explicit
      coverage limitation when an index or graph is stale (release scenario 14). Cannot edit and
      cannot conclude.

  - id: super-build
    capability: Execute one approved ticket under TDD in an owned worktree, with separate spec and standards review passes
    disposition: retained
    destination: skills/super-build
    locator: G:L1712-1735; plan §2.1
    origin: donor
    acceptance_test: >-
      The implementer's own report never closes the ticket; a failed reviewer lane blocks
      completion and cannot be converted into approval by the implementer (release scenario 4).

  - id: super-verify
    capability: Verification distinct from review — an acceptance-to-evidence matrix with command, exit status, revision and environment identity
    disposition: retained
    destination: skills/super-verify
    locator: G:L1737-1743; G:L1511-1511; plan §2.1
    origin: donor
    acceptance_test: >-
      A criterion with no receipt is reported as not-run rather than passed; a later code change
      invalidates the older green receipts bound to the previous revision (release scenario 10).

  - id: verifier-seat
    capability: An independent runtime verifier seat that returns receipts and a criterion matrix without implementing or approving
    disposition: retained
    destination: roles/verifier
    locator: G:L1737-1743; plan §5.6; plan §7.3
    origin: conversation
    acceptance_test: >-
      A seat sharing the implementer's lineage is unavailable, while an independently assigned seat
      returns only revision-bound receipts, the matrix and any successful host-neutral recipe.

  - id: verification-evidence-reference
    capability: Shared recipe, surface-evidence and verifier-lineage vocabulary across lifecycle phases
    disposition: reference
    destination: references/verification-evidence
    locator: G:L1737-1743; plan §5.6; plan §8
    origin: conversation
    acceptance_test: >-
      Every loading skill uses one evidence-kind vocabulary, and no phase invents a browser, running
      service, trace collector or host-specific recipe path when the project declares none.

  - id: verify
    capability: >-
      Human-started running-application verification that replays a project-declared recipe,
      publishes criterion receipts and records the verify gate only for complete runtime evidence
    disposition: retained
    destination: skills/verify
    locator: G:L1737-1743; plan §5.6; plan §8
    origin: conversation
    acceptance_test: >-
      An explicit `/ak:verify` run builds, launches and drives only declared facilities, leaves a
      criterion uncovered when a required kind is unavailable, and publishes its successful recipe
      through the knowledgebase rather than a host-specific project path.
    note: >-
      The public entrypoint and host-neutral recipe are commissioned adaptations beyond the original
      super-verify phase. Exact behavior and documentation sources are anchored in
      research/sources/verifier-seat-design-report.md and attributed per file in
      provenance/adaptations.d/verify.yaml.

  - id: visual-edit
    capability: >-
      Human-started visual editing of named routes from a running local app as URL-backed frames,
      with pending revisions applied through source and retained as verification receipts
    disposition: retained
    destination: skills/visual-edit
    locator: plan §2.3
    origin: donor
    acceptance_test: >-
      An explicit `/ak:visual-edit` run verifies the local connection, requested route frames and
      source-backed code view before handoff; a compiled-route edit stays pending until the coding
      agent changes source, confirms the dev server and acknowledges the exact revision.
    note: >-
      The plan section supplies the standalone category this skill is placed in; it does not name
      visual-edit. The capability is a commissioned adaptation beyond the plan's list, grounded at
      the pinned donor and attributed per adapted file in
      provenance/adaptations.d/visual-edit.yaml.

  - id: super-review
    capability: A first-pass specialist panel over an immutable snapshot, a narrow delta pass over a fix, and reviewers who cannot edit
    disposition: retained
    destination: skills/super-review
    locator: G:L1745-1757; G:L1872-1918; plan §2.1
    origin: donor
    acceptance_test: >-
      A documentation typo does not spawn the full panel (release scenario 1); a one-line fix
      gets the delta entrypoint, not a repeat full panel (release scenario 7).

  - id: code-review-persona-panel
    capability: The CE specialist catalog as pass-1 discovery machinery — always-on, standards-gated, generic-conditional, conditional and stack-conditional seats selected from the diff
    disposition: retained
    destination: skills/super-review
    locator: G:L1872-1895; G:L1897-1903
    origin: donor
    acceptance_test: >-
      Panel composition is derived from the artifact, so a small low-risk diff seats fewer
      specialists while an auth or tenancy change seats security and adversarial regardless of
      classifier confidence (release scenarios 1 and 3).
    note: >-
      The panel is a capability of `super-review`; the individual seats live in `roles/code-review/*`
      as role prompts. See the `ce-personas-as-invocable-skills` exclusion below for what this
      deliberately is not.

  - id: super-ship
    capability: Release checks, sensitive-data scan, constraint checks and PR preparation, with the linked knowledgebase change
    disposition: retained
    destination: skills/super-ship
    locator: G:L1759-1766; plan §2.1
    origin: donor
    acceptance_test: >-
      An approved public-API ticket reaches an open PR and stops; merge and deploy remain separate
      capabilities that ship never performs (release scenario 5).

  # =========================================================================
  # Supervisor (plan §2.2; G:L2040-2251)
  # =========================================================================

  - id: autopilot
    capability: A human-started supervisor pair exercising explicitly delegated checkpoint authority over the same lifecycle skills
    disposition: retained
    destination: skills/autopilot
    locator: G:L2050-2077; G:L2079-2119; G:L2121-2155; plan §2.2
    origin: donor
    acceptance_test: >-
      Supervisors never implement, and supervisor disagreement produces one escalation rather than
      further internal debate (release scenarios 16 and 17). Default end state is an open PR, never
      a merge.

  - id: autopilot-escalation-contract
    capability: A single structured escalation message — need, options, what was already ruled out, default, which charter rule triggered, what is blocked
    disposition: retained
    destination: skills/autopilot
    locator: G:L2174-2191
    origin: donor
    acceptance_test: >-
      An escalation is one message with the six named fields; until it is answered no new tickets
      start, nothing ships, and only read-only phases continue.

  - id: autopilot-caps
    capability: Per-run caps — wall clock, budget, maximum alignment turns, maximum tickets, two fix cycles, three CI-repair loops, no new dependencies
    disposition: retained
    destination: policies/limits
    locator: G:L2193-2206; G:L1916-1916
    origin: donor
    acceptance_test: >-
      The third fix cycle on the same finding stops rather than continuing (release scenario 18);
      an unanswered escalation past the cap ends the run at CAP with nothing merged.
    note: >-
      Budget figures themselves come from the runner; the catalog enforces only the cap it was
      handed. The transcript's per-run cost and token ceilings are not reproduced here.

  - id: decision-card
    capability: The decision card — a bounded question with options, evidence, two independent supervisor answers, a mechanical authority check and a recorded ruling
    disposition: retained
    destination: schemas/decision
    locator: G:L2159-2173
    origin: conversation
    acceptance_test: >-
      A card outside the charter escalates regardless of supervisor agreement; agreement plus
      present evidence plus charter permission is required to act, and every outcome is ledgered
      (release scenario 16).
    note: >-
      No donor has a typed decision-card artifact. The authority check is deterministic gate logic,
      never a third judgment — there is no tie-breaking supervisor.

  - id: supervisor-seat-independence
    capability: Two supervisor seats, declared independent, answering the same card without a shared scratchpad
    disposition: retained
    destination: roles/supervisor
    locator: G:L2159-2173; G:L2072-2074
    origin: conversation
    acceptance_test: >-
      A missing supervisor output blocks the checkpoint; the implementer is never seated to fill it
      (release scenario 17).
    note: >-
      The transcript expresses independence as a cross-family model pairing. Independence is
      re-expressed here as a runner-enforced constraint on who may fill a seat, with no reference
      to which system fills it.

  - id: immutable-charter
    capability: An authority charter fixed by hash outside worker-writable scope, enumerating what the pair may decide and what it must escalate
    disposition: retained
    destination: schemas/charter
    locator: G:L2079-2119; plan §7.2
    origin: conversation
    acceptance_test: >-
      A run cannot edit its own charter; an action outside the charter's granted set blocks the
      checkpoint even when both seats agree.
    note: >-
      The hash mechanism has a donor analogue that pins a stage-profile selection, not a full
      authority charter with granted and denied capability lists. Field content is plan-original.

  - id: guided-checkpoint-mode
    capability: An explicit named fallback state — full decision-card protocol in force, but each checkpoint proposed to the human because no adapter can yet validate a grant
    disposition: retained
    destination: skills/autopilot
    locator: plan §9 (Milestone 7)
    origin: conversation
    acceptance_test: >-
      With no runner adapter present, autopilot proposes each checkpoint resolution and asks for
      confirmation rather than claiming to have enforced a grant it cannot verify.
    note: >-
      Deliberately carries no G:L locator. Both donor autopilots claim to enforce their own state
      machines end to end; neither has a concept of "I would act here but cannot prove I am
      authorized." This is the plan's own dry-run/checkpoint-observation mode, not a donor import.

  - id: runner-validated-grant
    capability: A delegated controller may start a phase operation only when a runner-validated grant covers it
    disposition: retained
    destination: adapters/runner-contract
    locator: G:L2050-2077; plan §7.1
    origin: conversation
    acceptance_test: >-
      A phase operation invoked with no validated grant stops for explicit invocation instead of
      reproducing a forbidden command's effect through a side door.
    note: >-
      Plan-original language resolving four transcript statements that contradict each other. No
      donor implements grant validation distinct from its own state-file writes.

  - id: idempotent-remote-effects
    capability: Idempotency keys plus remote read-back for branch creation, push, comments, thread resolution and PR creation
    disposition: retained
    destination: adapters/runner-contract
    locator: G:L2121-2155; plan §7.4
    origin: conversation
    acceptance_test: >-
      Restarting a run does not repeat a remote side effect, and a duplicate inbound event does not
      duplicate an action (release scenario 20).
    note: >-
      The nearest donor mechanism is a compare-before-write guard against concurrent local events —
      a single-writer race guard, not an idempotency key with remote read-back.

  # =========================================================================
  # Standalone supporting skills (plan §2.3; G:L1942-2028)
  # =========================================================================

  - id: compound
    capability: Capture one reusable lesson tied to a real failure, correction or surprising review result
    disposition: retained
    destination: skills/compound
    locator: G:L1950-1950; G:L1963-1963; G:L1766-1766; plan §2.3
    origin: donor
    acceptance_test: >-
      A successful routine run with no named failure emits no lesson (release scenario 23); the
      lesson is written centrally and creates no application-local documentation tree
      (release scenario 21).

  - id: compound-refresh
    capability: Keep, update, consolidate, replace or retire captured lessons rather than batching morals into one file
    disposition: retained
    destination: skills/compound-refresh
    locator: G:L1950-1950; plan §2.3
    origin: donor
    acceptance_test: >-
      A superseded lesson records its supersession and keeps its history; rolling back a skill
      bundle leaves the lesson corpus intact (release scenario 24).

  - id: lesson-supersession
    capability: Explicit supersedes / superseded_by links on a captured lesson
    disposition: retained
    destination: schemas/lesson
    locator: G:L1950-1950; plan §8
    origin: conversation
    acceptance_test: >-
      Replacing or consolidating a lesson leaves both the new and the superseded record readable,
      with the link between them (release scenario 24).
    note: No donor lesson schema names these fields; the need follows from the refresh verbs.

  - id: ideate
    capability: Generate options across frames, then critique them, with an adversarial cut before alignment
    disposition: retained
    destination: skills/ideate
    locator: G:L1951-1951; plan §2.3
    origin: donor
    acceptance_test: >-
      Produces a ranked option set and no commitment; a previously rejected option is not
      re-surfaced without new evidence (release scenario 12).

  - id: pov
    capability: A read-only project-grounded verdict with an evidence floor, optional independent opinions, and a first-class Hold
    disposition: retained
    destination: skills/pov
    locator: G:L1952-1952; G:L807-856; plan §2.3
    origin: donor
    acceptance_test: >-
      Fails the project floor and returns Hold with an inspection list rather than a graded verdict;
      the verdict never authorizes implementation, and re-running without changed evidence is
      refused (release scenario 12).

  - id: independent-reviewer-context
    capability: The model-agnostic replacement for the transcript's cross-family oracle — an attestable independence flag on a reviewing context, with freeze-before-expose, inform-don't-vote, and disclosed failures
    disposition: retained
    destination: policies/review
    locator: G:L874-881; plan §11
    origin: conversation
    acceptance_test: >-
      The host position is frozen before any peer sees it; peers inform and never vote; a failed
      peer is disclosed and does not block the solo judgment, and an unattested context does not
      count as independent corroboration (release scenario 4).
    note: >-
      A required translation, not an invention — the donor mechanism exists but is expressed
      entirely through vendor and family identity, which this catalog cannot carry. The resulting
      vocabulary has no donor source.

  - id: bakeoff
    capability: Build competing bounded experiments in separate workspaces against criteria fixed first, then pick with evidence
    disposition: retained
    destination: skills/bakeoff
    locator: G:L1953-1953; G:L832-832; plan §2.3
    origin: donor
    acceptance_test: >-
      Emits an evaluation artifact, not a production adoption; a settled selection is not re-run
      without new evidence (release scenario 12).

  - id: doc-review
    capability: A findings engine on requirements, plans, ADRs and context — a different persona catalog from code review, with meaning-changing forks escalated rather than settled
    disposition: retained
    destination: skills/doc-review
    locator: G:L1954-1954; G:L610-642; G:L660-684; plan §2.3
    origin: donor
    acceptance_test: >-
      A contradiction the document itself can settle is applied; a contradiction that would pick a
      side in a product fork is emitted as a Decision for a human and never auto-applied.

  - id: doc-review-persona-catalog
    capability: The separate document persona catalog — coherence and feasibility always on, product, design, security, scope and adversarial lenses conditional, with premise techniques suppressed on a validated plan
    disposition: retained
    destination: skills/doc-review
    locator: G:L629-644
    origin: donor
    acceptance_test: >-
      A plan with validated upstream provenance does not re-open "should we build this"; a
      requirements document runs the full premise kit.
    note: >-
      The seats live in `roles/doc-review/*`. Code-review personas are never reused on a document
      (G:L705).

  - id: doc-review-durable-disposition
    capability: Carrying a finding's disposition across sessions so a later, separate review run does not rediscover a settled item
    disposition: retained
    destination: skills/doc-review
    locator: G:L707-717; plan §8
    origin: conversation
    acceptance_test: >-
      A fresh invocation reconstructs prior dispositions from the recorded decisions rather than
      re-dispatching the panel on unchanged inputs.
    note: >-
      The donor's primer is explicitly session-scoped; the plan mandates central storage. Neither
      states how a later session reconstructs the primer. Recorded here as conversation-origin.

  - id: receiving-review
    capability: Assess and resolve existing human or bot PR feedback with evidence — apply, defer or skip per comment
    disposition: retained
    destination: skills/receiving-review
    locator: G:L1955-1955; G:L435-442; plan §2.3
    origin: donor
    acceptance_test: >-
      A PR comment instructing the agent to ignore policy grants no authority (release scenario 15);
      replying and resolving a thread require authorization, and an acknowledgement reaction is not
      a finding.

  - id: diagnose
    capability: Reproduce, minimize, hypothesize, instrument, fix and regression-test, with the hypothesis stated before the edit
    disposition: retained
    destination: skills/diagnose
    locator: G:L1956-1956; G:L1791-1791; G:L1558-1561; plan §2.3
    origin: donor
    acceptance_test: >-
      Emits either a verified bounded patch under grant or a diagnostic work packet, never both, so
      the same patch is not implemented twice; repeated failure triggers reconsideration rather
      than unlimited edits.
    note: >-
      The transcript lists diagnose both as a keeper and as a primitive; plan §2.3 lists it once.
      Both donor debugging skills fix in place; the split from build is a deliberate tightening.

  - id: improve-architecture
    capability: A periodic shallowness survey outside any feature loop, proposing one worthwhile deepening
    disposition: retained
    destination: skills/improve-architecture
    locator: G:L1957-1957; plan §2.3
    origin: donor
    acceptance_test: >-
      Produces one proposed deepening and a recorded decision; no unsolicited repository-wide
      rewrite follows from the same run.

  - id: improve-architecture-handoff
    capability: Where the chosen deepening stops — a recorded decision, with implementation as a separate human-started work source
    disposition: retained
    destination: skills/improve-architecture
    locator: G:L2006-2026
    origin: conversation
    acceptance_test: >-
      The run ends at a grilled, recorded shape; it does not start alignment, does not open tickets,

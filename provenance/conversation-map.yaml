  # =========================================================================
  # Boundaries the amalgamation created (origin: amalgam)
  # =========================================================================
  # Seat-pair boundaries that exist because this catalog seats two donors together. Filed by
  # batch2-reviewer against review-personas.yaml as three rows carrying `locator: null`; the
  # writer was right to refuse a fabricated locator and right that the fragment key they used
  # is dropped by the merge. The null was the symptom of a missing category, not a missing
  # value.

  - id: frontend-races-vs-design-lens-boundary
    capability: Which seat owns an in-flight-request concern — a race in a diff belongs to frontend-races, a missing decision in a document belongs to design-lens
    disposition: retained
    destination: roles/code-review/frontend-races
    locator: amalgam roles/code-review/frontend-races + roles/doc-review/design-lens
    origin: amalgam
    acceptance_test: >-
      Both ROLE.md bodies state the boundary in the same terms and each names the other seat, so
      a reader arriving at either one finds the rule without needing the other open.
    note: >-
      The near-miss is one sentence read twice. "The plan does not say what happens while the
      request is in flight" is a missing decision in a document; "the in-flight request has no
      cancellation" is a race in a diff. The two donors sit on different panels and neither
      names the other, so neither could have drawn this line.

  - id: design-lens-vs-frontend-races-boundary
    capability: The same boundary stated from the document-review side, so the rule is present on whichever seat the reader opened
    disposition: retained
    destination: roles/doc-review/design-lens
    locator: amalgam roles/doc-review/design-lens + roles/code-review/frontend-races
    origin: amalgam
    acceptance_test: >-
      Removing either body's statement of the boundary leaves the other intact and still correct;
      the pair is recorded twice on purpose, not duplicated by accident.
    note: >-
      Recorded on both paths because a reader arrives from whichever file they have open. Two
      rows rather than one for the same reason.

  - id: feasibility-vs-plan-review-architect-distinction
    capability: Feasibility and plan-review/architect are not a counterpart family — internal coherence against a frozen snapshot is a different question from external survivability against the codebase the document lands in
    disposition: retained
    destination: roles/doc-review/feasibility
    locator: amalgam roles/doc-review/feasibility + roles/plan-review/architect
    origin: amalgam
    acceptance_test: >-
      Neither seat's body defers to the other and neither is described as the other's document or
      code counterpart; the two are seated independently.
    note: >-
      Examined and resolved as not a counterpart family, which is why this row has no partner on
      the architect side: the finding is that the pairing does not exist. No donor states the
      distinction — the seats come from different donors and this package is the first artifact
      to seat them together.

  # =========================================================================
  # The learning stack (profile `learning`). Designed after the WikiSkill
  # summary's raw, wiki and policy layering (local source wikiskill-summary) and
  # the maintainer-supplied reference implementation described in
  # research/dossiers/learning.md. Neither is a pinned donor, so nothing below

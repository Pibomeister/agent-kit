# ---------------------------------------------------------------------------
# Local sources: third-party or design material held in-repo rather than at a
# donor pin. This block is the register that says what these files are, who owns
# them, and how they may be cited.
#
# Two fields of it are machine-read. `working_copy`, `sha256` and `lines` are
# recomputed on every run by provenance.local-source-modified; the rest of the
# block is documentation. That is a narrower claim than it sounds: the check
# verifies the file is the one the digest was taken against, and says nothing
# about whether any locator citing it points at the right part of it.
#
# DECISION (2026-09-19; exercised 2026-09-30): a local source is real
# provenance. Its `source:` spelling stayed reserved until a real row needed it;
# the delegation reports are the first exercised cases.
#
#   Why they are real provenance and not fabrications. A local source is
#   material this repository actually holds and actually distributes. The MIT
#   obligation that attaches to holding it is discharged here, in NOTICE, and in
#   provenance/licenses/ - `license`, `copyright` and `attribution_donor` below
#   are that discharge. That obligation is separate from an adaptations row,
#   which records a derivation rather than a holding: a file held but derived
#   from owes attribution and still carries no row.
#
#   Why the route stayed deferred. Cite the pin wherever the claim survives there. For
#   pocock-two-axis-backup, every claim batch 2 drew on survives at the pin
#   verbatim, so every one of them cites the pin. The per-entry `relation_to_pin`
#   below records the measured divergence and the two ways citing this copy by
#   its own line numbers goes wrong.
#
#   The implemented spelling:
#
#       local:<local_source_id>@sha256:<64-hex>[#L<start>-<end>]
#
#   It resolves an id through this block exactly as an adaptations row resolves a
#   donor id through `donors:`, so license and copyright keep one lookup rule. It
#   cannot be misparsed as a donor source: `parseDonorSource`
#   (src/validation/provenance.ts) forbids `:` in its first group, so the two
#   grammars are disjoint. `parseLocalAdaptationSource` resolves the local form;
#   a malformed value still fails loudly as `provenance.malformed-source`.
#
#   The digest is mandatory and a bare line number is forbidden. A G:L range into
#   the design transcript is safe because there is only one transcript; a line
#   range into a file that has a near-twin at a pin is safe only when it is
#   anchored to content. See `relation_to_pin.numbering`.
#
#   The implementation verifies that the row digest, this block's digest and
#   sha256(working_copy) agree and that any line range is in bounds. The check
#   needs no clone and runs unconditionally, unlike donor-path-at-pin. The
#   generated adaptations header names both accepted forms.
#
# AUTHORING.md's "Provenance law" section carries the operative rule for writers;
# this block carries the evidence, so that neither has to be re-derived. The
# section is named rather than numbered because a number binds a position and
# renumbering would silently repoint this.
# ---------------------------------------------------------------------------
local_sources:
  - id: pocock-two-axis-backup
    description: Original Pocock Standards/Spec two-axis code-review SKILL.md, preserved before OMX overwrote the local copy.
    original_path: ~/.omx/backups/setup/2026-07-15T23-45-31.075Z/.codex/skills/code-review/SKILL.md
    working_copy: research/sources/pocock-code-review-two-axis.SKILL.md
    sha256: 6a65cc61114f96db07ec41e3920e67c9c5bf70dd6e0901eb9460ebcb2bdc209f
    lines: 89
    license: MIT
    copyright: "Copyright (c) 2026 Matt Pocock"
    # The pinned donor whose license and copyright govern this file. Absence of
    # this field means no upstream author, which is the `conversation` entry.
    attribution_donor: pocock
    # No adaptations row cites this file. See `relation_to_pin.guidance`.
    cited_in_adaptations: false
    relation_to_pin:
      donor_path: skills/engineering/code-review/SKILL.md
      donor_sha256: 47f4e52c21694def9c7c11cbfbf891ca35eac7a93e395797515be3c8a409ae50
      identical: false
      evidence: >-
        A sibling revision of the same work, not the bytes at the pin: 87 lines there, 89 here,
        58 lines differing. That last figure is literally true and substantively misleading -
        nearly all of it is typography, a colon restyled to an em dash and changed quote glyphs.
        Normalised for punctuation, the substance differs in exactly three places: this copy
        writes "PRD/spec" where the pin writes "spec" (here L3, L9, L31); it carries a sub-agent
        dispatch sentence at L60 that the pin does not have; and it words the issue-tracker
        instruction differently. The twelve-item Fowler smell baseline, both rules binding it,
        both sub-agent briefs, the aggregation rules and the "why two axes" rationale are
        word-identical.
      numbering: >-
        Line numbers here do not correspond to the pin's, and the offset is not constant: the
        extra line at L60 shifts the tail, and six further tail lines differ on their own account.
        Two ranges first cited by this file's numbering land, at the pin's same numbers, on real
        text saying something else. L78 here is the no-merge-no-rerank rule, while L78 at the pin
        is the one-line-summary rule; L86-87 here are the two divergence examples, while L86-87 at
        the pin are the conclusion drawn from them. Both resolve. Both would have been wrong.
        Re-read at the pin; never renumber by arithmetic.
      guidance: >-
        Cite the pin wherever the claim survives there, which for this file is nearly everywhere.
        Where a claim does not survive, prefer the pin's wording on its merits anyway: it is the
        later revision, and "spec" is this catalog's own vocabulary where this copy says "PRD".
        Only a body that must adapt wording existing solely here would need the reserved `local:`
        spelling, and that need is the trigger described above.
  - id: conversation
    description: Design transcript (Grok) that specified the catalog. Cited as G:L<start>-<end>.
    working_copy: research/sources/grok-transcript.md
    # `sha256` and `lines` are the anchor, and the anchor is what makes a line
    # number evidence. A G:L range is a position, and a position means nothing
    # without the content it was taken against: insert a paragraph at line 400
    # and every later range still parses, still passes its bounds check, and now
    # points at the wrong text. Before these two fields the check answered the
    # same way whether the locators were right or wrong, so it was not evidence.
    #
    # The cost is deliberate and was ruled on. Any edit to this file -- including
    # a typo fix -- fails validation until the locators that cite it are
    # re-derived. That is expensive and it is the point: the same edit without
    # the anchor costs exactly as much work and nobody learns they owe it. These
    # are vendored research inputs with no editing workflow to preserve.
    sha256: b2b20986e23b69aaa66f43c3fc45a969c913b674c4c4353411ed8fa6e8a2f408
    # 2265, not the 2264 `wc -l` reports. This file does not end in a newline, so
    # `wc -l` -- which counts newlines -- misses the last line. The range checker
    # counts lines, and a G:L citing 2265 resolves there, so a register saying
    # 2264 would contradict the bounds check it exists to underwrite. The first
    # run of this check caught exactly that, because the figure was derived with
    # `wc -l` by the person writing the check.
    lines: 2265
  - id: plan
    description: >-
      The governing design document: phases, batches, gates and the 29 release

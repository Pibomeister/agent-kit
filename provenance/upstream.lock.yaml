      spellings of this one file, and the file's name is the trap. The
      `-repo-plan` suffix is why a second spelling grew: ADR-0001 gives this
      path as its authority "§1.2, §8", then calls those same sections "the
      architecture doc" and cites "arch §8". There is no separate architecture
      document to hold. The *implementation* plan is a third document, is not in
      this tree, and `plan §N` never means it.
    working_copy: research/sources/engineering-skills-repo-plan.md
    # Anchored for the same reason as the transcript, against a weaker failure
    # mode. A `plan §N` reference resolves against a heading rather than a line,
    # so renumbering breaks it loudly where a mid-file insertion would not. What
    # the digest adds is the case renumbering does not cover: §7's *body* being
    # rewritten under a heading that still reads `## 7.`, which every reference
    # to it survives while meaning something else.
    sha256: 85d4065b464c876dc3e9c5f1c087b15b7b7729c49984129693f281d53cc493a3
    lines: 696

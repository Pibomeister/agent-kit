# Provenance fragment for the "review-ship" batch: five skill bodies with their
# manifests, and three skill-local reference files.
#
# One row per (path, source) pair, keyed `path:` with a single `source:`, which is what
# loadAdaptationFragments reads (src/validation/provenance.ts). A file adapted from
# several donor files carries one row per donor file, so every upstream work a file
# derives from is recorded with a machine-checkable donor@commit:path.
#
# Both the body and its manifest carry rows, per AUTHORING.md's provenance law: a
# skill.yaml is an adapted file in its own right, because its triggers, non-triggers,
# hard gates and limits are condensations of the same donor text the body adapts.
#
# Every path below is quoted from the per-item "Donor sources and mechanisms to import"
# subsection of research/dossiers/review-ship.md; none was re-derived or guessed. Donor
# ids and commits are those pinned in provenance/upstream.lock.yaml.
#
# `skills/ultraqa` also carries a conversation locator in its manifest for the one rule
# no donor states -- that a mutation invalidates the affected review evidence (dossier
# §5.2, gap G1). That is a manifest field, not a row here: this file records adapted
# files against donor sources, and a rule with no donor has no source to record.
#
# provenance/adaptations.yaml is generated from this directory by `ak build` and is not
# written here.

adaptations:
  - path: skills/super-review/SKILL.md
    source: local:verifier-seat-design-report@sha256:19f676e5ce53035aaa7c25653d743119aacfa5c15879421021b63100e9110dea#L550-558
    rationale: Readiness consumes seat and surface coverage without manufacturing missing verification evidence.
  - path: skills/super-review/skill.yaml
    source: local:verifier-seat-design-report@sha256:19f676e5ce53035aaa7c25653d743119aacfa5c15879421021b63100e9110dea#L550-558
    rationale: The readiness contract mirrors verifier-lineage and evidence-kind inputs.
  - path: skills/super-ship/SKILL.md
    source: local:verifier-seat-design-report@sha256:19f676e5ce53035aaa7c25653d743119aacfa5c15879421021b63100e9110dea#L559-568
    rationale: Ship checks criterion, seat and evidence-kind coverage before preflight and links the recipe, matrix and evidence digests.
  - path: skills/super-ship/skill.yaml
    source: local:verifier-seat-design-report@sha256:19f676e5ce53035aaa7c25653d743119aacfa5c15879421021b63100e9110dea#L559-568
    rationale: The ship contract mirrors the stronger input predicate and pull-request payload.
  # ---- skills/super-review ----
  - path: skills/super-review/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-code-review/SKILL.md
    rationale: >-
      The donor's pre-PR discovery pass is the shape of pass 1: an immutable snapshot, a panel of
      seats over it, and a synthesis that does not re-judge what a seat returned. Reviewers cannot
      edit is kept as a boundary rather than a convention.
  - path: skills/super-review/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-code-review/references/select-and-route.md
    rationale: >-
      The donor's routing by evidence rather than by a fixed roster becomes panel composition from
      declared risk, so a typo does not convene the full catalog and a substantive change does not
      get a truncated one.
  - path: skills/super-review/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-code-review/references/dispatch-reviewers.md
    rationale: >-
      The donor's per-seat dispatch contract becomes the one-packet-per-seat rule and the list of
      what a seat never receives: the implementer's narrative, another seat's findings, and any
      approval context produced by the author lane.
  - path: skills/super-review/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-code-review/references/finish-review.md
    rationale: >-
      The donor's close-out step becomes the verdict and the lane-result vocabulary, with the
      addition that an unavailable required lane blocks approval instead of being reported as an
      empty one.
  - path: skills/super-review/skill.yaml
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-code-review/SKILL.md
    rationale: >-
      The declaration's triggers, non-triggers and hard gates condense the same donor text the body
      adapts, expressed as the machine-checkable contract rather than as prose.
  - path: skills/super-review/skill.yaml
    source: omx@cb955b0d5becbef76d2c1f0096b6e1f238e1e7f7:skills/code-review/SKILL.md
    rationale: >-
      The donor's two-lane fail-closed review supplies the delta entrypoint's lane pair and the rule
      that a dirty review may bounce back to planning rather than looping on the last patch.
  - path: skills/super-review/skill.yaml
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:skills/engineering/code-review/SKILL.md
    rationale: >-
      The donor's two-axis separation of specification compliance from standards compliance is the
      basis of the delta pass's two lanes and of the standards seat's cite-a-rule-or-return-empty
      output contract.
  - path: skills/super-review/references/panel.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-code-review/references/select-and-route.md
    rationale: >-
      The donor's activation signals are the seat table's activation column, restated against this
      catalog's own pack vocabulary rather than the donor's.
  - path: skills/super-review/references/panel.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-code-review/references/dispatch-reviewers.md
    rationale: >-
      The donor's dispatch contract is the receives/never-receives section, and its per-seat
      isolation requirement is the reason an unfillable seat is unavailable rather than filled from
      the author lane.
  - path: skills/super-review/references/panel.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-code-review/references/action-class-rubric.md
    rationale: >-
      The donor's action classes supply the rule that an inbound safe-auto from a peer lane is
      remapped and kept, and that no code-review seat emits safe-auto itself.
  - path: skills/super-review/references/panel.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-code-review/references/depth-paths.md
    rationale: >-
      The donor's depth paths become the evidence anchoring rules: quote the motivating line to
      anchor high, anchor lower rather than fabricating an excerpt, and treat an empty search as
      evidence about the search.
  - path: skills/super-review/references/delta.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-code-review/references/finish-review.md
    rationale: >-
      The donor's close-out and re-review handling becomes the delta packet, the continuity rule and
      the closure rule that a finding does not close on the implementer's word.
  - path: skills/super-review/references/delta.md
    source: omx@cb955b0d5becbef76d2c1f0096b6e1f238e1e7f7:skills/code-review/SKILL.md
    rationale: >-
      The donor's two-lane pass over a fix is the delta's lane pair, and its bounce-to-planning
      outcome is the baseline reset that a third loop is not allowed to impersonate.


# Provenance fragment for the "define" batch: four skill bodies with their manifests,
# and two reference packs.
#
# One row per (path, source) pair, keyed `path:` with a single `source:`, which is what
# loadAdaptationFragments reads (src/validation/provenance.ts). A file adapted from
# several donor files carries one row per donor file, so every upstream work a file
# derives from is recorded with a machine-checkable donor@commit:path. That is what
# NOTICE points a downstream consumer at, so an unverifiable row here would turn a
# provenance record into a provenance claim.
#
# Both the body and its manifest carry rows. AUTHORING.md's provenance law records a row
# per *adapted file*, and a skill.yaml is one: its triggers, non-triggers, hard gates and
# limits are condensations of the same donor text the body adapts, not metadata about it.
# The body row says what the prose took; the manifest row says what the declaration took.
#
# One fragment owns each adapted path: a second fragment claiming any path below is a
# merge hazard and raises provenance.conflicting-adaptation.
#
# Donor ids and commits are those pinned in provenance/upstream.lock.yaml. Every path
# below is quoted from the per-item "Sources" subsection of research/dossiers/define.md;
# none was re-derived or guessed. That dossier is referred to by section name rather than
# by number, because a number here and the heading it points at move in different commits.
#
# provenance/adaptations.yaml is generated from this directory by `ak build` and is not
# written here.

adaptations:
  - path: skills/super-align/SKILL.md
    source: local:verifier-seat-design-report@sha256:19f676e5ce53035aaa7c25653d743119aacfa5c15879421021b63100e9110dea#L446-455
    rationale: Product success names an observable surface and declared evidence kind without naming a tool.
  - path: skills/super-align/skill.yaml

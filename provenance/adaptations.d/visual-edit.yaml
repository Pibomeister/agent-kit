    source: builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md
    rationale: >-
      The running-route source of truth, URL-backed frame model, pending revision handshake,
      compiled-route agent path and readiness checks are adapted from pinned passages
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L13-L19`,
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L151-L175`,
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L202-L213`,
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L261-L336`,
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L359-L409`,
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L491-L523`
      and
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L532-L608`.
      Agent-kit adds slash-only authority, named prerequisite stops, the super-build boundary and a
      verification receipt for super-verify. The editor-host passage is deliberately generalized:
      a self-hosted editor URL is first class and the donor's hosted URL is one convenience value,
      because the donor's editor is itself open source and runs locally: `templates/design` in
      https://github.com/BuilderIO/agent-native (MIT). The account gates only save and share, as
      pinned passages
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L77-L78`
      and
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L161-L165`
      keep the signed-out session working.

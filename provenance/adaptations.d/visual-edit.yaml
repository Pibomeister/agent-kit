    rationale: >-
      The execution contract mirrors the source-of-truth, bridge, URL-frame, pending revision,
      compiled-route and verification behavior from pinned passages
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L13-L19`,
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L151-L175`,
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L261-L336`,
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L359-L409`,
      `builderio-skills@eb07be67e6d924b958445f706f5ac386243df6b4:skills/visual-edit/SKILL.md#L491-L523`

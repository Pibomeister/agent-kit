# Provenance fragment for super-ship's direct transport: the skill-local reference
# skills/super-ship/references/transport-direct.md.
#
# One row per (path, source) pair, keyed `path:` with a single `source:`, which is what
# loadAdaptationFragments reads (src/validation/provenance.ts). One fragment owns each adapted path.
#
# Donor ids and commits are those pinned in provenance/upstream.lock.yaml. Every source path below
# was verified to exist at its pin with `git cat-file -e` in the pinned clone before it was written
# here. What no donor states -- how the transport is chosen, the comparison of the commit with what
# was staged that makes a hook-rewritten commit a new head, and the push reconcile -- is ruling
# direct-push-as-ship-transport in policies/resolved-conflicts.yaml, not a row here.

adaptations:

  - path: skills/super-ship/references/transport-direct.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-commit-push-pr/references/context.md
    rationale: >-
      The open-pull-request lookup is adapted: the branch name only, because `--head
      <owner>:<branch>` silently returns an empty list; the base repository targeted on a fork; a
      detached head never looked up, because an empty `--head` drops the filter; rows matched on head
      owner and branch, with an ambiguous match stopping rather than taking the first. The donor's
      fallback to a guessed default branch is not carried: an unresolved base stops the run.
  - path: skills/super-ship/references/transport-direct.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-commit-push-pr/references/commit-and-push.md
    rationale: >-
      The commit names its paths after `--` so anything else already in the index stays out, and the
      branch is re-read immediately before the push. The donor's automatic branch creation and its
      grouping into several commits are not carried: a detached head or the base branch stops the run
      with needs-input.
  - path: skills/super-ship/references/transport-direct.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-commit-push-pr/references/apply-and-handoff.md
    rationale: >-
      The lookup is repeated immediately before the create so a pull request that appeared since is
      not duplicated, and the body goes through `--body-file` because a body on standard input can
      arrive empty while `gh` exits 0. The donor's description preview, explainer archival and
      watcher handoff are not carried; the handoff is super-ship's watch-lane step.

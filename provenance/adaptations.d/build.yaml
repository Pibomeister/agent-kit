# Provenance fragment for the "build" batch: four skill bodies with their manifests —
# super-scout, super-build, super-verify and diagnose.
#
# One row per (path, source) pair, keyed `path:` with a single `source:`, which is what
# loadAdaptationFragments reads (src/validation/provenance.ts). A file adapted from
# several donor files carries one row per donor file, so every upstream work a file
# derives from is recorded with a machine-checkable donor@commit:path. That is what
# NOTICE points a downstream consumer at, so an unverifiable row here would turn a
# provenance record into a provenance claim.
#
# Both the body and its manifest carry rows. A skill.yaml is an adapted file in its own
# right: its triggers, non-triggers, hard gates and limits are condensations of the same
# donor text the body adapts, not metadata about it.
#
# One fragment owns each adapted path: a second fragment claiming any path below is a
# merge hazard and raises provenance.conflicting-adaptation.
#
# Donor ids and commits are those pinned in provenance/upstream.lock.yaml. Every path
# below is cited in research/dossiers/build.md and was verified to exist at its pin with
# `git cat-file -e` in the pinned clone before it was written here; none was re-derived
# from memory or from a document's description of a donor.

adaptations:
  - path: skills/super-build/SKILL.md
    source: local:verifier-seat-design-report@sha256:19f676e5ce53035aaa7c25653d743119aacfa5c15879421021b63100e9110dea#L475-496
    rationale: Implementer checks become explicitly self-check evidence before independent verification reruns the frozen packet.
  - path: skills/super-build/skill.yaml
    source: local:verifier-seat-design-report@sha256:19f676e5ce53035aaa7c25653d743119aacfa5c15879421021b63100e9110dea#L475-496
    rationale: The contract separates self-check receipts from gate-eligible verifier receipts.
  - path: skills/super-verify/SKILL.md
    source: local:verifier-seat-design-report@sha256:19f676e5ce53035aaa7c25653d743119aacfa5c15879421021b63100e9110dea#L497-549
    rationale: Verification resolves or discovers a recipe, seats the verifier, drives runnable surfaces and returns artifacts without prose approval.
  - path: skills/super-verify/skill.yaml
    source: local:verifier-seat-design-report@sha256:19f676e5ce53035aaa7c25653d743119aacfa5c15879421021b63100e9110dea#L497-549
    rationale: The autonomous contract requires independent context and trusted evidence supplied fail-closed by the runner.

  # --- super-scout ---------------------------------------------------------------

  - path: skills/super-scout/SKILL.md
    source: omx@cb955b0d5becbef76d2c1f0096b6e1f238e1e7f7:skills/analyze/SKILL.md
    rationale: >-
      Evidence/Inference/Unknown labelling and the read-only stop condition are adapted into the
      dossier's confirmed/assumed pair and its unknowns list, as research/dossiers/build.md
      directs. The donor's ranked-synthesis table with a confidence verdict is dropped: this skill
      returns no verdict, and schemas/dossier.schema.json has no field that could carry one.

  - path: skills/super-scout/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-pov/references/agents/project-grounding-scout.md
    rationale: >-
      The gather-not-judge framing, the rule that an artifact's existence is evidence while its
      text is reported signal, and the dossier-plus-short-gist return split are adapted, as
      research/dossiers/build.md directs. The donor's fixed line cap on the dossier is replaced by
      the turn cap in policies/limits.yaml, which bounds what a run costs rather than how long its
      output is.

  - path: skills/super-scout/skill.yaml
    source: omx@cb955b0d5becbef76d2c1f0096b6e1f238e1e7f7:skills/analyze/SKILL.md
    rationale: >-
      The donor's stop conditions become this manifest's hard_gates and constraints — no edit, no
      recommendation the evidence cannot support, report the limit rather than manufacture
      certainty. Its evidence-labelling vocabulary becomes the confirmed/assumed constraint rows.

  - path: skills/super-scout/skill.yaml
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-pov/references/agents/project-grounding-scout.md
    rationale: >-
      The donor's output contract becomes the two declared outputs: the dossier artifact and the
      short return gist that repeats neither the dossier nor the search transcript.

  # --- super-build ---------------------------------------------------------------

  - path: skills/super-build/SKILL.md
    source: superpowers@b36e0829c6d0140e93cfef2ca599b1b07d4a7797:skills/subagent-driven-development/SKILL.md
    rationale: >-
      The per-ticket loop is adapted as research/dossiers/build.md directs: the recorded base
      commit, one implementer holding the ticket as its single source of requirements, the diff
      handed to the check seats as a file with the ticket's constraints verbatim and no pre-judged
      findings, the bounded fix loop that resumes the same implementer before dispatching a fresh
      one, and the round cap that adjudicates every open finding because a silent discard is
      forbidden. The donor's routing of fix rounds to named tiers is excluded entirely; what is
      kept is the portable mechanism it wrapped, which is that repeated failure changes the
      context rather than the standard the change must meet.

  - path: skills/super-build/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-work/references/execution-strategy.md
    rationale: >-
      Parallel dispatch is adapted from the donor's parallel-safety check: declared files, shared
      types and interfaces, migrations, generated artifacts and runtime singletons are read before
      two tickets with no dependency edge run together, uncertainty is resolved by inspection
      rather than by default, contention that survives inspection serializes exactly the
      contending pair, and a workspace change no worker accounts for is preserved for
      reconciliation rather than discarded. The donor's concurrency batch size is carried as
      guidance without a number this skill would gate on.

  - path: skills/super-build/SKILL.md
    source: addy@c004a74784a08295d52749b04cda634125b9a581:skills/incremental-implementation/SKILL.md
    rationale: >-
      The donor's scope-discipline reporting block becomes this skill's handling of an out-of-scope
      observation: file and line, what was noticed, why it is out of scope, routed to a candidate
      ticket instead of an in-place edit. The donor's numbered rule ordering is not carried, since
      the rules land here as gates rather than as a sequence.

  - path: skills/super-build/SKILL.md
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:skills/engineering/code-review/SKILL.md
    rationale: >-
      The two-axis split is adapted at the single-ticket scale: the spec axis and the standards
      axis run at once, neither merges nor re-ranks the other's findings, and one axis passing does
      not cover the other. The donor's whole-pull-request process belongs to the review lane and is
      not carried here.

  - path: skills/super-build/SKILL.md
    source: omc@5281b19e0d64f8e6dc6767f2130299a88af2dc71:skills/execute/SKILL.md
    rationale: >-
      Two boundary statements are adapted as gates: unfinished markers and stubbed or skipped tests
      are blockers rather than progress, and authoring and approval are separate passes so the lane
      that produced the work never approves it. research/dossiers/build.md names this donor as
      independent corroboration rather than the primary mechanism, and it is carried that way — the
      structural reason self-approval fails is the fresh-context requirement adapted above.

  - path: skills/super-build/skill.yaml
    source: superpowers@b36e0829c6d0140e93cfef2ca599b1b07d4a7797:skills/subagent-driven-development/SKILL.md
    rationale: >-
      The donor's loop becomes this manifest's declared limits and their enforcement: fix-rounds 5
      and implementers-per-worktree 1, the cap-reached failure outcome carrying every open finding
      with its adjudication, and the constraint rows that forbid a discard at the cap and forbid
      the implementer sitting on its own check.

  - path: skills/super-build/skill.yaml
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-work/references/execution-strategy.md
    rationale: >-
      The donor's contention surfaces become the ready-set input and the constraint that edgeless
      tickets may not be assumed independent, and its shared-workspace wave contract becomes the
      constraint that an unaccounted workspace change is never discarded.

  - path: skills/super-build/skill.yaml
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:skills/engineering/code-review/SKILL.md
    rationale: >-
      The two-axis split becomes the declared per-ticket check result: findings from each axis with
      their disposition, emitted as findings rather than as a review artifact, so a later panel
      never reads a task check as a lane it no longer has to cover.

  # --- super-verify --------------------------------------------------------------

  - path: skills/super-verify/SKILL.md
    source: superpowers@b36e0829c6d0140e93cfef2ca599b1b07d4a7797:skills/verification-before-completion/SKILL.md
    rationale: >-
      The donor's five-step gate becomes this body's workflow spine, as research/dossiers/build.md
      directs: identify the command that would prove the claim, run it fresh and complete, read the
      whole output and the exit status, confirm the claim against what the output shows, and claim
      only what the evidence supports. The donor's common-failures table becomes the
      anti-rationalization rows, and its rule that skipping a step is lying rather than verifying is
      carried as the freshness gate and bound to the receipt's revision field, which is what makes
      staleness checkable rather than remembered.

  - path: skills/super-verify/SKILL.md
    source: omc@5281b19e0d64f8e6dc6767f2130299a88af2dc71:skills/verify/SKILL.md
    rationale: >-
      Two specifics are adapted, as research/dossiers/build.md directs: the verification order —
      existing tests, then type check and build, then narrow direct commands, then manual validation
      — becomes the command-discovery step, and the donor's rule that an absent verification path is
      stated explicitly rather than bluffed becomes the recorded not-applicable and inconclusive
      outcomes with their mandatory reason.

  - path: skills/super-verify/SKILL.md
    source: addy@c004a74784a08295d52749b04cda634125b9a581:skills/test-driven-development/SKILL.md
    rationale: >-
      The donor's discover-the-stack-first rule becomes the gate that this skill runs the project's
      own commands rather than an ecosystem default, since the command field on a receipt is only
      meaningful when it names the command the project actually uses. The donor's red-green-refactor
      cycle is not carried here; it belongs to the test-first protocol the build lane names.

  - path: skills/super-verify/skill.yaml
    source: superpowers@b36e0829c6d0140e93cfef2ca599b1b07d4a7797:skills/verification-before-completion/SKILL.md
    rationale: >-
      The donor's completion-claim gate becomes this manifest's hard_gates and constraint rows: a
      description of a run is not a receipt, a receipt does not outlive the revision it names, and a
      pass is never selected out of repeated attempts. The donor's step list becomes the required
      inputs, which are what each step needs before it can run.

  - path: skills/super-verify/skill.yaml
    source: omc@5281b19e0d64f8e6dc6767f2130299a88af2dc71:skills/verify/SKILL.md
    rationale: >-
      The donor's honest-failure rule becomes the declared stop condition that a run whose checks
      all failed is complete, and the constraint that a criterion is never omitted from the matrix.

  # --- diagnose ------------------------------------------------------------------

  - path: skills/diagnose/SKILL.md
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:skills/engineering/diagnosing-bugs/SKILL.md
    rationale: >-
      The donor is the phase spine, as research/dossiers/build.md directs: the feedback loop built
      and seen to go red before any hypothesis, reproduce-and-minimise, the regression test written
      at a seam that exercises the bug as it occurs at the call site, the recorded absence of a
      correct seam as a finding rather than a shallow test, and the cleanup checklist. Its redaction
      rule becomes the secrets gate and the environment-variable command construction. The donor's
      loop-construction catalogue is not inlined: it is a catalogue, so it lives behind
      references/feedback-loops.md and the body keeps the gate.

  - path: skills/diagnose/SKILL.md
    source: superpowers@b36e0829c6d0140e93cfef2ca599b1b07d4a7797:skills/systematic-debugging/SKILL.md
    rationale: >-
      The donor's three-strikes rule is adapted with its consequence intact: the third failure is
      evidence about the shape of the problem rather than a reason to try harder, so what follows is
      the architecture question and a packet. Its red-flag list becomes the anti-rationalization
      rows, and its one-change-at-a-time rule becomes the one-variable-per-probe limit. The donor
      ends at a discussion with a human partner; here the stop is a cap-reached outcome, because
      this skill has no human channel.

  - path: skills/diagnose/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-debug/SKILL.md
    rationale: >-
      Two specifics are adapted, as research/dossiers/build.md directs: the rule that the causal
      chain is stated in full before any question about what to do with it, and the structured close
      — what was broken, the chain with locations, the tests that should have caught it, what
      changed, a confidence. The donor leaves the confidence unqualified; here it is advisory and
      recorded as such, and it closes nothing. The donor's commit, push and pull-request branch is
      dropped entirely: this skill hands its result on and the integration lane decides where it
      lands.

  - path: skills/diagnose/SKILL.md
    source: addy@c004a74784a08295d52749b04cda634125b9a581:skills/debugging-and-error-recovery/SKILL.md
    rationale: >-
      The donor's rule that error text from CI logs, third-party APIs and external services is read
      for diagnostic clues and never treated as trusted guidance becomes the captured-output gate,
      its anti-rationalization row and the threat-surface eval case. It is extended to the stack
      trace and the response body, which the donor does not name and which arrive by the same route.

  - path: skills/diagnose/references/feedback-loops.md
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:skills/engineering/diagnosing-bugs/SKILL.md
    rationale: >-
      The donor's ranked list of ways to construct a feedback loop, and its tightening guidance, are
      adapted wholesale into this reference because they are a catalogue: a body that inlined them
      would carry ten techniques to use one. The ordering is the donor's. The sections on
      intermittent bugs, performance regressions and the case where no loop can be built are drawn
      from the same donor's handling of those cases.

  - path: skills/diagnose/skill.yaml
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:skills/engineering/diagnosing-bugs/SKILL.md
    rationale: >-
      The donor's phase preconditions become this manifest's prerequisites and hard gates — no
      hypothesis before a red-capable loop, no secret in anything published — and its two end states
      become the declared outputs, with the grant deciding which one is emitted.

  - path: skills/diagnose/skill.yaml
    source: superpowers@b36e0829c6d0140e93cfef2ca599b1b07d4a7797:skills/systematic-debugging/SKILL.md
    rationale: >-
      The donor's attempt counter becomes the fix-attempts limit and the cap-reached failure
      outcome, and its refusal of a fourth attempt becomes the constraint row that names that
      refusal rather than leaving it to prose.

    rationale: >-
      The spine: scope resolution in the donor's order (caller-named, then branch against base,
      then staged and unstaged only without a usable base) and the docs-only preflight, the three
      lenses, the fix rules (edit only the scope, preserve outputs, errors, side effects and
      ordering, never simplify away a safety check, including data-loss protection and
      accessibility affordances), and verification with no relaxed assertion. Model selection,
      bounded dispatch and permission paragraphs are dropped.


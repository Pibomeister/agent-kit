# Provenance fragment for the "maintain-product" batch: six skill bodies with their manifests —
# simplify, improve-architecture, deprecate, triage, strategy and product-pulse.
#
# One row per (path, source) pair, keyed `path:` with a single `source:`, which is what
# loadAdaptationFragments reads (src/validation/provenance.ts). A file adapted from
# several donor files carries one row per donor file, so every upstream work a file
# derives from is recorded with a machine-checkable donor@commit:path.
#
# Both the body and its manifest carry rows, and so does every file under a skill's
# references/ and assets/: each is an adapted file in its own right.
#
# One fragment owns each adapted path: a second fragment claiming any path below is a
# merge hazard and raises provenance.conflicting-adaptation.
#
# Donor ids and commits are those pinned in provenance/upstream.lock.yaml. Every path
# below is cited in research/dossiers/maintain-product.md and was verified to exist at its
# pin with `git cat-file -e` in the pinned clone before it was written here.

adaptations:

  # --- simplify --------------------------------------------------------------------

